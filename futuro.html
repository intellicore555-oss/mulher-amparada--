<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mulher Amparada</title>

<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

<style>
@font-face {
  font-family: "Quicksand";
  src: url("font.ttf") format("truetype");
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Quicksand',sans-serif;
}

body{
    background:black;
    color:white;
    overflow:scroll;
    margin-bottom: 20vh;
}

#app{
    width:100vw;
    height:100vh;
    position:relative;
}

.slide{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    padding:40px;
    text-align:center;

    opacity:0;
    pointer-events:none;

    transform:translateY(20px);

    transition:0.5s ease;
}

.slide.active{
    opacity:1;
    pointer-events:auto;
    transform:translateY(0);
}

h1{
    font-size:34px;
    font-weight:700;
    margin-bottom:16px;
}

.scroll{
    width:100%;
    max-width:600px;
    max-height:55vh;

    overflow-y:auto;

    padding:16px;

    text-align:left;

    line-height:1.7;
    font-size:16px;
    color:#cfcfcf;

    border:1px solid rgba(255,255,255,0.08);
    border-radius:14px;

    background:rgba(255,255,255,0.03);
    backdrop-filter:blur(10px);

    scrollbar-width:none;
}

.scroll::-webkit-scrollbar{
    display:none;
}

/* bottom */

.bottom{
    position:fixed;
    left:0;
    right:0;
    bottom:0;

    padding:24px;
}

.counter{
    text-align:center;
    color:#777;
    font-size:14px;
    margin-bottom:12px;
}

.dots{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:20px;
}

.dot{
    width:8px;
    height:8px;
    border-radius:999px;
    background:#333;
    transition:0.3s;
}

.dot.active{
    width:28px;
    background:white;
}

/* botões */

.buttons{
    display:flex;
    gap:12px;
}

button{
    flex:1;

    border:none;
    background:white;
    color:black;

    font-size:16px;
    font-weight:700;

    padding:16px;

    border-radius:999px;

    cursor:pointer;
}

button:active{
    transform:scale(0.98);
}

button.secondary{
    background:#222;
    color:white;
}

</style>
</head>

<body>

<div id="app"></div>

<div class="bottom">

    <div class="counter" id="counter">1 / 1</div>

    <div class="dots" id="dots"></div>

    <div class="buttons">

        <button class="secondary" onclick="previousSlide()">
            Voltar
        </button>

        <button onclick="nextSlide()">
            Avançar
        </button>

    </div>

</div>

<script>

let slides = [];
let current = 0;

fetch("texto.txt")
.then(r => r.text())
.then(text => {

    const linhas = text.split("\n");

    const itens = [];

    let i = 0;

    while(i < linhas.length){

        let linha = linhas[i].trim();

        if(!linha){
            i++;
            continue;
        }

        const titulo = linha;
        i++;

        let descricao = "";

        while(i < linhas.length){

            const atual = linhas[i];
            const proxima = linhas[i+1] ? linhas[i+1].trim() : "";

            if(atual.trim() === "" && proxima !== ""){
                i++;
                break;
            }

            descricao += atual + "\n";
            i++;

        }

        itens.push({
            titulo,
            descricao: descricao.trim()
        });

    }

    criarSlides(itens);

});

function criarSlides(itens){

    const app = document.getElementById("app");
    const dots = document.getElementById("dots");
    const counter = document.getElementById("counter");

    app.innerHTML = "";
    dots.innerHTML = "";

    itens.forEach((item,index)=>{

        const slide = document.createElement("div");

        slide.className =
            index === 0 ? "slide active" : "slide";

        slide.innerHTML = `
            <h1>${item.titulo}</h1>

            <div class="scroll">
                <p>${item.descricao}</p>
            </div>
        `;

        app.appendChild(slide);

        const dot = document.createElement("div");

        dot.className =
            index === 0 ? "dot active" : "dot";

        dot.onclick = () => goToSlide(index);

        dots.appendChild(dot);

    });

    slides = document.querySelectorAll(".slide");

    counter.textContent = `1 / ${slides.length}`;

}

function goToSlide(index){

    const dots = document.querySelectorAll(".dot");

    slides[current].classList.remove("active");
    dots[current].classList.remove("active");

    current = index;

    slides[current].classList.add("active");
    dots[current].classList.add("active");

    document.getElementById("counter").textContent =
        `${current + 1} / ${slides.length}`;

}

function nextSlide(){
    goToSlide((current + 1) % slides.length);
}

function previousSlide(){
    goToSlide((current - 1 + slides.length) % slides.length);
}

</script>

</body>
</html>
