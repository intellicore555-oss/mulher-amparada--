<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#050505"
>

<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

<title>Mulher Amparada</title>


<style>

/* =========================================================
   FONTE
========================================================= */

@font-face{

    font-family:"Quicksand";

    src:url("font.ttf")
        format("truetype");

    font-display:swap;

}


/* =========================================================
   RESET
========================================================= */

*{

    margin:0;
    padding:0;

    box-sizing:border-box;

    font-family:"Quicksand",sans-serif;

    -webkit-tap-highlight-color:transparent;

}


html{

    background:#050505;

    color-scheme:dark;

}

@keyframes fadeUp {

            from {
                opacity: 0;
                transform: translateY(0px);
            }

            to {
                opacity: 1;
                transform: translateY(15px);
            }
        }
        

body{

    width:100%;

    min-height:100dvh;

    overflow:hidden;

    background:#050505;
animation:
                fadeUp 0.55s ease both;
    color:#fff;

    -webkit-font-smoothing:antialiased;

}




/* =========================================================
   APLICAÇÃO
========================================================= */

#app{

    position:relative;

    width:100%;
    height:100dvh;

    overflow:hidden;

}


/* =========================================================
   TOPO
========================================================= */

.topbar{

    position:fixed;

    z-index:100;

    top:0;
    left:0;
    right:0;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        calc(17px + env(safe-area-inset-top))
        5%
        15px;

    pointer-events:none;

}


.brand{

    display:flex;

    align-items:center;

    gap:9px;

}


.brand-icon{

    width:36px;
    height:36px;

    display:grid;

    place-items:center;

    border-radius:12px;

    background:
        linear-gradient(
            145deg,
            #ff78ae,
            #9855f4
        );

    box-shadow:
        0 7px 24px
        rgba(190,80,160,.20);

    font-size:17px;

}


.brand-name{

    color:#d7d7db;

    font-size:12px;

    font-weight:800;

}


.brand-sub{

    margin-top:1px;

    color:#55555c;

    font-size:8px;

    letter-spacing:1.2px;

    text-transform:uppercase;

}


/* =========================================================
   SLIDES
========================================================= */

.slide{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    padding:
        105px 5%
        170px;

    opacity:0;

    visibility:hidden;

    pointer-events:none;

    transform:
        translate3d(45px,0,0)
        scale(.985);

    transition:

        opacity .32s ease,

        transform .38s
        cubic-bezier(.2,.8,.2,1),

        visibility .38s;

}


.slide.active{

    opacity:1;

    visibility:visible;

    pointer-events:auto;

    transform:
        translate3d(0,0,0)
        scale(1);

}


/* =========================================================
   CABEÇALHO DA PÁGINA
========================================================= */

.slide-head{

    width:100%;

    max-width:700px;

    margin-bottom:16px;

}


.slide-meta{

    display:flex;

    align-items:center;

    gap:8px;

    margin-bottom:9px;

    color:#68686f;

    font-size:9px;

    font-weight:800;

    text-transform:uppercase;

    letter-spacing:1.5px;

}


.slide-meta::before{

    content:"";

    width:6px;
    height:6px;

    border-radius:50%;

    background:#ff79b0;

    box-shadow:
        0 0 12px
        rgba(255,121,176,.65);

}


h1{

    width:100%;

    color:#f5f5f6;

    font-size:
        clamp(
            28px,
            7vw,
            44px
        );

    line-height:1.08;

    letter-spacing:-1.5px;

    font-weight:800;

    text-align:left;

    overflow-wrap:anywhere;

}


/* =========================================================
   LEITOR
========================================================= */

.reader{

    position:relative;

    width:100%;

    max-width:700px;

    max-height:
        min(
            48vh,
            520px
        );

    overflow-y:auto;

    padding:22px 20px;

    border:
        1px solid
        rgba(255,255,255,.065);

    border-radius:23px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.018)
        );

    box-shadow:
        0 18px 55px
        rgba(0,0,0,.35),

        inset 0 1px 0
        rgba(255,255,255,.025);

    scrollbar-width:none;

    overscroll-behavior:contain;

}


.reader::-webkit-scrollbar{

    display:none;

}


/* barra lateral */

.reader::before{

    content:"";

    position:absolute;

    left:0;
    top:25px;
    bottom:25px;

    width:3px;

    border-radius:
        0 5px 5px 0;

    background:
        linear-gradient(
            180deg,
            #ff78ae,
            #a855f7
        );

    opacity:.75;

}


.reader p{

    color:#b5b5bb;

    font-size:
        clamp(
            14px,
            3.8vw,
            16px
        );

    line-height:1.85;

    white-space:pre-wrap;

    overflow-wrap:anywhere;

}


.reader p::first-letter{

    color:#fff;

}


/* =========================================================
   RODAPÉ DA LEITURA
========================================================= */

.reader-footer{

    width:100%;

    max-width:700px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-top:10px;

    color:#4e4e55;

    font-size:9px;

    text-transform:uppercase;

    letter-spacing:1px;

}


/* =========================================================
   NAVEGAÇÃO
========================================================= */

.navigation{

    position:fixed;

    z-index:100;

    left:0;
    right:0;
    bottom:0;

    padding:
        12px
        5%
        calc(
            15px +
            env(safe-area-inset-bottom)
        );

    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(5,5,5,.78) 25%,
            #050505 55%
        );

    backdrop-filter:
        blur(16px);

    -webkit-backdrop-filter:
        blur(16px);

}


/* =========================================================
   PROGRESSO
========================================================= */

.progress-info{

    width:100%;

    max-width:700px;

    margin:0 auto 8px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    color:#57575e;

    font-size:9px;

    font-weight:700;

    text-transform:uppercase;

    letter-spacing:1px;

}


.progress-bar{

    width:100%;

    max-width:700px;

    height:3px;

    margin:0 auto 12px;

    border-radius:999px;

    overflow:hidden;

    background:#18181a;

}


.progress-fill{

    width:0%;

    height:100%;

    border-radius:inherit;

    background:
        linear-gradient(
            90deg,
            #ff78ae,
            #a855f7
        );

    transition:
        width .35s
        cubic-bezier(.2,.8,.2,1);

}


/* =========================================================
   BOTÕES
========================================================= */

.buttons{

    width:100%;

    max-width:700px;

    margin:auto;

    display:grid;

    grid-template-columns:
        1fr
        1.5fr;

    gap:8px;

}


button{

    min-height:53px;

    border:
        1px solid
        rgba(255,255,255,.07);

    border-radius:17px;

    background:#111;

    color:#eee;

    font-family:inherit;

    font-size:12px;

    font-weight:800;

    cursor:pointer;

    transition:

        transform .15s ease,

        background .15s ease,

        border-color .15s ease;

}


button.primary{

    border-color:
        rgba(255,255,255,.12);

    background:#f4f4f4;

    color:#050505;

}


button:active{

    transform:scale(.975);

}


button:disabled{

    opacity:.3;

    pointer-events:none;

}


@media(hover:hover){

    button:hover{

        border-color:
            rgba(255,255,255,.16);

        background:#181818;

    }

    button.primary:hover{

        background:#fff;

        box-shadow:
            0 8px 25px
            rgba(255,255,255,.08);

    }

}


/* =========================================================
   DOTS
========================================================= */

.dots{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:5px;

    margin-top:10px;

}


.dot{

    width:5px;
    height:5px;

    border:0;

    padding:0;

    min-height:5px;

    border-radius:999px;

    background:#29292c;

    transition:
        width .25s ease,
        background .25s ease;

}


.dot.active{

    width:20px;

    background:
        linear-gradient(
            90deg,
            #ff78ae,
            #a855f7
        );

}


/* =========================================================
   CARREGANDO
========================================================= */

.loading{

    position:fixed;

    inset:0;

    z-index:500;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:14px;

    background:#050505;

    transition:
        opacity .3s ease;

}


.loading.hidden{

    opacity:0;

    pointer-events:none;

}


.loader{

    width:30px;
    height:30px;

    border-radius:50%;

    border:
        2px solid
        #222;

    border-top-color:#ff78ae;

    border-right-color:#a855f7;

    animation:
        spin .8s
        linear infinite;

}


.loading-text{

    color:#55555c;

    font-size:9px;

    letter-spacing:1.5px;

    text-transform:uppercase;

}


@keyframes spin{

    to{

        transform:rotate(360deg);

    }

}


/* =========================================================
   ERRO
========================================================= */

.error{

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    gap:10px;

    padding:30px;

}


.error strong{

    font-size:20px;

}


.error span{

    color:#777;

    font-size:12px;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:420px){

    .brand-sub{

        display:none;

    }

    .slide{

        padding:
            95px 5%
            166px;

    }

    h1{

        font-size:28px;

        letter-spacing:-1px;

    }

    .reader{

        padding:
            19px 17px;

        max-height:46vh;

        border-radius:20px;

    }

    .reader p{

        font-size:13px;

        line-height:1.78;

    }

    button{

        min-height:50px;

        border-radius:15px;

    }

}


@media(max-height:650px){

    .slide{

        padding-top:82px;

        padding-bottom:155px;

    }

    .slide-head{

        margin-bottom:10px;

    }

    .reader{

        max-height:42vh;

    }

    .navigation{

        padding-top:8px;

    }

}


/* =========================================================
   REDUÇÃO DE MOVIMENTO
========================================================= */

@media(prefers-reduced-motion:reduce){

    *{

        animation:none !important;

        transition:none !important;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     CARREGAMENTO
===================================================== -->

<div class="loading" id="loading">

    <div class="loader"></div>

    <div class="loading-text">
        Carregando conteúdo
    </div>

</div>


<!-- =====================================================
     TOPO
===================================================== -->




<!-- =====================================================
     APP
===================================================== -->

<main id="app"></main>


<!-- =====================================================
     NAVEGAÇÃO
===================================================== -->

<footer class="navigation">

    <div class="progress-info">

        <span id="counter">
            01 / 01
        </span>

        <span id="percentage">
            0%
        </span>

    </div>


    <div class="progress-bar">

        <div
            class="progress-fill"
            id="progress"
        ></div>

    </div>


    <div
        class="buttons"
        id="buttons"
    >

        <button
            class="secondary"
            id="previous"
            style="border-radius: 200px;"
            onclick="previousSlide()"
        >
            Voltar
        </button>

        <button
            class="primary"
            style="border-radius: 200px;"
                        id="next"
            onclick="nextSlide()"
        >
            Avançar
        </button>

    </div>


    <div
        class="dots"
        id="dots"
    ></div>

</footer>


<script>

/* =========================================================
   ESTADO
========================================================= */

let slides = [];

let current = 0;

let touchStartX = 0;

let touchStartY = 0;


/* =========================================================
   ELEMENTOS
========================================================= */

const app =
    document.getElementById("app");

const dots =
    document.getElementById("dots");

const counter =
    document.getElementById("counter");

const percentage =
    document.getElementById("percentage");

const progress =
    document.getElementById("progress");

const previous =
    document.getElementById("previous");

const next =
    document.getElementById("next");

const loading =
    document.getElementById("loading");


/* =========================================================
   CARREGAR TEXTO
========================================================= */

fetch("texto.txt", {
    cache:"no-store"
})

.then(response => {

    if(!response.ok){

        throw new Error(
            "Não foi possível carregar texto.txt"
        );

    }

    return response.text();

})

.then(text => {

    const itens =
        interpretarTexto(text);

    criarSlides(itens);

    loading.classList.add("hidden");

})

.catch(error => {

    console.error(error);

    loading.innerHTML = `

        <div class="error">

            <strong>
                Não foi possível carregar
            </strong>

            <span>
                Verifique se o arquivo
                <b>texto.txt</b>
                está disponível.
            </span>

        </div>

    `;

});


/* =========================================================
   INTERPRETAR TEXTO
========================================================= */

function interpretarTexto(text){

    const linhas =
        text.replace(/\r/g,"").split("\n");

    const itens = [];

    let i = 0;


    while(i < linhas.length){

        while(
            i < linhas.length &&
            linhas[i].trim() === ""
        ){

            i++;

        }


        if(i >= linhas.length){

            break;

        }


        const titulo =
            linhas[i].trim();

        i++;


        const descricao = [];


        while(i < linhas.length){

            const atual =
                linhas[i];

            const proxima =
                linhas[i + 1]
                ? linhas[i + 1].trim()
                : "";


            if(
                atual.trim() === "" &&
                proxima !== ""
            ){

                i++;

                break;

            }


            descricao.push(atual);

            i++;

        }


        itens.push({

            titulo,

            descricao:
                descricao
                    .join("\n")
                    .trim()

        });

    }


    return itens;

}


/* =========================================================
   CRIAR SLIDES
========================================================= */

function criarSlides(itens){

    app.innerHTML = "";

    dots.innerHTML = "";


    if(!itens.length){

        app.innerHTML = `

            <div class="error">

                <strong>
                    Nenhum conteúdo encontrado
                </strong>

                <span>
                    O arquivo texto.txt está vazio.
                </span>

            </div>

        `;

        return;

    }


    itens.forEach((item,index) => {


        /* SLIDE */

        const slide =
            document.createElement("section");

        slide.className =
            "slide" +
            (index === 0
                ? " active"
                : "");


        /* CABEÇALHO */

        const head =
            document.createElement("div");

        head.className =
            "slide-head";


        const meta =
            document.createElement("div");

        meta.className =
            "slide-meta";

        meta.textContent =
            `Parte ${String(index + 1)
                .padStart(2,"0")}`;


        const title =
            document.createElement("h1");

        title.textContent =
            item.titulo;


        head.appendChild(meta);

        head.appendChild(title);


        /* LEITOR */

        const reader =
            document.createElement("div");

        reader.className =
            "reader";


        const paragraph =
            document.createElement("p");

        paragraph.textContent =
            item.descricao;


        reader.appendChild(paragraph);


        /* FOOTER */

        const readerFooter =
            document.createElement("div");

        readerFooter.className =
            "reader-footer";

        readerFooter.innerHTML = `

            <span>
                Mulher Amparada
            </span>

            <span>
                leitura
            </span>

        `;


        slide.appendChild(head);

        slide.appendChild(reader);

        slide.appendChild(readerFooter);

        app.appendChild(slide);


        /* DOT */

        const dot =
            document.createElement("button");

        dot.className =
            "dot" +
            (index === 0
                ? " active"
                : "");

        dot.setAttribute(
            "aria-label",
            `Ir para parte ${index + 1}`
        );

        dot.onclick = () =>
            goToSlide(index);


        dots.appendChild(dot);

    });


    slides =
        Array.from(
            document.querySelectorAll(".slide")
        );


    updateUI();

}


/* =========================================================
   IR PARA SLIDE
========================================================= */

function goToSlide(index){

    if(!slides.length){

        return;

    }


    if(index < 0){

        index = 0;

    }


    if(index >= slides.length){

        index =
            slides.length - 1;

    }


    slides[current]
        ?.classList
        .remove("active");


    document
        .querySelectorAll(".dot")[current]
        ?.classList
        .remove("active");


    current = index;


    slides[current]
        ?.classList
        .add("active");


    document
        .querySelectorAll(".dot")[current]
        ?.classList
        .add("active");


    updateUI();

}


/* =========================================================
   ATUALIZAR INTERFACE
========================================================= */

function updateUI(){

    if(!slides.length){

        return;

    }


    const total =
        slides.length;


    const numero =
        String(current + 1)
            .padStart(2,"0");


    const totalNumero =
        String(total)
            .padStart(2,"0");


    counter.textContent =
        `${numero} / ${totalNumero}`;


    const percent =
        total === 1
            ? 100
            : Math.round(
                ((current + 1) / total) * 100
            );


    percentage.textContent =
        `${percent}%`;


    progress.style.width =
        `${percent}%`;


    previous.disabled =
        current === 0;


    next.textContent =
        current === total - 1
            ? "Concluir"
            : "Avançar";

}


/* =========================================================
   PRÓXIMO
========================================================= */

function nextSlide(){

    if(!slides.length){

        return;

    }


    if(current < slides.length - 1){

        goToSlide(current + 1);

    }

}


/* =========================================================
   ANTERIOR
========================================================= */

function previousSlide(){

    if(!slides.length){

        return;

    }


    if(current > 0){

        goToSlide(current - 1);

    }

}


/* =========================================================
   TECLADO
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(event.key === "ArrowRight"){

            nextSlide();

        }

        if(event.key === "ArrowLeft"){

            previousSlide();

        }

    }
);


/* =========================================================
   SWIPE MOBILE
========================================================= */

document.addEventListener(
    "touchstart",
    event => {

        if(!event.touches.length){

            return;

        }

        touchStartX =
            event.touches[0].clientX;

        touchStartY =
            event.touches[0].clientY;

    },
    {passive:true}
);


document.addEventListener(
    "touchend",
    event => {

        if(!event.changedTouches.length){

            return;

        }


        const endX =
            event.changedTouches[0].clientX;

        const endY =
            event.changedTouches[0].clientY;


        const deltaX =
            endX - touchStartX;

        const deltaY =
            endY - touchStartY;


        /* evita confundir scroll vertical com swipe */

        if(
            Math.abs(deltaX) < 60 ||
            Math.abs(deltaX) < Math.abs(deltaY)
        ){

            return;

        }


        if(deltaX < 0){

            nextSlide();

        }else{

            previousSlide();

        }

    },
    {passive:true}
);

</script>

</body>

</html>
