<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#050505"
>

<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

<title>Mulher Amparada</title>


<style>

/* =========================================================
   FONTE
========================================================= */

@font-face {
    font-family: "Quicksand";
    src: url("font.ttf") format("truetype");
    font-display: swap;
}


/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

    font-family: "Quicksand", sans-serif;

    -webkit-tap-highlight-color: transparent;
}


html {
    width: 100%;
    min-height: 100%;

    background: #050505;

    color-scheme: dark;

    overflow: hidden;
}


body {
    width: 100%;
    min-height: 100dvh;

    background: #050505;

    color: #fff;

    overflow: hidden;

    -webkit-font-smoothing: antialiased;
}


/* =========================================================
   ANIMAÇÃO
========================================================= */

@keyframes pageEnter {

    from {
        opacity: 0;
        
    }

    to {
        opacity: 1;
        
    }
}


/* =========================================================
   APP
========================================================= */

#app {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100dvh;

    overflow: hidden;
}


/* =========================================================
   SLIDES
========================================================= */

.slide {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100dvh;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-start;

    /*
        Espaço reservado para:
        topo
        conteúdo
        navegação
    */

    padding:

        calc(
            30px +
            env(safe-area-inset-top)
        )

        5%

        calc(
            150px +
            env(safe-area-inset-bottom)
        );

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transform: translateX(35px) scale(.99);

    transition:
        opacity .3s ease,
        transform .35s cubic-bezier(.2,.8,.2,1),
        visibility .35s;
}


.slide.active {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;

    transform:
        translateX(0)
        scale(1);

    animation:
        pageEnter .4s ease both;
}


/* =========================================================
   CABEÇALHO
========================================================= */

.slide-head {

    width: 100%;

    max-width: 720px;

    flex-shrink: 0;

    margin-bottom: 18px;
}


.slide-meta {

    display: flex;

    align-items: center;

    gap: 8px;

    margin-bottom: 8px;

    color: #6a6a72;

    font-size: 9px;

    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: 1.5px;
}


.slide-meta::before {

    content: "";

    width: 6px;
    height: 6px;

    flex-shrink: 0;

    border-radius: 50%;

    background: #ff78ae;

    box-shadow:
        0 0 12px
        rgba(255,121,176,.65);
}


h1 {

    width: 100%;

    color: #f5f5f6;

    font-size:
        clamp(
            27px,
            7vw,
            44px
        );

    line-height: 1.08;

    letter-spacing: -1.4px;

    font-weight: 800;

    text-align: left;

    overflow-wrap: anywhere;
}


/* =========================================================
   LEITOR
========================================================= */

.reader {

    position: relative;

    width: 100%;

    max-width: 720px;

    /*
        O leitor ocupa o espaço disponível
        sem passar por cima da navegação.
    */

    flex: 1 1 auto;

    min-height: 0;

    overflow-y: auto;

    padding:
        23px
        21px;

    border:
        1px solid
        rgba(255,255,255,.065);

    border-radius: 24px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.018)
        );

    box-shadow:

        0 18px 55px
        rgba(0,0,0,.38),

        inset
        0 1px 0
        rgba(255,255,255,.025);

    scrollbar-width: none;

    overscroll-behavior: contain;

    -webkit-overflow-scrolling: touch;
}


.reader::-webkit-scrollbar {
    display: none;
}


/* =========================================================
   LINHA LATERAL
========================================================= */

.reader::before {

    content: "";

    position: absolute;

    left: 0;

    top: 24px;
    bottom: 24px;

    width: 3px;

    border-radius:
        0 6px 6px 0;

    background:
        linear-gradient(
            180deg,
            #ff78ae,
            #a855f7
        );

    opacity: .75;

    pointer-events: none;
}


/* =========================================================
   TEXTO
========================================================= */

.reader p {

    color: #b9b9c0;

    font-size:
        clamp(
            14px,
            3.8vw,
            16px
        );

    line-height: 1.85;

    white-space: pre-wrap;

    overflow-wrap: anywhere;

    word-break: normal;
}


.reader p::first-letter {
    color: #fff;
}


/* =========================================================
   FOOTER DO LEITOR
========================================================= */

.reader-footer {

    width: 100%;

    max-width: 720px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-top: 9px;

    color: #4e4e55;

    font-size: 9px;

    text-transform: uppercase;

    letter-spacing: 1px;
}


/* =========================================================
   NAVEGAÇÃO
========================================================= */

.navigation {

    position: fixed;

    z-index: 100;

    left: 0;
    right: 0;
    bottom: 0;

    width: 100%;

    padding:

        10px
        5%

        calc(
            13px +
            env(safe-area-inset-bottom)
        );

    background:

        linear-gradient(
            180deg,
            rgba(5,5,5,0),
            rgba(5,5,5,.88) 25%,
            #050505 52%
        );

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);
}


/* =========================================================
   PROGRESSO
========================================================= */

.progress-info {

    width: 100%;

    max-width: 720px;

    margin:
        0 auto 7px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    color: #595960;

    font-size: 9px;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 1px;
}


.progress-bar {

    width: 100%;

    max-width: 720px;

    height: 3px;

    margin:
        0 auto 11px;

    overflow: hidden;

    border-radius: 999px;

    background: #18181a;
}


.progress-fill {

    width: 0%;

    height: 100%;

    border-radius: inherit;

    background:
        linear-gradient(
            90deg,
            #ff78ae,
            #a855f7
        );

    transition:
        width .35s
        cubic-bezier(.2,.8,.2,1);
}


/* =========================================================
   BOTÕES
========================================================= */

.buttons {

    width: 100%;

    max-width: 720px;

    margin: 0 auto;

    display: grid;

    grid-template-columns:
        minmax(0, .85fr)
        minmax(0, 1.15fr);

    gap: 8px;
}


button {

    width: 100%;

    min-width: 0;

    min-height: 52px;

    padding:
        0 16px;

    border:
        1px solid
        rgba(255,255,255,.07);

    border-radius: 999px;

    background: #111;

    color: #eee;

    font-family: inherit;

    font-size: 12px;

    font-weight: 800;

    cursor: pointer;

    transition:

        transform .15s ease,

        background .15s ease,

        border-color .15s ease,

        box-shadow .15s ease;
}


button.primary {

    border-color:
        rgba(255,255,255,.12);

    background: #f4f4f4;

    color: #050505;
}


button:active {

    transform:
        scale(.975);
}


button:disabled {

    opacity: .3;

    pointer-events: none;
}


@media(hover:hover) {

    button:hover {

        border-color:
            rgba(255,255,255,.16);

        background: #181818;
    }


    button.primary:hover {

        background: #fff;

        box-shadow:
            0 8px 25px
            rgba(255,255,255,.08);
    }
}


/* =========================================================
   DOTS
========================================================= */

.dots {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 5px;

    min-height: 5px;

    margin-top: 9px;
}


.dot {

    width: 5px;
    height: 5px;

    min-height: 5px;

    padding: 0;

    border: 0;

    border-radius: 999px;

    background: #29292c;

    transition:

        width .25s ease,

        background .25s ease;
}


.dot.active {

    width: 20px;

    background:
        linear-gradient(
            90deg,
            #ff78ae,
            #a855f7
        );
}


/* =========================================================
   CARREGAMENTO
========================================================= */

.loading {

    position: fixed;

    inset: 0;

    z-index: 500;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 14px;

    background: #050505;

    transition:
        opacity .3s ease;
}


.loading.hidden {

    opacity: 0;

    pointer-events: none;
}


.loader {

    width: 30px;
    height: 30px;

    border-radius: 50%;

    border:
        2px solid
        #222;

    border-top-color:
        #ff78ae;

    border-right-color:
        #a855f7;

    animation:
        spin .8s
        linear infinite;
}


.loading-text {

    color: #55555c;

    font-size: 9px;

    letter-spacing: 1.5px;

    text-transform: uppercase;
}


@keyframes spin {

    to {
        transform: rotate(360deg);
    }
}


/* =========================================================
   ERRO
========================================================= */

.error {

    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 10px;

    padding: 30px;

    text-align: center;
}


.error strong {

    font-size: 20px;
}


.error span {

    color: #777;

    font-size: 12px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 600px) {

    .slide {

        padding-left: 5%;
        padding-right: 5%;

        padding-top:
            calc(
                25px +
                env(safe-area-inset-top)
            );

        padding-bottom:
            calc(
                145px +
                env(safe-area-inset-bottom)
            );
    }


    .slide-head {

        margin-bottom: 14px;
    }


    h1 {

        font-size:
            clamp(
                26px,
                8vw,
                34px
            );

        letter-spacing: -1px;
    }


    .reader {

        padding:
            20px 18px;

        border-radius: 21px;
    }


    .reader p {

        font-size: 14px;

        line-height: 1.78;
    }


    .navigation {

        padding-left: 5%;
        padding-right: 5%;
    }


    button {

        min-height: 50px;

        font-size: 11px;
    }
}


/* =========================================================
   TELAS MUITO PEQUENAS
========================================================= */

@media(max-width: 420px) {

    .slide {

        padding-left: 4.5%;
        padding-right: 4.5%;

        padding-bottom:
            calc(
                140px +
                env(safe-area-inset-bottom)
            );
    }


    .slide-head {

        margin-bottom: 12px;
    }


    .slide-meta {

        margin-bottom: 6px;

        font-size: 8px;
    }


    h1 {

        font-size: 27px;
    }


    .reader {

        padding:
            18px 16px;

        border-radius: 19px;
    }


    .reader p {

        font-size: 13px;

        line-height: 1.75;
    }


    .reader::before {

        top: 20px;
        bottom: 20px;
    }


    .reader-footer {

        font-size: 8px;
    }


    .buttons {

        gap: 7px;
    }


    button {

        min-height: 48px;

        padding:
            0 12px;

        font-size: 10px;
    }
}


/* =========================================================
   ALTURA PEQUENA
========================================================= */

@media(max-height: 700px) {

    .slide {

        padding-top:
            calc(
                18px +
                env(safe-area-inset-top)
            );

        padding-bottom:
            calc(
                138px +
                env(safe-area-inset-bottom)
            );
    }


    .slide-head {

        margin-bottom: 10px;
    }


    h1 {

        font-size:
            clamp(
                24px,
                6vw,
                32px
            );
    }


    .reader {

        padding:
            17px 16px;
    }


    .reader p {

        line-height: 1.7;
    }


    .reader-footer {

        margin-top: 7px;
    }


    .navigation {

        padding-top: 7px;
    }


    .progress-bar {

        margin-bottom: 8px;
    }


    button {

        min-height: 46px;
    }


    .dots {

        margin-top: 7px;
    }
}


/* =========================================================
   ALTURA EXTREMAMENTE PEQUENA
========================================================= */

@media(max-height: 580px) {

    .slide {

        padding-top:
            calc(
                12px +
                env(safe-area-inset-top)
            );

        padding-bottom:
            calc(
                125px +
                env(safe-area-inset-bottom)
            );
    }


    .slide-head {

        margin-bottom: 7px;
    }


    .slide-meta {

        display: none;
    }


    h1 {

        font-size: 23px;
    }


    .reader {

        padding:
            14px;

        border-radius: 17px;
    }


    .reader p {

        font-size: 12px;

        line-height: 1.6;
    }


    .reader-footer {

        display: none;
    }


    .navigation {

        padding-top: 5px;
    }


    .progress-info {

        margin-bottom: 4px;

        font-size: 8px;
    }


    .progress-bar {

        margin-bottom: 6px;
    }


    button {

        min-height: 42px;

        font-size: 10px;
    }


    .dots {

        margin-top: 5px;
    }
}

</style>

</head>


<body>


<!-- =====================================================
     CARREGAMENTO
===================================================== -->

<div class="loading" id="loading">

    <div class="loader"></div>

    <div class="loading-text">
        Carregando conteúdo
    </div>

</div>


<!-- =====================================================
     TOPO
===================================================== -->




<!-- =====================================================
     APP
===================================================== -->

<main id="app"></main>


<!-- =====================================================
     NAVEGAÇÃO
===================================================== -->

<footer class="navigation">

    <div class="progress-info">

        <span id="counter">
            01 / 01
        </span>

        <span id="percentage">
            0%
        </span>

    </div>


    <div class="progress-bar">

        <div
            class="progress-fill"
            id="progress"
        ></div>

    </div>


    <div
        class="buttons"
        id="buttons"
    >

        <button
            class="secondary"
            id="previous"
            
            onclick="previousSlide()"
        >
            Voltar
        </button>

        <button
            class="primary"
            
                        id="next"
            onclick="nextSlide()"
        >
            Avançar
        </button>

    </div>


    <div
        class="dots"
        id="dots"
    ></div>

</footer>


<script>

/* =========================================================
   ESTADO
========================================================= */

let slides = [];

let current = 0;

let touchStartX = 0;

let touchStartY = 0;


/* =========================================================
   ELEMENTOS
========================================================= */

const app =
    document.getElementById("app");

const dots =
    document.getElementById("dots");

const counter =
    document.getElementById("counter");

const percentage =
    document.getElementById("percentage");

const progress =
    document.getElementById("progress");

const previous =
    document.getElementById("previous");

const next =
    document.getElementById("next");

const loading =
    document.getElementById("loading");


/* =========================================================
   CARREGAR TEXTO
========================================================= */

function carregarTexto() {

    const xhr =
        new XMLHttpRequest();


    xhr.open(
        "GET",
        "texto99.txt",
        true
    );


    xhr.onload = function () {

        if (
            xhr.status === 200 ||
            xhr.status === 0
        ) {

            const text =
                xhr.responseText;


            const itens =
                interpretarTexto(text);


            criarSlides(itens);


            loading.classList.add(
                "hidden"
            );

        } else {

            console.error(
                "Erro HTTP:",
                xhr.status
            );


            mostrarErro();

        }

    };


    xhr.onerror = function () {

        console.error(
            "Erro ao carregar texto99.txt"
        );


        mostrarErro();

    };


    xhr.send();

}


/* =========================================================
   MOSTRAR ERRO
========================================================= */

function mostrarErro() {

    loading.innerHTML = `

        <div class="error">

            <strong>
                Não foi possível carregar
            </strong>

            <span>
                Verifique se o arquivo
                <b>texto99.txt</b>
                está disponível.
            </span>

        </div>

    `;

}


/* =========================================================
   INTERPRETAR TEXTO
========================================================= */

function interpretarTexto(text) {

    const linhas =
        text
            .replace(/\r/g, "")
            .split("\n");


    const itens = [];

    let i = 0;


    while (i < linhas.length) {

        /* Ignora linhas vazias */

        while (
            i < linhas.length &&
            linhas[i].trim() === ""
        ) {

            i++;

        }


        if (i >= linhas.length) {

            break;

        }


        /* Primeira linha = título */

        const titulo =
            linhas[i].trim();

        i++;


        const descricao = [];


        /* Lê o conteúdo */

        while (i < linhas.length) {

            const atual =
                linhas[i];

            const proxima =
                linhas[i + 1]
                    ? linhas[i + 1].trim()
                    : "";


            /*
                Uma linha vazia seguida
                de conteúdo inicia outro slide.
            */

            if (
                atual.trim() === "" &&
                proxima !== ""
            ) {

                i++;

                break;

            }


            descricao.push(
                atual
            );

            i++;

        }


        itens.push({

            titulo,

            descricao:
                descricao
                    .join("\n")
                    .trim()

        });

    }


    return itens;

}


/* =========================================================
   CRIAR SLIDES
========================================================= */

function criarSlides(itens) {

    app.innerHTML = "";

    dots.innerHTML = "";


    if (!itens.length) {

        app.innerHTML = `

            <div class="error">

                <strong>
                    Nenhum conteúdo encontrado
                </strong>

                <span>
                    O arquivo texto99.txt está vazio.
                </span>

            </div>

        `;

        return;

    }


    itens.forEach(
        (item, index) => {

            /* =================================================
               SLIDE
            ================================================= */

            const slide =
                document.createElement(
                    "section"
                );


            slide.className =
                "slide" +
                (
                    index === 0
                        ? " active"
                        : ""
                );


            /* =================================================
               CABEÇALHO
            ================================================= */

            const head =
                document.createElement(
                    "div"
                );


            head.className =
                "slide-head";


            const meta =
                document.createElement(
                    "div"
                );


            meta.className =
                "slide-meta";


            meta.textContent =
                `Parte ${String(index + 1)
                    .padStart(2, "0")}`;


            const title =
                document.createElement(
                    "h1"
                );


            title.textContent =
                item.titulo;


            head.appendChild(
                meta
            );


            head.appendChild(
                title
            );


            /* =================================================
               LEITOR
            ================================================= */

            const reader =
                document.createElement(
                    "div"
                );


            reader.className =
                "reader";


            const paragraph =
                document.createElement(
                    "p"
                );


            paragraph.textContent =
                item.descricao;


            reader.appendChild(
                paragraph
            );


            /* =================================================
               FOOTER
            ================================================= */

            const readerFooter =
                document.createElement(
                    "div"
                );


            readerFooter.className =
                "reader-footer";


            readerFooter.innerHTML = `

                <span>
                    Mulher Amparada
                </span>

                <span>
                    leitura
                </span>

            `;


            /* =================================================
               MONTAR SLIDE
            ================================================= */

            slide.appendChild(
                head
            );


            slide.appendChild(
                reader
            );


            slide.appendChild(
                readerFooter
            );


            app.appendChild(
                slide
            );


            /* =================================================
               DOT
            ================================================= */

            const dot =
                document.createElement(
                    "button"
                );


            dot.className =
                "dot" +
                (
                    index === 0
                        ? " active"
                        : ""
                );


            dot.setAttribute(
                "aria-label",
                `Ir para parte ${index + 1}`
            );


            dot.onclick = function () {

                goToSlide(index);

            };


            dots.appendChild(
                dot
            );

        }
    );


    slides =
        Array.from(
            document.querySelectorAll(
                ".slide"
            )
        );


    updateUI();

}


/* =========================================================
   IR PARA SLIDE
========================================================= */

function goToSlide(index) {

    if (!slides.length) {

        return;

    }


    if (index < 0) {

        index = 0;

    }


    if (index >= slides.length) {

        index =
            slides.length - 1;

    }


    slides[current]
        ?.classList
        .remove("active");


    document
        .querySelectorAll(".dot")[current]
        ?.classList
        .remove("active");


    current =
        index;


    slides[current]
        ?.classList
        .add("active");


    document
        .querySelectorAll(".dot")[current]
        ?.classList
        .add("active");


    updateUI();

}


/* =========================================================
   ATUALIZAR INTERFACE
========================================================= */

function updateUI() {

    if (!slides.length) {

        return;

    }


    const total =
        slides.length;


    const numero =
        String(current + 1)
            .padStart(2, "0");


    const totalNumero =
        String(total)
            .padStart(2, "0");


    counter.textContent =
        `${numero} / ${totalNumero}`;


    const percent =
        total === 1
            ? 100
            : Math.round(
                (
                    (current + 1) /
                    total
                ) * 100
            );


    percentage.textContent =
        `${percent}%`;


    progress.style.width =
        `${percent}%`;


    previous.disabled =
        current === 0;


    next.textContent =
        current === total - 1
            ? "Concluir"
            : "Avançar";

}


/* =========================================================
   PRÓXIMO
========================================================= */

function nextSlide() {

    if (!slides.length) {

        return;

    }


    if (
        current <
        slides.length - 1
    ) {

        goToSlide(
            current + 1
        );

    }

}


/* =========================================================
   ANTERIOR
========================================================= */

function previousSlide() {

    if (!slides.length) {

        return;

    }


    if (current > 0) {

        goToSlide(
            current - 1
        );

    }

}


/* =========================================================
   TECLADO
========================================================= */

document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key ===
            "ArrowRight"
        ) {

            nextSlide();

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            previousSlide();

        }

    }
);


/* =========================================================
   SWIPE MOBILE
========================================================= */

document.addEventListener(
    "touchstart",
    function (event) {

        if (
            !event.touches.length
        ) {

            return;

        }


        touchStartX =
            event.touches[0].clientX;


        touchStartY =
            event.touches[0].clientY;

    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchend",
    function (event) {

        if (
            !event.changedTouches.length
        ) {

            return;

        }


        const endX =
            event.changedTouches[0]
                .clientX;


        const endY =
            event.changedTouches[0]
                .clientY;


        const deltaX =
            endX - touchStartX;


        const deltaY =
            endY - touchStartY;


        /*
            Evita confundir o scroll
            vertical com swipe.
        */

        if (
            Math.abs(deltaX) < 60 ||
            Math.abs(deltaX) <
                Math.abs(deltaY)
        ) {

            return;

        }


        if (deltaX < 0) {

            nextSlide();

        } else {

            previousSlide();

        }

    },
    {
        passive: true
    }
);


/* =========================================================
   INICIAR
========================================================= */

carregarTexto();

</script>
