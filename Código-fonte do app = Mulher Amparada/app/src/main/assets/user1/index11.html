<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Launcher</title>

<style>
/* =========================================================
   BARRAS DE ROLAGEM — TOTALMENTE TRANSPARENTES
========================================================= */

/* Chrome, Edge, Safari, Android WebView */
*::-webkit-scrollbar {
    width: 0;
    height: 0;
    background: transparent;
}

*::-webkit-scrollbar-track {
    background: transparent;
}

*::-webkit-scrollbar-thumb {
    background: transparent;
    border: none;
}

/* Firefox */
* {
    scrollbar-width: none;
    scrollbar-color: transparent transparent;
}



/* Página */
html,
body {
background: #000;
    scrollbar-width: none;
    scrollbar-color: transparent transparent;
}

/* Remove qualquer fundo da área de rolagem */
html::-webkit-scrollbar,
body::-webkit-scrollbar {
    width: 0;
    height: 0;
    background: transparent;
}



/* =========================================================
   BASE
========================================================= */

@font-face {

    font-family: Quicksand;

    src:
        url("font.ttf")
        format("truetype");

    font-display: swap;
}


* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
}

html,
body {
    
    padding: 0;

    width: 90%;
    height: 100%;

    background: #000;
    color: #fff;

    font-family: Quicksand, sans-serif;

    
}

@keyframes transformar {
  from {
    transform: scale(0.5);
  }

  to {
    transform: scale(1);
  }
}

body {
    width: 100%;
    margin-left: 5%;
    margin-right: 5%;
    margin-top: 10%;
    overflow: hidden;
}


/* =========================================================
   CONTAINER
========================================================= */

.launcher {
    width: 100%;
    height: 100vh;

    max-width: 760px;

    margin: auto;

    padding:
        10px
        0
        8px;

    display: flex;
    flex-direction: column;
}


/* =========================================================
   TOPO
========================================================= */

.top {
    display: flex;

    align-items: center;
    justify-content: space-between;
}

.profile {
    display: flex;

    align-items: center;

    gap: 10px;
}

.profile img {
    width: 42px;
    height: 42px;

    border-radius: 14px;

    object-fit: cover;

    border:
        1px solid
        #333;
}

.profile-info {
    display: flex;
    flex-direction: column;

    gap: 3px;
}

.profile-name {
    font-size: 12px;
    font-weight: bold;
}

.profile-sub {
    font-size: 9px;
    color: #666;
}

.top-status {
    display: flex;

    align-items: center;

    gap: 9px;
}

.signal {
    color: #777;
    font-size: 10px;
}


/* =========================================================
   RELÓGIO
========================================================= */

.hero {
    margin-top: 12px;

    display: flex;

    align-items: flex-end;

    justify-content: space-between;
}

.clock {
    font-size: 57px;

    font-weight: 300;

    line-height: .85;

    letter-spacing: -4px;
}

.date-box {
    text-align: right;

    padding-bottom: 2px;
}

.date-day {
    font-size: 12px;

    color: #aaa;
}

.date-full {
    margin-top: 4px;

    font-size: 9px;

    color: #555;
}


/* =========================================================
   PAINEL DE INFORMAÇÕES
========================================================= */

.info-panel {
    margin-top: 16px;

    display: grid;

    grid-template-columns:
        1.3fr
        .85fr
        .85fr;

    gap: 7px;
}

.info {
    height: 65px;

    border:
        1px solid
        #222;

    border-radius: 17px;

    padding: 9px 11px;

    display: flex;

    flex-direction: column;

    justify-content: space-between;
}

.info-title {
    font-size: 8px;

    color: #555;

    text-transform: uppercase;
}

.info-value {
    font-size: 16px;

    font-weight: bold;
}

.info-small {
    font-size: 8px;

    color: #555;
}


/* =========================================================
   CORES DOS PAINÉIS
========================================================= */

.info.green {
    border-color: #164c35;
}

.info.blue {
    border-color: #26336f;
}

.info.orange {
    border-color: #65451d;
}


/* =========================================================
   SEÇÃO DE APLICATIVOS
========================================================= */

.apps-header {
    margin-top: 15px;

    display: flex;

    justify-content: space-between;

    align-items: center;
}

.apps-header strong {
    font-size: 14px;
}

.apps-header span {
    font-size: 9px;

    color: #555;
}


/* =========================================================
   GRID
========================================================= */

.apps {
    margin-top: 11px;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    column-gap: 7px;

    row-gap: 13px;

    flex: 1;

    align-content: start;

    overflow: hidden;
}


/* =========================================================
   APP
========================================================= */

.app {
    display: flex;

    flex-direction: column;

    align-items: center;

    min-width: 0;

    transition:
        transform .1s ease;
}

.app:active {
    transform: scale(.87);
}


/* =========================================================
   ÍCONE
========================================================= */

.icon {
    width: 64px;
    height: 64px;

    border-radius: 20px;

    background: #000;

    border:
        1px solid
        currentColor;

    display: flex;

    align-items: center;
    justify-content: center;

    position: relative;
}

.icon::before {
    content: "";

    position: absolute;

    inset: 5px;

    border-radius: 150px;

    border:
        1px solid
        currentColor;

    opacity: .14;
}

.icon svg {
    width: 31px;
    height: 31px;

    position: relative;

    z-index: 2;
}


/* =========================================================
   USER2
========================================================= */

.user2 {
    width: 64px;
    height: 64px;

    border-radius: 200px;

    object-fit: cover;

    border:
        1px solid lime;

    background: #000;
}


/* =========================================================
   NOMES
========================================================= */

.app-name {
    margin-top: 6px;

    width: 100%;

    padding: 0 2px;

    text-align: center;

    font-size: 10px;

    color: #999;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================================================
   CORES
========================================================= */

.blue {
    color: #687fff;
}

.cyan {
    color: #29d7df;
}

.green {
    color: #4ce39b;
}

.yellow {
    color: #ffc857;
}

.red {
    color: #ff5f79;
}

.purple {
    color: #b67cff;
}

.orange {
    color: #ff9255;
}

.white {
    color: #ddd;
}


/* =========================================================
   INDICADOR
========================================================= */

.pages {
    display: flex;

    justify-content: center;

    align-items: center;

    gap: 5px;

    margin-top: 5px;
}

.pages i {
    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #333;
}

.pages i.active {
    width: 19px;

    border-radius: 999px;

    background: #777;
}


/* =========================================================
   DOCK
========================================================= */

.dock {
    
    margin-top: 7px;

    padding:
        7px
        13px
        3px;

    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    align-items: center;

    border:
        1px solid
        #222;

    height: 80px;
        position: relative;
        bottom: 90px;
        border-radius: 200px;
}

.dock .app {
    justify-content: center;
}

.dock .icon,
.dock .user2 {
    width: 53px;
    height: 53px;

    border-radius: 170px;
}

.dock .icon svg {
    width: 27px;
    height: 27px;
}

.dock .app-name {
    display: none;
}


/* =========================================================
   BARRA INFERIOR
========================================================= */

.bottom {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-top: 7px;

    padding:
        0
        5px;
}

.bottom span {
    font-size: 8px;

    color: #444;
}

.dot-online {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #4ce39b;

    display: inline-block;

    margin-right: 4px;
}


/* =========================================================
   ALTURA PEQUENA
========================================================= */

@media (max-height: 720px) {

    .launcher {
        padding-top: 5px;
    }

    .clock {
        font-size: 45px;
    }

    .info-panel {
        margin-top: 10px;
    }

    .info {
        height: 55px;
    }

    .apps-header {
        margin-top: 10px;
    }

    .apps {
        margin-top: 8px;
        row-gap: 9px;
    }

    .icon,
    .user2 {
        width: 54px;
        height: 54px;

        border-radius: 170px;
    }

    .icon svg {
        width: 26px;
        height: 26px;
    }

    .app-name {
        font-size: 8px;
        margin-top: 4px;
    }

        .dock {
        height: 80px;
        position: relative;
        bottom: 90px;
        border-radius: 200px;
            }

    .dock .icon,
    .dock .user2 {
        width: 46px;
        height: 46px;
        border-radius: 200px;
    }
}


/* =========================================================
   CELULAR ESTREITO
========================================================= */

@media (max-width: 360px) {

    .clock {
        font-size: 42px;
    }

    .info-panel {
        gap: 4px;
    }

    .info {
        padding: 7px;
    }

    .info-value {
        font-size: 13px;
    }

    .icon,
    .user2 {
        width: 53px;
        height: 53px;
        border-radius: 200px;
    }

    .apps {
        column-gap: 2px;
    }

}


/* =========================================================
   CELULAR ALTO
========================================================= */

@media (min-height: 850px) {

    .clock {
        font-size: 64px;
    }

    .info {
        height: 72px;
    }

    .apps {
        row-gap: 17px;
    }

    .icon,
    .user2 {
        width: 67px;
        height: 67px;
        border-radius: 200px;
    }

}

</style>
</head>

<script>

/* =========================================================
   RELÓGIO
========================================================= */

function atualizarRelogio() {

    const agora = new Date();

    const clock = document.getElementById("clock");
    const day = document.getElementById("day");
    const date = document.getElementById("date");

    const horas =
        String(agora.getHours())
        .padStart(2, "0");

    const minutos =
        String(agora.getMinutes())
        .padStart(2, "0");

    if (clock) {
        clock.textContent =
            horas + ":" + minutos;
    }

    const dias = [
        "Domingo",
        "Segunda-feira",
        "Terça-feira",
        "Quarta-feira",
        "Quinta-feira",
        "Sexta-feira",
        "Sábado"
    ];

    const meses = [
        "janeiro",
        "fevereiro",
        "março",
        "abril",
        "maio",
        "junho",
        "julho",
        "agosto",
        "setembro",
        "outubro",
        "novembro",
        "dezembro"
    ];

    if (day) {
        day.textContent =
            dias[agora.getDay()];
    }

    if (date) {
        date.textContent =
            agora.getDate() +
            " de " +
            meses[agora.getMonth()];
    }
}

atualizarRelogio();

setInterval(
    atualizarRelogio,
    1000
);


/* =========================================================
   BATERIA
========================================================= */

if ("getBattery" in navigator) {

    navigator
        .getBattery()
        .then(function(battery) {

            function atualizarBateria() {

                const valor =
                    Math.round(
                        battery.level * 100
                    );

                const batteryElement =
                    document.getElementById("battery");

                const batteryBottom =
                    document.getElementById("batteryBottom");

                if (batteryElement) {
                    batteryElement.textContent =
                        valor + "%";
                }

                if (batteryBottom) {
                    batteryBottom.textContent =
                        "Bateria " +
                        valor +
                        "%";
                }
            }

            atualizarBateria();

            battery.addEventListener(
                "levelchange",
                atualizarBateria
            );

        })
        .catch(function(erro) {

            console.log(
                "Erro ao acessar bateria:",
                erro
            );

        });

}


/* =========================================================

    window.location.href =

}

</script>
