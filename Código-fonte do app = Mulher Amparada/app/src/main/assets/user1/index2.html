<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>Controle</title>

<style>

/* =========================================================
   FADE OUT DA INTERFACE
========================================================= */

@keyframes fadeOut {

    from {
        opacity: 1;
    }

    to {
        opacity: 0;
    }

}

.mainUI.saindo {

    animation:
        fadeOut .65s ease
        forwards;

}


/* =========================================================
   BARRAS DE ROLAGEM — TOTALMENTE TRANSPARENTES
========================================================= */

*::-webkit-scrollbar {

    width: 0;
    height: 0;

    background: transparent;

}

*::-webkit-scrollbar-track {

    background: transparent;

}

*::-webkit-scrollbar-thumb {

    background: transparent;

    border: none;

}

* {

    scrollbar-width: none;

    scrollbar-color:
        transparent
        transparent;

}

html,
body {

    scrollbar-width: none;

    scrollbar-color:
        transparent
        transparent;

}

html::-webkit-scrollbar,
body::-webkit-scrollbar {

    width: 0;
    height: 0;

    background: transparent;

}


/* =========================================================
   FONTE
========================================================= */

@font-face {

    font-family: "Quicksand";

    src:
        url("font.ttf")
        format("truetype");

    font-weight:
        400 800;

    font-style:
        normal;

    font-display:
        swap;

}


/* =========================================================
   VARIÁVEIS
========================================================= */

:root {

    --bg:
        #000000;

    --surface:
        #101010;

    --surface-2:
        #151515;

    --surface-3:
        #1b1b1b;

    --white:
        #ffffff;

    --text:
        #f7f7fa;

    --soft:
        #a1a4ad;

    --muted:
        #666a74;

    --pink:
        #ff3f82;

    --pink-light:
        #ff6b9f;

    --pink-dark:
        #e92f70;

    --red:
        #ff4054;

    --red-dark:
        #d9273d;

    --purple:
        #8b5cf6;

    --purple-dark:
        #5948d2;

    --border:
        #292929;

    --border-light:
        #363636;

    --radius:
        26px;

    --radius-small:
        18px;

}


/* =========================================================
   RESET
========================================================= */

* {

    box-sizing:
        border-box;

    margin:
        0;

    padding:
        0;

    font-family:
        "Quicksand",
        sans-serif;

    font-weight:
        700;

    -webkit-tap-highlight-color:
        transparent;

}


html,
body {

    width:
        100%;

    min-height:
        100%;

    background:
        #000000;

    color:
        var(--text);

}


body {

    min-height:
        100vh;

    overflow-x:
        hidden;

    padding-top:
        env(safe-area-inset-top);

    padding-bottom:
        env(safe-area-inset-bottom);

}


/* =========================================================
   ANIMAÇÕES
========================================================= */

@keyframes pageIn {

    from {

        opacity:
            0;

        

    }

    to {

        opacity:
            1;

        

    }

}


@keyframes statusPulse {

    0%,
    100% {

        opacity:
            1;

    }

    50% {

        opacity:
            .45;

    }

}


/* =========================================================
   LAYOUT PRINCIPAL
========================================================= */

.mainUI {

    width:
        100%;

    max-width:
        680px;

    min-height:
        100vh;

    margin:
        0 auto;

    padding:
        20px
        18px
        125px;

    display:
        flex;

    flex-direction:
        column;

    gap:
        32px;

    animation:
        pageIn
        .55s ease both;

}


/* =========================================================
   TÍTULO
========================================================= */

.heroTag {

    width:
        80%;

    margin-left:
        10%;

    margin-top:
        55px;

    margin-bottom:
        55px;

    min-height:
        70px;

    padding:
        13px
        18px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    color:
        #ffffff;

    

    border-radius:
        24px;

    font-family:
        "Quicksand",
        sans-serif;

    font-size:
        clamp(
            27px,
            8vw,
            42px
        );

    font-weight:
        800;

    line-height:
        1.1;

    letter-spacing:
        -0.8px;

    text-align:
        center;

    box-shadow:
        0 14px 40px
        rgba(
            0,
            0,
            0,
            .55
        );

}


/* =========================================================
   SEÇÃO
========================================================= */

.section {

    width:
        100%;

}


/* =========================================================
   LABEL
========================================================= */

.label {

    display:
        flex;

    align-items:
        center;

    gap:
        8px;

    margin:
        0 0 15px 3px;

    padding:
        0;

    color:
        var(--muted);

    font-size:
        10px;

    font-weight:
        800;

    letter-spacing:
        1.8px;

    line-height:
        1;

    text-transform:
        uppercase;

}


.label::before {

    content:
        "";

    width:
        4px;

    height:
        4px;

    flex-shrink:
        0;

    border-radius:
        50%;

    background:
        var(--pink);

    box-shadow:
        0 0 8px
        rgba(
            255,
            63,
            130,
            .5
        );

}


/* =========================================================
   SOS
========================================================= */

.panic {

    width:
        100%;

    height:
        300px;

    position:
        relative;

    overflow:
        hidden;

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        30px;

    border:
        1px solid
        red;

    color:
        #ffffff;

    background:

        radial-gradient(
            circle at 50% 0%,
            rgba(
                255,
                255,
                255,
                .15
            ),
            transparent 40%
        ),

        linear-gradient(
            145deg,
            #ff465a,
            #e92d43
        );

    cursor:
        pointer;

    box-shadow:
        0 16px 38px
        rgba(
            255,
            64,
            84,
            .16
        );

    transition:
        transform
        .22s
        cubic-bezier(
            .22,
            1,
            .36,
            1
        ),

        filter
        .22s
        ease,

        box-shadow
        .22s
        ease;

    -webkit-appearance:
        none;

    appearance:
        none;

}


/* =========================================================
   BEFORE ORIGINAL DO SOS
========================================================= */

.panic::before {

    content: "";

    position: absolute;

    width: 370px;
    height: 370px;

    top: -245px;
    right: -135px;

    border-radius: 50%;

    background:
        rgba(
            255,
            255,
            255,
            .075
        );

    pointer-events: none;

}


/* =========================================================
   TEXTO SOS
========================================================= */

.panic span {

    position:
        relative;

    z-index:
        2;

    color:
        #ffffff;

    font-size:
        clamp(
            62px,
            17vw,
            88px
        );

    font-weight:
        800;

    line-height:
        .9;

    letter-spacing:
        5px;

    text-shadow:
        0 5px 20px
        rgba(
            0,
            0,
            0,
            .17
        );

}


.panic small {

    position:
        relative;

    z-index:
        2;

    margin-top:
        17px;

    color:
        rgba(
            255,
            255,
            255,
            .78
        );

    font-size:
        12px;

    font-weight:
        600;

    letter-spacing:
        .5px;

}


/* =========================================================
   SOS — INTERAÇÃO
========================================================= */

.panic:hover {

    filter:
        brightness(1.04);

    box-shadow:
        0 20px 48px
        rgba(
            255,
            64,
            84,
            .22
        );

}


.panic:active {

    transform:
        scale(.965);

    filter:
        brightness(1.08);

    box-shadow:
        0 12px 30px
        rgba(
            255,
            64,
            84,
            .24
        );

}


.panic:focus-visible {

    outline:
        2px solid
        #ffffff;

    outline-offset:
        4px;

}


/* =========================================================
   NAVEGAÇÃO
========================================================= */

.navigationButtons {

    width:
        100%;

    display:
        flex;

    flex-direction:
        column;

    margin-top:
        -2px;

}


/* =========================================================
   BOTÃO DE NAVEGAÇÃO
========================================================= */

.navigationButton {

    width:
        100%;

    min-height:
        94px;

    margin-bottom:
        16px;

    position:
        relative;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        20px;

    padding:
        18px
        18px
        18px
        24px;

    overflow:
        hidden;

    color:
        #ffffff;

    background:
        #111111;

    border:
        1px solid
        #292929;

    border-radius:
        26px;

    font-family:
        "Quicksand",
        sans-serif;

    font-size:
        14px;

    font-weight:
        700;

    line-height:
        1.4;

    text-align:
        left;

    cursor:
        pointer;

    box-shadow:
        0 10px 28px
        rgba(
            0,
            0,
            0,
            .4
        );

    transition:
        transform
        .18s
        cubic-bezier(
            .22,
            1,
            .36,
            1
        ),

        border-color
        .18s
        ease,

        background
        .18s
        ease;

    -webkit-appearance:
        none;

    appearance:
        none;

}


/* =========================================================
   BARRA LATERAL ORIGINAL
========================================================= */

.navigationButton::after {

    content: "";

    position: absolute;

    left: 8px;
    top: 20px;

    width: 3px;
    height: calc(100% - 40px);

    background: #ff3f82;

    border-radius: 999px;

    pointer-events: none;

}


/* =========================================================
   TEXTO
========================================================= */

.navigationButton > span:first-child {

    flex:
        1;

    min-width:
        0;

    color:
        #f5f5f5;

    letter-spacing:
        -.15px;

}


/* =========================================================
   SETA
========================================================= */

.navigationButton .arrow {

    width:
        46px;

    height:
        46px;

    flex-shrink:
        0;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    color:
        var(--pink);

    background:
        #1b1b1b;

    border:
        1px solid
        #303030;

    border-radius:
        50%;

    transition:
        transform
        .18s
        cubic-bezier(
            .22,
            1,
            .36,
            1
        ),

        background
        .18s
        ease,

        border-color
        .18s
        ease;

}


/* =========================================================
   SVG
========================================================= */

.navigationButton .arrow svg {

    width:
        21px;

    height:
        21px;

    display:
        block;

    stroke:
        currentColor;

    transition:
        transform
        .18s
        ease;

}


/* =========================================================
   HOVER
========================================================= */

.navigationButton:hover {

    transform:
        translateY(-2px);

    background:
        #151515;

    border-color:
        #383838;

}


.navigationButton:hover .arrow {

    transform:
        translateX(4px);

    background:
        #242424;

    border-color:
        #3d3d3d;

}


.navigationButton:hover .arrow svg {

    transform:
        translateX(2px);

}


/* =========================================================
   TOQUE
========================================================= */

.navigationButton:active {

    transform:
        scale(.97);

    background:
        #151515;

    border-color:
        #444444;

}


.navigationButton:active .arrow {

    transform:
        translateX(5px)
        scale(.94);

}


/* =========================================================
   FOCO
========================================================= */

.navigationButton:focus-visible {

    outline:
        2px solid
        #ff3f82;

    outline-offset:
        3px;

}


/* =========================================================
   ÁREA PROTEGIDA
========================================================= */

.bigButton {

    width:
        100%;

    min-height:
        112px;

    padding:
        18px
        20px;

    border:
        1px solid
        rgba(
            139,
            124,
            255,
            .28
        );

    border-radius:
        var(--radius);

    background:
        linear-gradient(
            135deg,
            #7867e8,
            #5948d2
        );

    color:
        white;

    cursor:
        pointer;

    position:
        relative;

    display:
        flex;

    align-items:
        center;

    justify-content:
        flex-start;

    gap:
        16px;

    text-align:
        left;

    overflow:
        hidden;

    box-shadow:
        0 16px 36px
        rgba(
            89,
            72,
            210,
            .22
        );

    transition:
        transform
        .16s
        cubic-bezier(
            .22,
            1,
            .36,
            1
        ),

        filter
        .16s
        ease,

        box-shadow
        .20s
        ease;

    -webkit-appearance:
        none;

    appearance:
        none;

}


/* =========================================================
   BEFORE ORIGINAL DA ÁREA PROTEGIDA
========================================================= */

.bigButton::before {

    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    top: -105px;
    right: -60px;

    border-radius: 50%;

    background:
        rgba(
            255,
            255,
            255,
            .09
        );

    pointer-events:
        none;

}


/* =========================================================
   ÍCONE
========================================================= */

.protectIcon {

    width:
        58px;

    height:
        58px;

    flex-shrink:
        0;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    position:
        relative;

    z-index:
        2;

    border-radius:
        18px;

    background:
        rgba(
            255,
            255,
            255,
            .13
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .18
        );

    box-shadow:
        inset
        0 1px 0
        rgba(
            255,
            255,
            255,
            .10
        );

}


.protectIcon img {

    width:
        30px;

    height:
        30px;

    object-fit:
        contain;

    display:
        block;

}


/* =========================================================
   TEXTO DA ÁREA PROTEGIDA
========================================================= */

.protectContent {

    min-width:
        0;

    flex:
        1;

    display:
        flex;

    flex-direction:
        column;

    align-items:
        flex-start;

    justify-content:
        center;

    position:
        relative;

    z-index:
        2;

}


.protectTitle {

    color:
        white;

    font-size:
        clamp(
            20px,
            5.5vw,
            27px
        );

    font-weight:
        800;

    line-height:
        1.15;

}


.protectSubtitle {

    margin-top:
        6px;

    color:
        rgba(
            255,
            255,
            255,
            .72
        );

    font-size:
        12px;

    font-weight:
        600;

    line-height:
        1.35;

}


/* =========================================================
   INDICADOR DIREITO
========================================================= */

.protectArrow {

    width:
        38px;

    height:
        38px;

    flex-shrink:
        0;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    position:
        relative;

    z-index:
        2;

    border-radius:
        50%;

    background:
        rgba(
            255,
            255,
            255,
            .10
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .14
        );

    transition:
        transform
        .18s
        ease;

}


.protectArrow svg {

    width:
        24px;

    height:
        24px;

    display:
        block;

}


.bigButton:hover {

    transform:
        translateY(-2px);

    filter:
        brightness(1.03);

    box-shadow:
        0 20px 42px
        rgba(
            89,
            72,
            210,
            .28
        );

}


.bigButton:hover .protectArrow {

    transform:
        translateX(3px);

}


.bigButton:active {

    transform:
        scale(.965);

    filter:
        brightness(1.08);

    box-shadow:
        0 20px 44px
        rgba(
            89,
            72,
            210,
            .32
        );

}


.bigButton:focus-visible {

    outline:
        2px solid
        rgba(
            255,
            255,
            255,
            .8
        );

    outline-offset:
        4px;

}






</style>

</head>


<body>


<!-- =======================================================
     INTERFACE
======================================================== -->

<main class="mainUI">


    <!-- ===================================================
         TÍTULO
    ==================================================== -->

    <div class="heroTag">
        Mulher Amparada
    </div>


    <!-- ===================================================
         EMERGÊNCIA
    ==================================================== -->

    <section class="section">

        <div class="label">
            Emergência
        </div>


        <button
            class="panic"
            id="panic"
            type="button"
            aria-label="Pedir ajuda"
        >

            <span>
                SOS
            </span>

            <small>
                toque para pedir ajuda
            </small>

        </button>

    </section>


    <!-- ===================================================
         ATALHOS
    ==================================================== -->

    <section class="navigationButtons">


        <div class="label">
            Atalhos
        </div>


        <button
            class="navigationButton"
            type="button"
            onclick="window.location.href='index3.html'"
        >

            <span>
                Proteção por sensores
            </span>


            <span
                class="arrow"
                aria-hidden="true"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <path
                        d="M9 18L15 12L9 6"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                </svg>

            </span>

        </button>


        <button
            class="navigationButton"
            type="button"
            onclick="window.location.href='index4.html'"
        >

            <span>
                Ajuda rápida, compartilhamento de localização e contatos de confiança
            </span>


            <span
                class="arrow"
                aria-hidden="true"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <path
                        d="M9 18L15 12L9 6"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                </svg>

            </span>

        </button>


    </section>


    <!-- ===================================================
         ÁREA PROTEGIDA
    ==================================================== -->

    <section class="section">


        <div class="label">
            Área protegida
        </div>


        <button
            class="bigButton"
            onclick="Android.iniciarBiometriaMusica()"
            id="areaProtegida"
            type="button"
            aria-label="Abrir área protegida"
        >


            <!-- ÍCONE -->

            <span
                class="protectIcon"
                aria-hidden="true"
            >

                <img
                    src="lock.svg"
                    alt=""
                >

            </span>


            <!-- TEXTO -->

            <span class="protectContent">

                <span class="protectTitle">
                    Área protegida
                </span>

                <span class="protectSubtitle">
                    Acesso protegido por senha
                </span>

            </span>


            <!-- SETA -->

            <span
                class="protectArrow"
                aria-hidden="true"
            >

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    height="24px"
                    viewBox="0 -960 960 960"
                    width="24px"
                    fill="#fff"
                >

                    <path
                        d="M504-480 348-636q-11-11-11-28t11-28q11-11 28-11t28 11l184 184q6 6 8.5 13t2.5 15q0 8-2.5 15t-8.5 13L404-268q-11 11-28 11t-28-11q-11-11-11-28t11-28l156-156Z"
                    />

                </svg>

            </span>


        </button>


    </section>


</main>


<script>

/* =========================================================
   UTILITÁRIOS
========================================================= */

function vibrar(duracao = 100) {

    try {

        if (
            navigator.vibrate &&
            typeof navigator.vibrate === "function"
        ) {

            navigator.vibrate(
                duracao
            );

        }

    } catch (e) {}

}


function chamarAndroid(
    nome,
    ...args
) {

    try {

        if (
            window.Android &&
            typeof window.Android[nome] === "function"
        ) {

            return window.Android[nome](
                ...args
            );

        }

    } catch (e) {

        console.warn(
            "Android." + nome,
            e
        );

    }

    return null;

}


/* =========================================================
   SOS
========================================================= */

const panic =
    document.getElementById(
        "panic"
    );


if (panic) {

    panic.addEventListener(
        "click",
        ativarSOS
    );

}


function ativarSOS() {

    vibrar(300);


    panic.style.transform =
        "scale(.96)";


    setTimeout(() => {

        panic.style.transform =
            "";

    }, 120);


    if (
        window.Android &&
        typeof Android.ligarDireto ===
            "function"
    ) {

        try {

            Android.ligarDireto(
                "180"
            );

            return;

        } catch (e) {

            console.warn(
                e
            );

        }

    }


    try {

        window.location.href =
            "tel:180";

    } catch (e) {

        alert(
            "Não foi possível iniciar a ligação."
        );

    }

}


/* =========================================================
   ÁREA PROTEGIDA
========================================================= */

const areaProtegida =
    document.getElementById(
        "areaProtegida"
    );


if (areaProtegida) {

    areaProtegida.addEventListener(
        "click",
        function () {

            vibrar(70);

            chamarAndroid(
                "abrirAreaProtegida"
            );

        }
    );

}


/* =========================================================
   FEEDBACK DOS BOTÕES
========================================================= */

document
    .querySelectorAll(
        ".navigationButton"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function () {

                    vibrar(45);

                }
            );

        }
