<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<meta
    name="description"
    content="Central de recursos e acessos do aplicativo"
>

<title>Meus Acessos</title>


<style>
/* =========================================================
   MEUS ACESSOS
   PREMIUM APP HUB
   BLACK × BLUE × SLATE
   WEBVIEW OPTIMIZED
========================================================= */


/* =========================================================
   FONTE
========================================================= */

@font-face {

    font-family: "Quicksand";

    src:
        url("file:///android_asset/font.ttf")
        format("truetype");

    font-weight:
        400 800;

    font-style:
        normal;

    font-display:
        swap;
}


/* =========================================================
   VARIÁVEIS
========================================================= */

:root {

    --black: #000000;

    --bg: #000000;

    --surface: #09090c;

    --surface-2: #0d0d11;

    --surface-3: #121218;

    --surface-active: #18181f;


    --blue: #7c6cff;

    --blue-2: #9589ff;

    --blue-dark: #5548d8;


    --blue-soft:
        rgba(124, 108, 255, 0.09);

    --blue-soft-2:
        rgba(124, 108, 255, 0.045);

    --blue-border:
        rgba(124, 108, 255, 0.22);

    --blue-border-strong:
        rgba(124, 108, 255, 0.38);


    --white: #ffffff;

    --text: #ffffff;

    --text-soft: #c8c8d0;

    --text-muted: #777781;

    --text-dark: #51515a;


    --border:
        rgba(255, 255, 255, 0.065);

    --border-strong:
        rgba(255, 255, 255, 0.11);


    --danger: #ff708f;

    --danger-soft:
        rgba(255, 112, 143, 0.08);

    --danger-border:
        rgba(255, 112, 143, 0.22);


    --success: #7dffb2;


    --radius-xl: 30px;

    --radius-lg: 23px;

    --radius-md: 18px;

    --radius-sm: 14px;


    --max-width: 680px;
}


/* =========================================================
   RESET
========================================================= */

* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;

    font-family:
        "Quicksand",
        sans-serif;

    -webkit-tap-highlight-color:
        transparent;

    -webkit-touch-callout:
        none;
}


/* =========================================================
   HTML
========================================================= */

html {

    width: 100%;

    min-width: 100%;

    min-height: 100%;

    background:
        #000000 !important;

    color:
        #ffffff;

    color-scheme:
        dark;

    scrollbar-width:
        none;

    overscroll-behavior:
        none;
}


html::-webkit-scrollbar {

    width: 0;

    height: 0;

    display: none;
}


/* =========================================================
   BODY
========================================================= */

body {

    width: 100%;

    min-width: 100%;

    min-height: 100vh;

    min-height: 100dvh;

    margin: 0;

    padding: 0;

    background:
        #000000 !important;

    background-color:
        #000000 !important;

    color:
        #ffffff;

    overflow-x:
        hidden;

    scrollbar-width:
        none;

    overscroll-behavior:
        none;

    -webkit-overflow-scrolling:
        touch;

    touch-action:
        pan-y;
}


body::-webkit-scrollbar {

    width: 0 !important;

    height: 0 !important;

    display: none !important;
}


/* =========================================================
   SELEÇÃO
========================================================= */

::selection {

    background:
        var(--blue);

    color:
        #ffffff;
}


/* =========================================================
   CONTAINER
========================================================= */

.container {

    width: 100%;

    min-height: 100vh;

    min-height: 100dvh;

    display: flex;

    justify-content: center;

    padding:
        calc(
            18px +
            env(safe-area-inset-top)
        )

        15px

        calc(
            38px +
            env(safe-area-inset-bottom)
        );

    background:
        #000000;
}


/* =========================================================
   CARD PRINCIPAL
========================================================= */

.card {

    width: 100%;

    max-width:
        var(--max-width);

    min-height: 100%;

    position: relative;

    background:
        #000000;

    animation:
        pageIn
        .45s
        ease-out
        both;
}


@keyframes pageIn {

    from {

        opacity: 0;

        transform:
            translateY(10px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =========================================================
   CABEÇALHO
========================================================= */

.header {

    width: 100%;

    padding:
        10px
        2px
        21px;
}


/* =========================================================
   EYEBROW
========================================================= */

.eyebrow {

    display: flex;

    align-items: center;

    gap: 8px;

    margin-bottom:
        9px;

    color:
        var(--text-muted);

    font-size:
        9px;

    font-weight:
        800;

    line-height:
        1;

    letter-spacing:
        1.7px;

    text-transform:
        uppercase;
}


/*
   Indicador criado com elemento real,
   sem ::before / ::after
*/

.eyebrow-indicator {

    width: 7px;

    height: 7px;

    flex: 0 0 7px;

    border-radius:
        50%;

    background:
        var(--blue);

    box-shadow:
        0 0 0 4px
        rgba(124,108,255,.07),

        0 0 13px
        rgba(124,108,255,.45);
}


/* =========================================================
   TÍTULO
========================================================= */

.header h1 {

    color:
        #ffffff;

    font-size:
        clamp(
            28px,
            8vw,
            39px
        );

    font-weight:
        800;

    line-height:
        1.04;

    letter-spacing:
        -.9px;
}


/* =========================================================
   SUBTÍTULO
========================================================= */

.header p {

    max-width:
        540px;

    margin-top:
        9px;

    color:
        var(--text-muted);

    font-size:
        12px;

    font-weight:
        600;

    line-height:
        1.5;
}




/* =========================================================
   SEÇÕES
========================================================= */

.section {

    width:
        100%;

    min-height:
        20px;

    display:
        flex;

    align-items:
        center;

    gap:
        9px;

    margin:
        22px
        3px
        9px;
}


.section:first-child {

    margin-top:
        0;
}


.section-label {

    color:
        var(--text-muted);

    font-size:
        9px;

    font-weight:
        800;

    line-height:
        1;

    letter-spacing:
        1.45px;

    text-transform:
        uppercase;

    white-space:
        nowrap;
}


.section-line {

    width:
        auto;

    height:
        1px;

    flex:
        1;

    background:
        rgba(255,255,255,.065);
}


.counter {

    min-width:
        24px;

    height:
        21px;

    display:
        inline-flex;

    align-items:
        center;

    justify-content:
        center;

    padding:
        0 7px;

    border:
        1px solid
        var(--blue-border);

    border-radius:
        999px;

    background:
        var(--blue-soft);

    color:
        var(--blue-2);

    font-size:
        8px;

    font-weight:
        800;
}


/* =========================================================
   LISTA
========================================================= */

.buttons {

    width:
        100%;

    display:
        flex;

    flex-direction:
        column;

    gap:
        10px;
}


/* =========================================================
   BOTÃO PRINCIPAL
========================================================= */

.btn {

    width:
        100%;

    min-height:
        82px;

    display:
        block;

    position:
        relative;

    padding:
        8px;

    overflow:
        hidden;

    border:
        1px solid
        var(--border);

    border-radius:
        var(--radius-lg);

    outline:
        none;

    background:
        #0a0a0d;

    color:
        #ffffff;

    text-align:
        left;

    cursor:
        pointer;

    -webkit-appearance:
        none;

    appearance:
        none;

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.018),

        0 7px 20px
        rgba(0,0,0,.20);

    transition:
        transform .15s ease,
        border-color .15s ease,
        background-color .15s ease,
        box-shadow .15s ease;
}


/* =========================================================
   HOVER
========================================================= */

@media (hover: hover) {

    .btn:hover {

        transform:
            translateY(-2px);

        border-color:
            var(--blue-border);

        background:
            #0f0f13;

        box-shadow:
            inset 0 1px 0
            rgba(255,255,255,.025),

            0 13px 28px
            rgba(0,0,0,.32);
    }

}


/* =========================================================
   TOQUE
========================================================= */

.btn:active {

    transform:
        scale(.975);

    border-color:
        var(--blue-border-strong);

    background:
        #17171d;

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.35);
}


/* =========================================================
   CONTEÚDO INTERNO
========================================================= */

.left {

    width:
        100%;

    min-height:
        64px;

    display:
        flex;

    align-items:
        center;

    position:
        relative;

    z-index:
        1;
}


/* =========================================================
   ÍCONE
========================================================= */

.emoji {

    width:
        62px;

    height:
        62px;

    flex:
        0 0 62px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    overflow:
        hidden;

    border:
        1px solid
        rgba(255,255,255,.075);

    border-radius:
        200px;

    background:
        #15151a;

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.035),

        0 5px 15px
        rgba(0,0,0,.25);

    transition:
        transform .17s ease,
        border-color .17s ease,
        background-color .17s ease;
}


/* =========================================================
   IMAGEM
   OCUPA TODO O .EMOJI
========================================================= */

.emoji img {

    width:
        100%;

    height:
        100%;

    min-width:
        100%;

    min-height:
        100%;

    max-width:
        none;

    max-height:
        none;

    display:
        block;

    margin:
        0;

    padding:
        0;

    border:
        0;

    border-radius:
        200px;

    object-fit:
        cover;

    object-position:
        center center;

    background:
        transparent;

    user-select:
        none;

    pointer-events:
        none;

    -webkit-user-drag:
        none;

    transition:
        transform .18s ease;
}


/* =========================================================
   SVG DOS ÍCONES
========================================================= */

.emoji svg {

    width:
        34px;

    height:
        34px;

    flex:
        0 0 34px;

    display:
        block;

    fill:
        #ffffff;

    color:
        #ffffff;

    pointer-events:
        none;

    transition:
        transform .17s ease;
}


/* =========================================================
   HOVER DO ÍCONE
========================================================= */

@media (hover: hover) {

    .btn:hover .emoji {

        transform:
            scale(1.035);

        border-color:
            rgba(124,108,255,.30);

        background:
            #1a1921;
    }


    .btn:hover .emoji img {

        transform:
            scale(1.035);
    }


    .btn:hover .emoji svg {

        transform:
            scale(1.07);
    }

}


/* =========================================================
   TEXTO DO BOTÃO
========================================================= */

.btn-content {

    min-width:
        0;

    flex:
        1;

    padding:
        0 12px;
}


.btn-title {

    display:
        block;

    color:
        #ffffff;

    font-size:
        14px;

    font-weight:
        750;

    line-height:
        1.25;

    letter-spacing:
        0;
}


.btn-description {

    display:
        block;

    margin-top:
        4px;

    color:
        var(--text-muted);

    font-size:
        9px;

    font-weight:
        600;

    line-height:
        1.4;
}


/* =========================================================
   SETA
========================================================= */

.arrow {

    width:
        34px;

    height:
        34px;

    flex:
        0 0 34px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border:
        1px solid
        rgba(255,255,255,.06);

    border-radius:
        12px;

    color:
        var(--text-muted);

    background:
        rgba(255,255,255,.015);

    font-size:
        19px;

    font-weight:
        500;

    line-height:
        1;

    transition:
        transform .17s ease,
        color .17s ease,
        border-color .17s ease,
        background-color .17s ease;
}


@media (hover: hover) {

    .btn:hover .arrow {

        transform:
            translateX(2px);

        border-color:
            var(--blue-border);

        background:
            var(--blue-soft);

        color:
            var(--blue-2);
    }

}


/* =========================================================
   BADGE
========================================================= */

.badge {

    display:
        inline-flex;

    align-items:
        center;

    justify-content:
        center;

    min-height:
        18px;

    margin-left:
        6px;

    padding:
        2px 7px;

    vertical-align:
        middle;

    border:
        1px solid
        var(--blue-border);

    border-radius:
        999px;

    background:
        var(--blue-soft);

    color:
        var(--blue-2);

    font-size:
        7px;

    font-weight:
        800;

    line-height:
        1;

    letter-spacing:
        .6px;

    text-transform:
        uppercase;
}


/* =========================================================
   CARD PRIMARY
========================================================= */

.btn.primary {

    border-color:
        var(--blue-border);

    background:
        linear-gradient(
            135deg,
            rgba(124,108,255,.085),
            rgba(124,108,255,.018)
        ),

        #0a0a0d;
}


.btn.primary .emoji {

    border-color:
        rgba(124,108,255,.28);

    background:
        rgba(124,108,255,.08);
}


@media (hover: hover) {

    .btn.primary:hover {

        border-color:
            var(--blue-border-strong);

        background:
            linear-gradient(
                135deg,
                rgba(124,108,255,.12),
                rgba(124,108,255,.025)
            ),

            #0f0f14;
    }

}


/* =========================================================
   EMERGÊNCIA
========================================================= */

.btn.emergency {

    border-color:
        var(--danger-border);

    background:
        linear-gradient(
            135deg,
            rgba(255,112,143,.055),
            rgba(255,112,143,.008)
        ),

        #0a0a0d;
}


.btn.emergency .emoji {

    border-color:
        rgba(255,112,143,.24);

    background:
        var(--danger-soft);
}


.btn.emergency .arrow {

    color:
        rgba(255,112,143,.70);
}


@media (hover: hover) {

    .btn.emergency:hover {

        border-color:
            rgba(255,112,143,.35);

        background:
            linear-gradient(
                135deg,
                rgba(255,112,143,.075),
                rgba(255,112,143,.012)
            ),

            #0f0b0d;
    }

}


/* =========================================================
   QUICK GRID
========================================================= */

.quick-grid {

    width:
        100%;

    display:
        grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap:
        10px;

    margin-bottom:
        3px;
}


/* =========================================================
   QUICK CARD
========================================================= */

.quick {

    width:
        100%;

    min-height:
        108px;

    display:
        flex;

    flex-direction:
        column;

    justify-content:
        space-between;

    padding:
        14px;

    border:
        1px solid
        var(--border);

    border-radius:
        20px;

    outline:
        none;

    background:
        #09090c;

    color:
        #ffffff;

    text-align:
        left;

    cursor:
        pointer;

    -webkit-appearance:
        none;

    appearance:
        none;

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.018);

    transition:
        transform .15s ease,
        border-color .15s ease,
        background-color .15s ease;
}


.quick:active {

    transform:
        scale(.965);

    border-color:
        var(--blue-border);

    background:
        #15151b;
}


@media (hover: hover) {

    .quick:hover {

        transform:
            translateY(-2px);

        border-color:
            var(--blue-border);

        background:
            #101014;
    }

}


/* =========================================================
   QUICK ICON
========================================================= */

.quick-icon {

    width:
        38px;

    height:
        38px;

    flex:
        0 0 38px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border:
        1px solid
        var(--border);

    border-radius:
        13px;

    background:
        var(--surface-2);

    color:
        var(--blue-2);

    font-size:
        17px;

    font-weight:
        800;
}


/* =========================================================
   QUICK TEXTO
========================================================= */

.quick strong {

    display:
        block;

    margin-top:
        11px;

    color:
        #ffffff;

    font-size:
        11px;

    font-weight:
        750;

    line-height:
        1.2;
}


.quick span {

    display:
        block;

    margin-top:
        3px;

    color:
        var(--text-muted);

    font-size:
        8px;

    font-weight:
        600;

    line-height:
        1.25;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    width:
        100%;

    margin-top:
        30px;

    padding:
        21px
        5px
        6px;

    border-top:
        1px solid
        rgba(255,255,255,.06);

    color:
        var(--text-dark);

    text-align:
        center;

    font-size:
        9px;

    font-weight:
        650;

    line-height:
        1.6;

    letter-spacing:
        .5px;
}


.footer strong {

    color:
        #686870;

    font-weight:
        800;
}


/* =========================================================
   LINHA DECORATIVA DO FOOTER
========================================================= */

.footer-line {

    width:
        65px;

    height:
        1px;

    margin:
        0 auto 17px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(124,108,255,.55),
            transparent
        );
}


/* =========================================================
   ESTADO VAZIO DA PESQUISA
========================================================= */

.empty-state {

    width:
        100%;

    display:
        none;

    padding:
        35px 20px;

    border:
        1px solid
        var(--border);

    border-radius:
        var(--radius-lg);

    background:
        #09090c;

    text-align:
        center;
}


.empty-state-icon {

    width:
        45px;

    height:
        45px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    margin:
        0 auto 12px;

    border:
        1px solid
        var(--border);

    border-radius:
        15px;

    background:
        var(--surface-2);

    color:
        var(--text-muted);

    font-size:
        18px;
}


.empty-state strong {

    display:
        block;

    color:
        #ffffff;

    font-size:
        12px;

    font-weight:
        750;
}


.empty-state span {

    display:
        block;

    margin-top:
        5px;

    color:
        var(--text-muted);

    font-size:
        9px;

    font-weight:
        600;
}


/* =========================================================
   FOCO
========================================================= */

.btn:focus-visible,
.quick:focus-visible,
.search input:focus-visible {

    outline:
        2px solid
        var(--blue);

    outline-offset:
        3px;

/* =========================================================
   TÍTULO
========================================================= */

.heroTag {

    align-items:

    text-align:

            0,
            0,

        );

}
</style>

<script>

/* =========================================================
   NAVEGAÇÃO
========================================================= */

function ir(pagina) {

    if (!pagina) {
        return;
    }

    window.location.href = pagina;
}


/* =========================================================
   ANDROID BRIDGE
========================================================= */

function androidCall(metodo) {

    try {

        if (
            typeof Android !== "undefined" &&
            Android !== null &&
            typeof Android[metodo] === "function"
        ) {

            Android[metodo]();

            return true;
        }

        console.warn(
            "Método Android indisponível:",
            metodo
        );

        return false;

    } catch (erro) {

        console.error(
            "Erro no método Android:",
            metodo,
            erro
        );

        return false;
    }
}


/* =========================================================
   PESQUISA EM TEMPO REAL
========================================================= */

const searchInput =
    document.getElementById(
        "searchInput"
    );


const cards =
    document.querySelectorAll(
        ".btn[data-search]"
    );


if (searchInput) {

    searchInput.addEventListener(
        "input",
        function () {

            const termo =
                this.value
                    .toLowerCase()
                    .trim();


            cards.forEach(
                function (card) {

                    const texto =
                        card
                            .getAttribute(
                                "data-search"
                            )
                            .toLowerCase();


                    if (
                        !termo ||
                        texto.includes(termo)
                    ) {

                        card.style.display =
                            "";

                    } else {

                        card.style.display =
                            "none";
                    }

                }
            );

        }
    );

}


/* =========================================================
   EVITA MENU DE CONTEXTO NOS CARDS
========================================================= */

document.addEventListener(
    "contextmenu",
    function (evento) {

        if (
            evento.target.closest(".btn") ||
            evento.target.closest(".quick")
        ) {

            evento.preventDefault();

        }

    }
);


/* =========================================================
   PREVENÇÃO DE DUPLO TOQUE
========================================================= */

let ultimoToque =
    0;


document.addEventListener(
    "touchend",
    function (evento) {

        const agora =
            Date.now();


        if (
            agora - ultimoToque <
            250
        ) {

            evento.preventDefault();

        }


        ultimoToque =
            agora;

    },
    {
        passive: false
    }
);

</script>
