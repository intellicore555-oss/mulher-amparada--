/* =========================================================
   FONT
========================================================= */

@font-face {
    font-family: "Quicksand";
    src: url("file:///android_asset/font.ttf") format("truetype");
    font-weight: 400 800;
    font-style: normal;
    font-display: swap;
}


/* =========================================================
   VARIÁVEIS
========================================================= */

:root {

    --bg: #000000;
    --surface: #0d0d0f;
    --surface-2: #121216;
    --surface-3: #18181d;

    --line: #24242a;
    --line-light: #303038;

    --text: #ffffff;
    --text-soft: #a6a6ae;
    --text-muted: #707078;

    --blue: #7c6cff;
    --blue-2: #9589ff;
    --blue-dark: #5548d8;

    --danger: #ff4f67;

    --radius: 24px;

}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html {
    width: 100%;
    min-height: 100%;
    background: #000000 !important;
    scroll-behavior: smooth;
}

body {
    width: 100%;
    min-height: 100vh;

    background: #000000 !important;
    color: var(--text);

    font-family: "Quicksand", sans-serif;

    overflow-x: hidden;

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}


/* =========================================================
   CONTAINER
========================================================= */

.container {

    width: 100%;
    max-width: 720px;

    margin: 0 auto;

    padding:
        0
        clamp(18px, 5vw, 34px)
        60px;

}


/* =========================================================
   HERO
========================================================= */

.hero {

    width: 100%;

    min-height: clamp(190px, 32vh, 270px);

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding-top: 20px;
    padding-bottom: 24px;

}


/* =========================================================
   HEROTAG
   SEM BACKGROUND
========================================================= */

.heroTag {

    width: 100%;

    min-height: 70px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin: 0 auto 12px;

    color: #ffffff;

    font-family: "Quicksand", sans-serif;

    font-size: clamp(27px, 8vw, 42px);

    font-weight: 800;

    line-height: 1.1;

    letter-spacing: -0.8px;

    text-align: center;

}


/* =========================================================
   SUBTÍTULO
========================================================= */

.heroSubtitle {

    max-width: 500px;

    color: var(--text-soft);

    font-size: clamp(14px, 3.8vw, 17px);

    font-weight: 500;

    line-height: 1.5;

    text-align: center;

}




/* =========================================================
   SEÇÃO
========================================================= */

.section {

    width: 100%;


    margin-bottom: 34px;

}


.sectionHeader {

    display: flex;


    align-items: center;
    justify-content: space-between;

    margin-bottom: 13px;

}


.sectionTitle {

    color: #ffffff;

    font-size: 19px;

    font-weight: 800;

    letter-spacing: -0.3px;

}




/* =========================================================
   LISTA
========================================================= */

.list {

    width: 100%;

    display: flex;

    flex-direction: column;

    gap: 9px;

}


/* =========================================================
   BOTÃO
========================================================= */
/* =========================================================
   BOTÃO
========================================================= */

.btn {

    width: 100%;
    height: 118px;

    display: flex;
    align-items: center;

    padding: 26px;

    border: 1px solid var(--line);
    border-radius: var(--radius);

    background: var(--surface);
    color: #ffffff;

    font-family: "Quicksand", sans-serif;

    cursor: pointer;

    transition:
        transform .15s ease,
        background .15s ease,
        border-color .15s ease;


padding-bottom: 15px;
padding-top: 15px;

margin-top: 1.5%;
margin-bottom: 1.5%;
}

.btn:active {

    transform: scale(.985);

    background: var(--surface-2);

}


.btn:hover {

    background: var(--surface-2);

    border-color: var(--line-light);

}


/* =========================================================
   ÍCONE / EMOJI
========================================================= */

.emoji {

    width: 44px;
    height: 44px;



    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    border-radius: 14px;


}


.emoji img {

    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
    object-position: center;

}


.emoji svg {

    width: 100%;
    height: 100%;

    display: block;

    color: #ffffff;

}


/* =========================================================
   CONTEÚDO
========================================================= */

.content {

    min-width: 0;

    flex: 1;

    display: flex;

    flex-direction: column;

    justify-content: center;

    gap: 3px;

}


.title {
    color: #ffffff;

    font-size: 15px;
    font-weight: 750;

    line-height: 1.25;

.description {
    color: var(--text-muted);

    font-size: 12px;
    font-weight: 500;

    line-height: 1.3;

/* =========================================================
   SETA
========================================================= */

    height: 30px;

/* =========================================================
   NAVEGAÇÃO
========================================================= */

function ir(pagina) {

    if (!pagina) return;

    window.location.href = pagina;

}


/* =========================================================
   ANDROID BRIDGE
========================================================= */

function androidCall(metodo) {

    try {

        if (
            typeof Android !== "undefined" &&
            Android !== null &&
            typeof Android[metodo] === "function"
        ) {

            Android[metodo]();

            return true;

        }

        console.warn(
            "Método Android indisponível:",
            metodo
        );

        return false;

    } catch (erro) {

        console.error(
            "Erro no método Android:",
            metodo,
            erro
        );

        return false;

    }

}




/* =========================================================
   DESATIVA MENU DE CONTEXTO
========================================================= */

document.addEventListener(
    "contextmenu",
    function (event) {

        event.preventDefault();

    }
);

</script>

<script>

document.querySelectorAll(".btn").forEach(function (btn) {

    btn.querySelectorAll(".title, .description").forEach(function (element) {

        const texto = element.textContent.trim();

        if (texto.length > 20) {

            const palavras = texto.split(" ");
            let linha1 = "";
            let linha2 = "";

            palavras.forEach(function (palavra) {

                if (
                    (linha1 + " " + palavra).trim().length <= 14 &&
                    linha2 === ""
                ) {

                    linha1 += (linha1 ? " " : "") + palavra;

                } else {

                    linha2 += (linha2 ? " " : "") + palavra;

                }

            });

            if (linha2) {

                element.innerHTML =
                    linha1 + "<br>" + linha2;

            }

        }

    });

});

</script>
