<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>Controle</title>

<style>
/* =========================================================
   FADE OUT DA INTERFACE
========================================================= */

@keyframes fadeOut {

    from {
        opacity: 1;
    }

    to {
        opacity: 0;
    }

}

.mainUI.saindo {

    animation:
        fadeOut .65s ease
        forwards;

}

/* =========================================================
   BARRAS DE ROLAGEM — TOTALMENTE TRANSPARENTES
========================================================= */

*::-webkit-scrollbar {
    width: 0;
    height: 0;
    background: transparent;
}

*::-webkit-scrollbar-track {
    background: transparent;
}

*::-webkit-scrollbar-thumb {
    background: transparent;
    border: none;
}

* {
    scrollbar-width: none;
    scrollbar-color: transparent transparent;
}

html,
body {
    scrollbar-width: none;
    scrollbar-color: transparent transparent;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar {
    width: 0;
    height: 0;
    background: transparent;
}


/* =========================================================
   FONTE
========================================================= */

@font-face {
    font-family: "Quicksand";
    src: url("font.ttf") format("truetype");
    font-weight: 400 800;
}


/* =========================================================
   VARIÁVEIS
========================================================= */

:root {

    --bg: #000;

    --surface: #101218;
    --surface-2: #151720;
    --surface-3: #1b1e28;

    --white: #fff;
    --text: #f7f7fa;

    --soft: #969baa;
    --muted: #626877;

    --pink: #ff3f82;
    --pink-light: #ff6b9f;

    --red: #ff4054;
    --red-dark: #d9273d;

    --purple: #8b5cf6;
    --blue: #4f8cff;
    --green: #32d477;
    --orange: #ff9f43;
    --cyan: #27c9c1;

    --border: rgba(255,255,255,.075);
    --border-strong: rgba(255,255,255,.13);

    --radius: 24px;
    --radius-small: 17px;
}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;

    margin: 0;
    padding: 0;

    font-family: "Quicksand", sans-serif;

    font-weight: 700;

    -webkit-tap-highlight-color: transparent;
}

html,
body {

    width: 100%;
    min-height: 100%;

    background: #000;

    color: var(--text);
}

body {

    min-height: 100vh;

    overflow-x: hidden;

    padding-top:
        env(safe-area-inset-top);

    padding-bottom:
        env(safe-area-inset-bottom);
}


/* =========================================================
   ANIMAÇÕES
========================================================= */

@keyframes pageIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}


@keyframes statusPulse {

    0%,
    100% {
        opacity: 1;
    }

    50% {
        opacity: .45;
    }
}


/* =========================================================
   LAYOUT
========================================================= */

.mainUI {

    width: 100%;

    max-width: 680px;

    margin: 0 auto;

    padding:
        28px
        18px
        125px;

    display: flex;

    flex-direction: column;

    gap: 34px;

    animation:
        pageIn .5s ease;
}







.section {

    width: 100%;

    display: flex;

    flex-direction: column;

    gap: 11px;

    animation:
        pageIn .5s ease both;
}


.label {

    display: flex;

    align-items: center;

    gap: 8px;

    padding-left: 3px;

    color: var(--muted);

    font-size: 10px;

    letter-spacing: 1.8px;

    text-transform: uppercase;
}


.label::before {

    content: "";

    width: 4px;
    height: 4px;

    flex-shrink: 0;

    border-radius: 50%;

    background:
        var(--pink);

    box-shadow:
        0 0 8px rgba(255,63,130,.5);
}



/* =========================================================
   EMERGÊNCIA
========================================================= */

.btn,
.local,
.local99,
.local999 {

    width: 100%;

    min-height: 62px;

    padding: 16px 20px;

    border: 1px solid rgba(255,255,255,.08);

    border-radius: 20px;

    display: flex;

    align-items: center;
    justify-content: center;

    color: #fff;

    font-family:
        "Quicksand",
        sans-serif;

    font-size: 14px;

    font-weight: 800;

    letter-spacing: .1px;

    cursor: pointer;

    user-select: none;
    -webkit-user-select: none;

    touch-action: manipulation;

    position: relative;

    overflow: hidden;

    box-shadow:
        0 10px 28px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.08);

    transition:
        transform .16s cubic-bezier(.22,1,.36,1),
        filter .16s ease,
        box-shadow .2s ease,
        border-color .2s ease;
}


/* =========================================================
   BRILHO
========================================================= */

.btn::before,
.local::before,
.local99::before,
.local999::before {

    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    top: -125px;
    right: -60px;

    border-radius: 50%;

    background: rgba(255,255,255,.10);

    pointer-events: none;
}


/* =========================================================
   INTERAÇÃO
========================================================= */

.btn:active,
.local:active,
.local99:active,
.local999:active {

    transform: scale(.965);

    filter: brightness(1.08);

    box-shadow:
        0 6px 18px rgba(0,0,0,.30);
}


.btn:hover,
.local:hover,
.local99:hover,
.local999:hover {

    filter: brightness(1.06);

    border-color:
        rgba(255,255,255,.15);

    box-shadow:
        0 14px 32px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.10);
}


/* =========================================================
   POLÍCIA
========================================================= */

.policia {

    background:
        linear-gradient(
            135deg,
            #548fff,
            #326ed8
        );

    box-shadow:
        0 12px 28px rgba(77,140,255,.18),
        inset 0 1px 0 rgba(255,255,255,.12);
}


/* =========================================================
   SAMU
========================================================= */

.samu {

    background:
        linear-gradient(
            135deg,
            #ffad55,
            #df7d19
        );

    box-shadow:
        0 12px 28px rgba(255,169,77,.16),
        inset 0 1px 0 rgba(255,255,255,.12);
}


/* =========================================================
   CENTRAL DA MULHER
========================================================= */

.mulher {

    background:
        linear-gradient(
            135deg,
            #ff5795,
            #dc2f6d
        );

    box-shadow:
        0 12px 28px rgba(255,78,144,.18),
        inset 0 1px 0 rgba(255,255,255,.12);
}


/* =========================================================
   WHATSAPP
========================================================= */



/* =========================================================
   LOCALIZAÇÃO
========================================================= */

.local {

    min-height: 68px;

    border-radius: 22px;

    background:
        linear-gradient(
            135deg,
            #2bd2ca,
            #14958f
        );

    border:
        1px solid rgba(39,201,193,.28);

    box-shadow:
        0 14px 32px rgba(39,201,193,.16),
        inset 0 1px 0 rgba(255,255,255,.13);

    font-size: 15px;

    letter-spacing: .2px;
}


/* =========================================================
   CONTATO
========================================================= */

.btn.contato {

    min-height: 64px;

    border-radius: 21px;

    background:
        linear-gradient(
            135deg,
            #9368ff,
            #6f42d8
        );

    border:
        1px solid rgba(157,126,255,.30);

    box-shadow:
        0 14px 32px rgba(139,92,246,.18),
        inset 0 1px 0 rgba(255,255,255,.13);

    font-size: 15px;
}


/* =========================================================
   SOS CONTATOS
========================================================= */

.btn.sos-contatos {

    min-height: 64px;

    border-radius: 21px;

    background:
        linear-gradient(
            135deg,
            #f0445b,
            #bd253b
        );

    border:
        1px solid rgba(255,75,96,.25);

    box-shadow:
        0 14px 32px rgba(237,61,85,.18),
        inset 0 1px 0 rgba(255,255,255,.13);

    font-size: 15px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 480px) {

    .btn,
    .local,
    .local99,
    .local999 {

        min-height: 60px;

        padding: 15px 17px;

        border-radius: 19px;

        font-size: 13.5px;
    }

    .local,
    .btn.contato,
    .btn.sos-contatos {

        min-height: 63px;

        border-radius: 20px;

        font-size: 14px;
    }

}



/* =========================================================
   BOTÕES DE AÇÃO — BASE
========================================================= */

.btn,
.local {

    -webkit-appearance: none;
    appearance: none;

    position: relative;

    display: grid;

    grid-template-columns:
        54px
        minmax(0, 1fr)
        auto
        24px;

    grid-template-rows:
        auto
        auto;

    column-gap: 12px;
    row-gap: 3px;

    align-items: center;

    width: 100%;
    min-height: 82px;

    padding: 13px 15px;

    box-sizing: border-box;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius: 22px;

    outline: none;

    color: #fff;

    font-family:
        "Quicksand",
        sans-serif;

    text-align: left;

    cursor: pointer;

    overflow: hidden;

    

    transition:
        transform .16s cubic-bezier(.22,1,.36,1),
        filter .16s ease,
        box-shadow .2s ease;
}


/* =========================================================
   ÍCONE
========================================================= */

.btn > span:first-child,
.local > span:first-child {

    grid-column: 1;
    grid-row: 1 / span 2;

    width: 50px;
    height: 50px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 16px;

    background:
        rgba(255,255,255,.14);



    color: #fff;

    font-size: 24px;

    line-height: 1;
}


/* =========================================================
   SVG DOS ÍCONES
========================================================= */

.btn > span:first-child svg,
.local > span:first-child svg {

    width: 27px;
    height: 27px;

    display: block;

    fill: currentColor;
}


/* =========================================================
   TÍTULO
========================================================= */

.btn > span:nth-child(2),
.local > span:nth-child(2) {

    grid-column: 2;
    grid-row: 1;

    min-width: 0;

    color: #fff;

    font-size: 15px;

    font-weight: 800;

    line-height: 1.15;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================================================
   INFORMAÇÃO / NÚMERO
========================================================= */

.btn > strong,
.local > strong {

    grid-column: 3;
    grid-row: 1;

    padding:
        6px 8px;

    border-radius: 9px;

    background:
        rgba(0,0,0,.14);

    border:
        1px solid
        rgba(255,255,255,.10);

    color: #fff;

    font-size: 11px;

    font-weight: 900;

    line-height: 1;

    white-space: nowrap;
}


/* =========================================================
   DESCRIÇÃO
========================================================= */

.btn > small,
.local > small {

    grid-column: 2 / span 2;
    grid-row: 2;

    min-width: 0;

    color:
        rgba(255,255,255,.76);

    font-size: 10px;

    font-weight: 600;

    line-height: 1.25;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================================================
   SETA — LIMPA
========================================================= */

.btn > span:last-child,
.local > span:last-child {

    grid-column: 4;
    grid-row: 1 / span 2;

    width: auto;
    height: auto;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 0;

    background: transparent;

    border: 0;

    box-shadow: none;

    color:
        rgba(255,255,255,.86);

    font-family:
        Arial,
        sans-serif;

    font-size: 30px;

    font-weight: 300;

    line-height: 1;

    overflow: visible;
}


/* =========================================================
   REMOVE QUALQUER ESTILO DE EM
========================================================= */

.btn > em,
.local > em {

    display: none;
}


/* =========================================================
   BRILHO SUPERIOR
========================================================= */

.btn::before,
.local::before {

    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    top: -130px;
    right: -55px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.09);

    pointer-events: none;

    z-index: 0;
}


/* =========================================================
   BARRA LATERAL
========================================================= */

.btn::after,
.local::after {

    content: "";

    position: absolute;

    left: 0;

    top: 14px;
    bottom: 14px;

    width: 3px;

    border-radius:
        0 5px 5px 0;

    background:
        rgba(255,255,255,.55);

    pointer-events: none;

    z-index: 1;
}


/* =========================================================
   GARANTE QUE OS ELEMENTOS FIQUEM ACIMA DOS EFEITOS
========================================================= */

.btn > span,
.btn > small,
.btn > strong,
.local > span,
.local > small,
.local > strong {

    position: relative;

    z-index: 2;
}


/* =========================================================
   POLÍCIA
========================================================= */

.btn.policia {

    background:
        linear-gradient(
            135deg,
            #548fff,
            #326ed8
        );

    border:
        1px solid
        rgba(255,255,255,.10);
}


/* =========================================================
   SAMU
========================================================= */

.btn.samu {

    background:
        linear-gradient(
            135deg,
            #ffad55,
            #df7d19
        );

    border:
        1px solid
        rgba(255,255,255,.10);
}


/* =========================================================
   CENTRAL DA MULHER
========================================================= */

.btn.mulher {

    background:
        linear-gradient(
            135deg,
            #ff5795,
            #dc2f6d
        );

    border:
        1px solid
        rgba(255,255,255,.10);
}


/* =========================================================
   WHATSAPP
========================================================= */



/* =========================================================
   LOCALIZAÇÃO
========================================================= */

.local {

    min-height: 88px;

    background:
        linear-gradient(
            135deg,
            #2bd2ca,
            #14958f
        );

    border:
        1px solid
        rgba(255,255,255,.10);
}


/* =========================================================
   ADICIONAR CONTATO
========================================================= */

.btn.contato {

    min-height: 82px;

    background:
        linear-gradient(
            135deg,
            #9368ff,
            #6f42d8
        );

    border:
        1px solid
        rgba(255,255,255,.10);
}


/* =========================================================
   SOS CONTATOS
========================================================= */

.btn.sos-contatos {

    min-height: 82px;

    background:
        linear-gradient(
            135deg,
            #f0445b,
            #bd253b
        );

    border:
        1px solid
        rgba(255,255,255,.10);
}


/* =========================================================
   INTERAÇÃO
========================================================= */

.btn:active,
.local:active {

    transform:
        scale(.965);

    filter:
        brightness(1.08);

    box-shadow:
        0 7px 20px rgba(0,0,0,.30);
}


/* =========================================================
   HOVER
========================================================= */

.btn:hover,
.local:hover {

    filter:
        brightness(1.06);

    box-shadow:
        0 16px 35px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.15);
}


/* =========================================================
   FOCO
========================================================= */

.btn:focus-visible,
.local:focus-visible {

    outline:
        2px solid
        rgba(255,255,255,.75);

    outline-offset: 3px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 480px) {

    .btn,
    .local {

        min-height: 78px;

        padding:
            12px 13px;

        grid-template-columns:
            50px
            minmax(0,1fr)
            auto
            22px;

        column-gap: 10px;

        border-radius: 20px;
    }


    .btn > span:first-child,
    .local > span:first-child {

        width: 46px;
        height: 46px;

        border-radius: 14px;

        font-size: 22px;
    }


    .btn > span:nth-child(2),
    .local > span:nth-child(2) {

        font-size: 14px;
    }


    .btn > small,
    .local > small {

        font-size: 9.5px;
    }


    .btn > span:last-child,
    .local > span:last-child {

        font-size: 28px;
    }


    .local {

        min-height: 82px;
    }


    .btn.contato,
    .btn.sos-contatos {

        min-height: 78px;
    }

}

.heroTag {

    width:
        80%;

    margin-left:
        10%;

    margin-top:
        55px;

    margin-bottom:
        55px;

    min-height:
        70px;

    padding:
        13px
        18px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    color:
        #ffffff;

    

    border-radius:
        24px;

    font-family:
        "Quicksand",

    font-size:
        clamp(

        );

    font-weight:
        800;

    line-height:

    letter-spacing:

    text-align:
        center;

    box-shadow:
        0 14px 40px
        rgba(
            0,
            0,
            0,
            .55
        );

}

</style>

<section class="section">

<script>

/* =========================================================
   UTILITÁRIOS
========================================================= */

function vibrar(duracao = 100) {

    try {

        if (navigator.vibrate) {
            navigator.vibrate(duracao);
        }

    } catch (e) {}

}


function chamarAndroid(nome, ...args) {

    try {

        if (
            window.Android &&
            typeof window.Android[nome] === "function"
        ) {

            return window.Android[nome](...args);

        }

    } catch (e) {

        console.warn(
            "Android." + nome,
            e
        );

    }

    return null;
}




/* =========================================================
   LIGAÇÃO
========================================================= */

function ligar(numero) {

    if (!numero) return;

    vibrar(60);

    try {

        window.location.href =
            "tel:" + numero;

    } catch (e) {

        alert(
            "Não foi possível iniciar a ligação."
        );

    }

}

/* =========================================================
   LOCALIZAÇÃO
========================================================= */

function enviarLocalizacao() {

    if (
        !navigator.geolocation
    ) {

        alert(
            "A geolocalização não é suportada neste dispositivo."
        );

        return;

    }


    vibrar(60);


    navigator.geolocation.getCurrentPosition(

        function(pos) {

            const latitude =
                pos.coords.latitude;

            const longitude =
                pos.coords.longitude;


            const link =
                "https://maps.google.com/?q=" +
                latitude +
                "," +
                longitude;


            const mensagem =
                "🚨 SOCORRO! Estou aqui: " +
                link;


            const url =
                "https://wa.me/556196100180?text=" +
                encodeURIComponent(
                    mensagem
                );


            window.location.href =
                url;

        },

        function(error) {

            console.warn(
                "Geolocalização:",
                error
            );

            alert(
                "Não foi possível obter sua localização. " +
                "Verifique se a localização está ativada."
            );

        },

        {
            enableHighAccuracy: true,

            timeout: 10000,

            maximumAge: 5000
        }

    );

}





/* =========================================================
   CONTATOS
========================================================= */

function selecionarContato() {

    vibrar(60);

    if (
        chamarAndroid(
            "abrirContatos"
        ) !== null
    ) {

        return;

    }

    alert(
        "A função de contatos precisa da integração com o Android."
    );

}


function enviarSOSContatos() {

    vibrar(150);

    if (
        chamarAndroid(
            "enviarSOS"
        ) !== null
    ) {

        return;

    }

    alert(
        "A função SOS dos contatos precisa da integração com o Android."
    );

}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        atualizarPalmasUI(false);

        atualizarProtecaoUI();

        atualizarBrilhoUI();

    }
);

</script>
