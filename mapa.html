<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#08080a"
>

<meta
    name="color-scheme"
    content="dark"
>

<title>Mapa</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {

    font-family: "Quicksand", Arial, sans-serif;

    color: #fff;

    background:
        radial-gradient(
            circle at top,
            #19191e 0%,
            #08080a 55%,
            #000 100%
        );

    overflow: hidden;

    user-select: none;

    -webkit-user-select: none;
}


/* =========================================================
   FONTE
========================================================= */

@font-face {

    font-family: "Quicksand";

    src:
        url("font.ttf")
        format("truetype");

    font-display: swap;
}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {

    background: rgba(255,255,255,.12);

    border-radius: 999px;

    border: 2px solid transparent;

    background-clip: padding-box;
}


/* =========================================================
   FUNDO
========================================================= */

#background {

    position: fixed;

    inset: 0;

    z-index: -10;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(255, 105, 180, .10),
            transparent 40%
        ),
        #050507;

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    transform: scale(1.03);
}


/* =========================================================
   CAMADA ESCURA
========================================================= */

#background::after {

    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.42),
            rgba(0,0,0,.68)
        );
}


/* =========================================================
   CONTAINER
========================================================= */

.app {

    position: relative;

    width: 100%;
    height: 100%;

    padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));

    animation: pageIn .7s ease both;
}


/* =========================================================
   MAPA
========================================================= */

#map {

    position: absolute;

    top: max(76px, calc(64px + env(safe-area-inset-top)));

    left: max(10px, env(safe-area-inset-left));

    right: max(10px, env(safe-area-inset-right));

    bottom: max(10px, env(safe-area-inset-bottom));

    border-radius: 24px;

    overflow: hidden;

    background: #111;

    box-shadow:
        0 20px 70px rgba(0,0,0,.65),
        0 0 0 1px rgba(255,255,255,.08);

    animation: mapIn .8s cubic-bezier(.2,.8,.2,1) both;

    isolation: isolate;
}


/* =========================================================
   CABEÇALHO
========================================================= */

.header {

    position: absolute;

    top: max(10px, calc(10px + env(safe-area-inset-top)));

    left: 50%;

    transform: translateX(-50%);

    z-index: 2000;

    width: min(92%, 520px);

    min-height: 54px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 12px;

    padding: 8px 10px 8px 16px;

    border:
        1px solid rgba(255,255,255,.11);

    border-radius: 18px;

    background:
        rgba(10,10,13,.72);

    backdrop-filter:
        blur(22px)
        saturate(150%);

    -webkit-backdrop-filter:
        blur(22px)
        saturate(150%);

    box-shadow:
        0 12px 35px rgba(0,0,0,.35);

    animation: headerIn .65s ease both;
}


/* =========================================================
   TÍTULO
========================================================= */

.title {

    display: flex;

    align-items: center;

    gap: 10px;

    min-width: 0;
}

.title-icon {

    width: 34px;
    height: 34px;

    flex: 0 0 34px;

    display: grid;

    place-items: center;

    border-radius: 12px;

    color: #ff8fc7;

    background:
        rgba(255,105,180,.10);

    border:
        1px solid rgba(255,105,180,.16);

    font-size: 17px;

    box-shadow:
        0 0 20px rgba(255,105,180,.08);
}

.title-text {
    min-width: 0;
}

.title-name {

    font-size: 16px;

    font-weight: 700;

    letter-spacing: .2px;

    white-space: nowrap;
}

.title-status {

    display: flex;

    align-items: center;

    gap: 5px;

    margin-top: 2px;

    color: rgba(255,255,255,.48);

    font-size: 10px;

    font-weight: 500;
}

.status-dot {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #7dffb2;

    box-shadow:
        0 0 10px rgba(125,255,178,.7);

    animation: pulse 2s infinite;
}


/* =========================================================
   BOTÕES
========================================================= */

.header-actions {

    display: flex;

    align-items: center;

    gap: 6px;
}

.icon-button {

    width: 38px;
    height: 38px;

    display: grid;

    place-items: center;

    border: 0;

    border-radius: 12px;

    color: rgba(255,255,255,.88);

    background:
        rgba(255,255,255,.055);

    border:
        1px solid rgba(255,255,255,.07);

    cursor: pointer;

    font-family: inherit;

    font-size: 17px;

    transition:
        transform .18s ease,
        background .18s ease,
        color .18s ease;
}

.icon-button:hover {

    background:
        rgba(255,255,255,.10);

    color: #fff;

    transform: translateY(-1px);
}

.icon-button:active {

    transform: scale(.92);
}


/* =========================================================
   CONTROLES DO MAPA
========================================================= */

.map-controls {

    position: absolute;

    right: 22px;

    bottom: 22px;

    z-index: 1500;

    display: flex;

    flex-direction: column;

    gap: 8px;

    animation: controlsIn .7s .2s ease both;
}

.map-button {

    width: 46px;
    height: 46px;

    display: grid;

    place-items: center;

    border: 0;

    border-radius: 15px;

    color: #fff;

    background:
        rgba(10,10,13,.78);

    border:
        1px solid rgba(255,255,255,.10);

    backdrop-filter: blur(15px);

    -webkit-backdrop-filter: blur(15px);

    box-shadow:
        0 8px 25px rgba(0,0,0,.35);

    cursor: pointer;

    font-family: Arial, sans-serif;

    font-size: 20px;

    transition:
        transform .18s ease,
        background .18s ease;
}

.map-button:hover {

    background:
        rgba(30,30,35,.9);

    transform: translateY(-2px);
}

.map-button:active {

    transform: scale(.91);
}


/* =========================================================
   LEAFLET
========================================================= */

.leaflet-control-zoom {

    display: none !important;
}

.leaflet-control-attribution {

    margin: 0 8px 8px 0 !important;

    padding: 3px 7px !important;

    border-radius: 8px;

    color: rgba(255,255,255,.55) !important;

    background:
        rgba(0,0,0,.55) !important;

    backdrop-filter: blur(8px);

    -webkit-backdrop-filter: blur(8px);

    font-size: 9px !important;
}

.leaflet-control-attribution a {

    color: rgba(255,255,255,.75) !important;
}


/* =========================================================
   MARCADOR PERSONALIZADO
========================================================= */

.custom-marker {

    position: relative;

    width: 18px;
    height: 18px;
}

.marker-core {

    position: absolute;

    top: 50%;
    left: 50%;

    width: 9px;
    height: 9px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: #ff8fc7;

    border: 2px solid #fff;

    box-shadow:
        0 0 15px rgba(255,105,180,.9);
}

.marker-ring {

    position: absolute;

    inset: 0;

    border-radius: 50%;

    border: 1px solid rgba(255,143,199,.7);

    animation: markerPulse 2s infinite;
}


/* =========================================================
   MARCADOR DO USUÁRIO
========================================================= */

.user-location {

    width: 18px;
    height: 18px;

    border-radius: 50%;

    background: #6eb5ff;

    border: 3px solid #fff;

    box-shadow:
        0 0 0 7px rgba(110,181,255,.18),
        0 0 25px rgba(110,181,255,.75);
}


/* =========================================================
   TOAST
========================================================= */

.toast {

    position: absolute;

    left: 50%;

    bottom: 22px;

    transform:
        translate(-50%, 20px);

    z-index: 3000;

    max-width: calc(100% - 40px);

    padding: 11px 16px;

    border-radius: 13px;

    color: rgba(255,255,255,.92);

    background:
        rgba(12,12,15,.88);

    border:
        1px solid rgba(255,255,255,.10);

    backdrop-filter: blur(18px);

    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 12px 35px rgba(0,0,0,.4);

    font-size: 12px;

    text-align: center;

    pointer-events: none;

    opacity: 0;

    transition:
        opacity .25s ease,
        transform .25s ease;
}

.toast.show {

    opacity: 1;

    transform:
        translate(-50%, 0);
}


/* =========================================================
   ANIMAÇÕES
========================================================= */

@keyframes pageIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes mapIn {

    from {
        opacity: 0;
        transform: scale(.97);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes headerIn {

    from {
        opacity: 0;
        transform:
            translate(-50%, -15px);
    }

    to {
        opacity: 1;
        transform:
            translate(-50%, 0);
    }
}

@keyframes controlsIn {

    from {
        opacity: 0;
        transform: translateX(20px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}

@keyframes pulse {

    0%,
    100% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: .45;
        transform: scale(.75);
    }
}

@keyframes markerPulse {

    0% {
        opacity: .8;
        transform: scale(.65);
    }

    70% {
        opacity: 0;
        transform: scale(1.8);
    }

    100% {
        opacity: 0;
        transform: scale(1.8);
    }
}


/* =========================================================
   CELULAR
========================================================= */

@media (max-width: 600px) {

    #map {

        top: max(72px, calc(60px + env(safe-area-inset-top)));

        left: 7px;

        right: 7px;

        bottom: max(7px, env(safe-area-inset-bottom));

        border-radius: 21px;
    }

    .header {

        width: calc(100% - 20px);

        min-height: 52px;

        padding-left: 13px;
    }

    .title-name {
        font-size: 15px;
    }

    .title-status {
        font-size: 9px;
    }

    .title-icon {

        width: 32px;
        height: 32px;

        flex-basis: 32px;
    }

    .icon-button {

        width: 36px;
        height: 36px;

        font-size: 16px;
    }

    .map-controls {

        right: 15px;

        bottom: 17px;
    }

    .map-button {

        width: 44px;
        height: 44px;

        border-radius: 14px;
    }
}


/* =========================================================
   TELAS MUITO PEQUENAS
========================================================= */

@media (max-width: 360px) {

    .header-actions .icon-button:last-child {

        display: none;
    }

    .title-status {
        display: none;
    }
}

</style>

</head>


<body>


<div id="background"></div>


<div class="app">


    <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

    <header class="header">

        <div class="title">

            <div class="title-icon">
                ◉
            </div>

            <div class="title-text">

                <div class="title-name">
                    Mapa
                </div>

                <div class="title-status">

                    <span class="status-dot"></span>

                    Mapa online

                </div>

            </div>

        </div>


        <div class="header-actions">

            <button
                class="icon-button"
                id="locateButton"
                aria-label="Minha localização"
                title="Minha localização"
            >
                ⌖
            </button>

            <button
                class="icon-button"
                id="resetButton"
                aria-label="Voltar ao centro"
                title="Voltar ao centro"
            >
                ⌂
            </button>

        </div>

    </header>


    <!-- =====================================================
         MAPA
    ====================================================== -->

    <main id="map"></main>


    <!-- =====================================================
         CONTROLES
    ====================================================== -->

    <div class="map-controls">

        <button
            class="map-button"
            id="zoomIn"
            aria-label="Aumentar zoom"
            title="Aumentar zoom"
        >
            +
        </button>

        <button
            class="map-button"
            id="zoomOut"
            aria-label="Diminuir zoom"
            title="Diminuir zoom"
        >
            −
        </button>

        <button
            class="map-button"
            id="myLocation"
            aria-label="Encontrar localização"
            title="Encontrar localização"
        >
            ◎
        </button>

    </div>


    <!-- =====================================================
         TOAST
    ====================================================== -->

    <div
        id="toast"
        class="toast"
    ></div>


</div>


<script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const CENTER = [-23.5505, -46.6333];

const DEFAULT_ZOOM = 12;


/* =========================================================
   MAPA
========================================================= */

const map = L.map("map", {

    zoomControl: false,

    attributionControl: true,

    preferCanvas: true,

    zoomAnimation: true,

    fadeAnimation: true,

    markerZoomAnimation: true,

    minZoom: 3,

    maxZoom: 19

}).setView(
    CENTER,
    DEFAULT_ZOOM
);


/* =========================================================
   MAPA BASE
========================================================= */

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {

        maxZoom: 19,

        minZoom: 3,

        updateWhenIdle: true,

        keepBuffer: 2,

        attribution:
            '&copy; OpenStreetMap contributors'

    }
).addTo(map);


/* =========================================================
   MARCADOR CUSTOMIZADO
========================================================= */

const markerIcon = L.divIcon({

    className: "",

    html: `
        <div class="custom-marker">

            <div class="marker-ring"></div>

            <div class="marker-core"></div>

        </div>
    `,

    iconSize: [18, 18],

    iconAnchor: [9, 9]

});


/* =========================================================
   PONTOS
========================================================= */

const pontos = [

    [-23.5505, -46.6333],

    [-23.5600, -46.6200],

    [-23.5400, -46.6500]

];


const markers = [];


pontos.forEach((position, index) => {

    const marker = L.marker(
        position,
        {
            icon: markerIcon,
            keyboard: false
        }
    ).addTo(map);

    marker.bindTooltip(
        `Ponto ${index + 1}`,
        {
            direction: "top",

            offset: [0, -10],

            opacity: .9
        }
    );

    markers.push(marker);

});


/* =========================================================
   FUNÇÕES
========================================================= */

function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer =
        setTimeout(() => {

            toast.classList.remove("show");

        }, 2500);
}


/* =========================================================
   ZOOM
========================================================= */

document
    .getElementById("zoomIn")
    .addEventListener("click", () => {

        map.zoomIn();

    });


document
    .getElementById("zoomOut")
    .addEventListener("click", () => {

        map.zoomOut();

    });


/* =========================================================
   VOLTAR AO CENTRO
========================================================= */

function resetMap() {

    map.flyTo(
        CENTER,
        DEFAULT_ZOOM,
        {
            duration: .8
        }
    );

}


document
    .getElementById("resetButton")
    .addEventListener(
        "click",
        resetMap
    );


/* =========================================================
   LOCALIZAÇÃO
========================================================= */

let userMarker = null;

let userAccuracy = null;


function locateUser() {

    if (!navigator.geolocation) {

        showToast(
            "A localização não está disponível neste dispositivo."
        );

        return;
    }


    showToast(
        "Obtendo sua localização..."
    );


    navigator.geolocation.getCurrentPosition(

        position => {

            const lat =
                position.coords.latitude;

            const lng =
                position.coords.longitude;

            const accuracy =
                position.coords.accuracy;


            const userIcon =
                L.divIcon({

                    className: "",

                    html:
                        `<div class="user-location"></div>`,

                    iconSize: [18, 18],

                    iconAnchor: [9, 9]

                });


            if (userMarker) {

                userMarker.setLatLng([
                    lat,
                    lng
                ]);

            } else {

                userMarker =
                    L.marker(
                        [lat, lng],
                        {
                            icon: userIcon,
                            zIndexOffset: 1000
                        }
                    )
                    .addTo(map);

            }


            if (userAccuracy) {

                map.removeLayer(
                    userAccuracy
                );

            }


            userAccuracy =
                L.circle(
                    [lat, lng],
                    {
                        radius: accuracy,

                        color: "#6eb5ff",

                        weight: 1,

                        opacity: .35,

                        fillColor: "#6eb5ff",

                        fillOpacity: .06
                    }
                ).addTo(map);


            map.flyTo(
                [lat, lng],
                Math.max(
                    map.getZoom(),
                    15
                ),
                {
                    duration: 1
                }
            );


            showToast(
                "Localização encontrada."
            );

        },

        error => {

            let message =
                "Não foi possível obter sua localização.";

            if (error.code === 1) {

                message =
                    "Permissão de localização negada.";

            }

            if (error.code === 2) {

                message =
                    "Localização indisponível.";

            }

            if (error.code === 3) {

                message =
                    "Tempo limite da localização.";

            }

            showToast(message);

        },

        {

            enableHighAccuracy: true,

            timeout: 10000,

            maximumAge: 30000

        }

    );

}


document
    .getElementById("locateButton")
    .addEventListener(
        "click",
        locateUser
    );


document
    .getElementById("myLocation")
    .addEventListener(
        "click",
        locateUser
    );


/* =========================================================
   CLIQUE DUPLO
========================================================= */

map.on(
    "dblclick",
    event => {

        map.flyTo(
            event.latlng,
            Math.min(
                map.getZoom() + 2,
                19
            ),
            {
                duration: .5
            }
        );

    }
);


/* =========================================================
   TECLADO
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "+" ||
            event.key === "="
        ) {

            map.zoomIn();

        }

        if (
            event.key === "-" ||
            event.key === "_"
        ) {

            map.zoomOut();

        }

        if (
            event.key === "Escape"
        ) {

            resetMap();

        }

    }
);


/* =========================================================
   WALLPAPER ANDROID
========================================================= */

window.addEventListener(
    "load",
    () => {

        let wall = "";

        try {

            if (
                typeof Android !== "undefined" &&
                typeof Android.getWallpaperUrl === "function"
            ) {

                wall =
                    Android.getWallpaperUrl();

            }

        } catch (error) {

            wall = "";

        }


        const background =
            document.getElementById(
                "background"
            );


        if (
            wall &&
            typeof wall === "string" &&
            wall.trim().length > 0
        ) {

            background.style.backgroundImage =
                `url("${wall.replace(/"/g, '\\"')}")`;

        }

    }
);


/* =========================================================
   REDIMENSIONAMENTO
========================================================= */

window.addEventListener(
    "resize",
    () => {

        setTimeout(
            () => map.invalidateSize(),
            150
        );

    }
);


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

setTimeout(
    () => {

        map.invalidateSize();

    },
    300
);

</script>


</body>

</html>
