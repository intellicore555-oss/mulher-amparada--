<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Materiais - Mulher Amparada</title>

  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Quicksand', sans-serif;
    }

    body{
      background:#000;
      color:#fff;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .container{
      text-align:center;
      padding:32px;
      border-radius:22px;
      background:rgba(255, 182, 193, 0.06);
      
    }

    h1{
      font-size:22px;
      margin-bottom:10px;
      font-weight:700;
      color:#ffb6c1;
    }

    p{
      font-size:14px;
      opacity:0.7;
      margin-bottom:22px;
    }

    .btns{
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
    }

    a.button{
      padding:12px 22px;
      border-radius:12px;
      text-decoration:none;
      color:#ffb6c1;
      border:1px solid #ffb6c1;
      font-weight:600;
      transition:0.3s;
      min-width:150px;
      text-align:center;
    }

    a.button:hover{
      background:#ffb6c1;
      color:#000;
      transform:translateY(-3px);
      box-shadow:0 0 20px rgba(255, 182, 193, 0.4);
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Materiais do Projeto Mulher Amparada</h1>
    <p>Baixe os arquivos abaixo</p>

    <div class="btns">
      <a class="button" href="material2.pptx" download>
        Baixar PPTX
      </a>

      <a class="button" href="material1.pdf" download>
        Baixar PDF
      </a>

<a class="button" href="material4.png" download>
        Baixar imagem <br> de divulgação 1
      </a>

<a class="button" href="material5.png" download>
        Baixar imagem <br> de divulgação 2
      </a>
    </div>
  </div>

</body>
</html>
