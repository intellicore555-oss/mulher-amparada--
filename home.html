<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#050505">

<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

<title>Hub • Mulher Amparada</title>


<style>

@font-face{
    font-family:"Quicksand";
    src:url("font.ttf") format("truetype");
    font-display:swap;
}


/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    -webkit-tap-highlight-color:transparent;
}

html{
    background:#050505;
    color-scheme:dark;

    scroll-behavior:smooth;
}

body{
    min-height:100dvh;

    background:#050505;

    color:#fff;

    font-family:"Quicksand",sans-serif;

    overflow-x:hidden;

    -webkit-font-smoothing:antialiased;
}


/* =========================================================
   FUNDO
========================================================= */

body::before{

    content:"";

    position:fixed;

    z-index:-2;

    width:520px;
    height:520px;

    top:-330px;
    left:50%;

    transform:translateX(-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,105,170,.13),
            transparent 68%
        );

    filter:blur(25px);

    pointer-events:none;
}

body::after{

    content:"";

    position:fixed;

    z-index:-2;

    width:450px;
    height:450px;

    right:-300px;
    bottom:-260px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(143,92,246,.10),
            transparent 70%
        );

    filter:blur(30px);

    pointer-events:none;
}


/* =========================================================
   APP
========================================================= */

@keyframes fadeUp {

            from {
                opacity: 0;
                
            }

            to {
                opacity: 1;
          
            }
        }
        
        
.container{

    width:100%;

    max-width:680px;

    margin:0 auto;
animation:
                fadeUp 0.55s ease both;
    padding:
        calc(22px + env(safe-area-inset-top))
        5%
        calc(35px + env(safe-area-inset-bottom));

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

    display:flex;

    align-items:center;

    justify-content:space-between;

    height:52px;

    margin-bottom:25px;

}

.topbar-brand{

    display:flex;

    align-items:center;

    gap:11px;

}

.brand-icon{

    width:40px;
    height:40px;

    display:grid;

    place-items:center;

    border-radius:13px;

    background:
        linear-gradient(
            145deg,
            #ff75ae,
            #9855f4
        );

    box-shadow:
        0 8px 25px
        rgba(194,82,160,.20);

    font-size:19px;

    font-weight:800;

}

.brand-text{

    display:flex;

    flex-direction:column;

}

.brand-name{

    font-size:15px;

    font-weight:800;

    letter-spacing:-.3px;

}

.brand-label{

    margin-top:1px;

    color:#5f5f66;

    font-size:9px;

    text-transform:uppercase;

    letter-spacing:1.2px;

}


/* =========================================================
   HERO
========================================================= */

.header{

    position:relative;

    margin-bottom:25px;

    padding:29px 24px 27px;

    border-radius:28px;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            #151515,
            #0b0b0b
        );

    border:
        1px solid
        rgba(255,255,255,.07);

    box-shadow:
        0 20px 55px
        rgba(0,0,0,.42);

}


/* brilho */

.header::before{

    content:"";

    position:absolute;

    width:220px;
    height:220px;

    top:-150px;
    right:-100px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,122,177,.18),
            transparent 68%
        );

    filter:blur(8px);

}

.header::after{

    content:"";

    position:absolute;

    width:140px;
    height:140px;

    left:-100px;
    bottom:-100px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(150,92,246,.12),
            transparent 70%
        );

}


/* etiqueta */

.eyebrow{

    position:relative;
    z-index:2;

    display:flex;

    align-items:center;

    gap:8px;

    margin-bottom:12px;

    color:#77777e;

    font-size:10px;

    font-weight:700;

    text-transform:uppercase;

    letter-spacing:1.5px;

}

.eyebrow span{

    width:6px;
    height:6px;

    border-radius:50%;

    background:#ff79b0;

    box-shadow:
        0 0 12px
        rgba(255,121,176,.7);

}


/* título */

.header h1{

    position:relative;

    z-index:2;

    font-size:
        clamp(
            31px,
            8vw,
            44px
        );

    line-height:1.05;

    letter-spacing:-1.7px;

    font-weight:800;

}

.header h1 span{

    background:
        linear-gradient(
            90deg,
            #ff91bd,
            #c084fc
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

}

.header p{

    position:relative;

    z-index:2;

    margin-top:11px;

    max-width:470px;

    color:#808087;

    font-size:12.5px;

    line-height:1.6;

}


/* =========================================================
   SEÇÃO
========================================================= */

.section-label{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin:
        0 4px
        11px;

}

.section-label strong{

    color:#d7d7db;

    font-size:11px;

    font-weight:700;

    text-transform:uppercase;

    letter-spacing:1.2px;

}

.section-label span{

    color:#494950;

    font-size:10px;

}


/* =========================================================
   MENU
========================================================= */

.menu{

    display:flex;

    flex-direction:column;

    gap:8px;

}


/* =========================================================
   ITEM
========================================================= */

.menu button{

    position:relative;

    width:100%;

    min-height:72px;

    padding:12px 13px;

    display:grid;

    grid-template-columns:
        42px
        minmax(0,1fr)
        28px;

    align-items:center;

    gap:12px;

    border:
        1px solid
        rgba(255,255,255,.055);

    border-radius:19px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.018)
        );

    color:#fff;

    font-family:inherit;

    text-align:left;

    cursor:pointer;

    overflow:hidden;

    transition:
        transform .16s ease,
        border-color .16s ease,
        background .16s ease,
        box-shadow .16s ease;

}


/* linha de destaque */

.menu button::before{

    content:"";

    position:absolute;

    left:0;
    top:14px;
    bottom:14px;

    width:3px;

    border-radius:
        0
        5px
        5px
        0;

    background:
        linear-gradient(
            180deg,
            #ff78b0,
            #a855f7
        );

    opacity:.75;

}


/* =========================================================
   NÚMERO / ÍCONE
========================================================= */

.item-number{

    width:42px;
    height:42px;

    display:grid;

    place-items:center;

    border-radius:14px;

    background:#181818;

    border:
        1px solid
        rgba(255,255,255,.055);

    color:#a7a7ad;

    font-size:11px;

    font-weight:800;

    transition:
        background .16s ease,
        color .16s ease;

}


/* =========================================================
   TEXTO
========================================================= */

.item-content{

    min-width:0;

}

.item-title{

    color:#eeeeef;

    font-size:14px;

    font-weight:700;

    line-height:1.3;

}

.item-subtitle{

    margin-top:3px;

    color:#66666d;

    font-size:10px;

    line-height:1.3;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


/* =========================================================
   SETA
========================================================= */

.item-arrow{

    width:28px;
    height:28px;

    display:grid;

    place-items:center;

    border-radius:10px;

    color:#66666c;

    font-size:22px;

    font-weight:300;

    transition:
        transform .16s ease,
        color .16s ease,
        background .16s ease;

}


/* =========================================================
   HOVER
========================================================= */

@media(hover:hover){

    .menu button:hover{

        transform:translateY(-2px);

        border-color:
            rgba(255,130,185,.22);

        background:
            linear-gradient(
                145deg,
                rgba(255,110,174,.085),
                rgba(151,85,244,.055)
            );

        box-shadow:
            0 10px 30px
            rgba(0,0,0,.32);

    }

    .menu button:hover .item-number{

        color:#ff9bc2;

        background:
            rgba(255,120,177,.09);

        border-color:
            rgba(255,120,177,.15);

    }

    .menu button:hover .item-arrow{

        transform:translateX(3px);

        color:#ff8fba;

        background:
            rgba(255,255,255,.035);

    }

}


/* =========================================================
   TOQUE
========================================================= */

.menu button:active{

    transform:scale(.985);

    background:
        linear-gradient(
            145deg,
            rgba(255,110,174,.12),
            rgba(151,85,244,.08)
        );

}


/* =========================================================
   RODAPÉ
========================================================= */

.footer{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    margin-top:22px;

    color:#45454b;

    font-size:9px;

    letter-spacing:1px;

    text-transform:uppercase;

}

.footer::before,
.footer::after{

    content:"";

    width:25px;

    height:1px;

    background:#1c1c1f;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:420px){

    .container{

        padding-left:5%;
        padding-right:5%;

    }

    .header{

        padding:
            24px 20px;

        border-radius:24px;

    }

    .header h1{

        font-size:30px;

    }

    .menu{

        gap:7px;

    }

    .menu button{

        min-height:67px;

        grid-template-columns:
            39px
            minmax(0,1fr)
            25px;

        gap:10px;

        padding:
            10px 11px;

        border-radius:17px;

    }

    .item-number{

        width:39px;
        height:39px;

        border-radius:12px;

    }

    .item-title{

        font-size:13px;

    }

    .item-subtitle{

        font-size:9px;

    }

}


/* =========================================================
   TELAS MUITO PEQUENAS
========================================================= */

@media(max-width:360px){

    .brand-text{

        display:none;

    }

    .header{

        margin-bottom:20px;

    }

    .header h1{

        font-size:28px;

    }

    .menu button{

        min-height:64px;

    }

    .item-subtitle{

        display:none;

    }

}



</style>

</head>
