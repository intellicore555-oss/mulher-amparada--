<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#08080a">


<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

<title>Hub</title>

<style>

/* =========================================================
   FONTE
========================================================= */

@font-face {
    font-family: "Quicksand";
    src: url("font.ttf") format("truetype");
    font-display: swap;
}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #000;

    color: #fff;

    font-family: "Quicksand", sans-serif;

    -webkit-tap-highlight-color: transparent;
}


/* =========================================================
   CONTAINER
========================================================= */

.container {
    width: 100%;
    max-width: 620px;

    margin: 0 auto;

    padding:
        calc(28px + env(safe-area-inset-top))
        18px
        calc(30px + env(safe-area-inset-bottom));
}


/* =========================================================
   CABEÇALHO
========================================================= */

.header {
    text-align: center;

    margin-bottom: 28px;
}

.logo {
    width: 68px;
    height: 68px;

    margin: 0 auto 17px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            #ff82b5,
            #a855f7
        );

    box-shadow:
        0 0 25px rgba(255, 82, 164, 0.25),
        0 0 45px rgba(168, 85, 247, 0.12);

    font-size: 30px;
    font-weight: 800;

    color: white;
}

.header h1 {
    font-size: 30px;
    font-weight: 800;

    letter-spacing: -0.5px;

    background:
        linear-gradient(
            90deg,
            #ff91bd,
            #c084fc
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

.header p {
    margin-top: 7px;

    color: #92929b;

    font-size: 14px;
    line-height: 1.5;
}


/* =========================================================
   MENU
========================================================= */

.menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
}


/* =========================================================
   BOTÕES
========================================================= */

.menu button {

    width: 100%;
    min-height: 64px;

    padding: 15px 18px;

    border: 1px solid rgba(255, 255, 255, 0.07);

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.055),
            rgba(255, 255, 255, 0.025)
        );

    color: #f5f5f7;

    font-family: inherit;
    font-size: 15px;
    font-weight: 700;

    text-align: left;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: space-between;

    transition:
        transform 0.18s ease,
        border-color 0.18s ease,
        background 0.18s ease,
        box-shadow 0.18s ease;

    position: relative;
    overflow: hidden;
}


/* brilho lateral */

.menu button::before {

    content: "";

    width: 4px;
    height: 28px;

    position: absolute;
    left: 0;
    top: 50%;

    transform: translateY(-50%);

    border-radius: 0 5px 5px 0;

    background:
        linear-gradient(
            180deg,
            #ff83b5,
            #a855f7
        );
}


/* seta */

.menu button::after {

    content: "›";

    color: #ff8eb8;

    font-size: 27px;
    font-weight: 400;

    margin-left: 12px;

    transition:
        transform 0.18s ease,
        color 0.18s ease;
}


/* =========================================================
   HOVER
========================================================= */

@media (hover: hover) {

    .menu button:hover {

        transform: translateY(-2px);

        border-color:
            rgba(255, 126, 181, 0.35);

        background:
            linear-gradient(
                135deg,
                rgba(255, 113, 172, 0.10),
                rgba(168, 85, 247, 0.08)
            );

        box-shadow:
            0 8px 25px rgba(0, 0, 0, 0.30),
            0 0 18px rgba(255, 91, 163, 0.07);
    }

    .menu button:hover::after {
        transform: translateX(4px);
        color: #c084fc;
    }
}


/* =========================================================
   TOQUE
========================================================= */

.menu button:active {

    transform: scale(0.985);

    background:
        linear-gradient(
            135deg,
            rgba(255, 113, 172, 0.15),
            rgba(168, 85, 247, 0.12)
        );
}


/* =========================================================
   RODAPÉ
========================================================= */

.footer {

    margin-top: 28px;

    text-align: center;

    color: #55555e;

    font-size: 12px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 420px) {

    .container {
        padding-left: 14px;
        padding-right: 14px;
    }

    .header h1 {
        font-size: 27px;
    }

    .menu {
        gap: 10px;
    }

    .menu button {
        min-height: 61px;
        border-radius: 16px;
        font-size: 14px;
    }
}

</style>

</head>


<body>

<main class="container">

    <header class="header">



        <h1>Mulher Amparada</h1>

        <p>
            Central de informações e recursos do projeto
        </p>

    </header>


    <nav class="menu">

        <button onclick="setTimeout(() => window.location.href='eu1.html', 500)">
            Sobre o desenvolvedor
        </button>

        <button onclick="setTimeout(() => window.location.href='qr.html', 500)">
            Gerador de QR CODE
        </button>

        <button onclick="setTimeout(() => window.location.href='a.html', 500)">
            Explicação do projeto
        </button>

        <button onclick="setTimeout(() => window.location.href='a.html', 500)">
            Sobre o desenvolvimento do projeto e versões do app
        </button>

        <button onclick="setTimeout(() => window.location.href='final.html', 500)">
            Dia da conclusão do app
        </button>

        <button onclick="setTimeout(() => window.location.href='nome.html', 500)">
            Nome verdadeiro do app
        </button>

        <button onclick="setTimeout(() => window.location.href='codigo.html', 500)">
            Código usado para fazer o app
        </button>

        <button onclick="setTimeout(() => window.location.href='data.html', 500)">
            Onde nos encontrar?
        </button>

    </nav>


    <footer class="footer">
        Secured By • Mulher Amparada 
    </footer>

</main>

</body>

</html>
