# ============================================================
      # 14. COMPILAR PROJETO IOS
      #
      # O BUILD PODE FALHAR.
      # ISSO NÃO IMPEDE A GERAÇÃO DO ZIP.
      # ============================================================

      - name: Compilar projeto iOS
        id: ios_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          cd conversion/ios

          echo "Iniciando build do projeto iOS..."

          xcodebuild \
            -project MulherAmparada.xcodeproj \
            -scheme MulherAmparada \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build \
            2>&1 | tee ../../xcodebuild.log

          STATUS=${PIPESTATUS[0]}

          echo "Build terminou com código: $STATUS"

          exit $STATUS


      # ============================================================
      # 15. REGISTRAR RESULTADO DO BUILD
      # ============================================================

      - name: Registrar resultado do build
        if: always()
        shell: bash
        run: |
          REPORT="conversion/report/adaptation-report.md"

          echo "" >> "$REPORT"
          echo "## Resultado do Build" >> "$REPORT"
          echo "" >> "$REPORT"

          if [ "${{ steps.ios_build.outcome }}" = "success" ]; then

            echo "✅ O projeto iOS foi compilado com sucesso." \
              >> "$REPORT"

          else

            echo "⚠️ O projeto iOS apresentou erros durante a compilação." \
              >> "$REPORT"

            echo "" >> "$REPORT"

            echo "O ZIP foi gerado mesmo assim para permitir correções manuais." \
              >> "$REPORT"

            echo "" >> "$REPORT"

            if [ -f xcodebuild.log ]; then

              echo "### Erros do Xcode" >> "$REPORT"
              echo "" >> "$REPORT"

              echo '```text' >> "$REPORT"

              grep -Ei \
                'error:|fatal error:|BUILD FAILED|warning:' \
                xcodebuild.log \
                | tail -100 \
                >> "$REPORT" || true

              echo '```' >> "$REPORT"

            fi

          fi


      # ============================================================
      # 16. README
      # ============================================================

      - name: Criar README
        if: always()
        shell: bash
        run: |
          cat > conversion/ios/README.md <<'EOF'
# Mulher Amparada — versão iOS

Este projeto foi gerado automaticamente a partir do projeto Android.

## Conversão automática

O conversor tentou transformar automaticamente:

- HTML
- CSS
- JavaScript
- imagens
- áudio
- recursos Web
- WebView → WKWebView
- estrutura básica → SwiftUI
- APIs Android conhecidas → equivalentes iOS quando possível

## Funcionalidades que precisam de adaptação

Consulte:

`../report/adaptation-report.md`

O relatório lista APIs Android encontradas durante a análise.

## Build

O GitHub Actions tentou compilar o projeto usando o Xcode.

### Se o build falhar

O projeto continuará disponível.

O objetivo do workflow é gerar o máximo possível mesmo quando
existem partes que precisam de adaptação manual.

## Arquivos importantes

- `MulherAmparada/`
- `MulherAmparada.xcodeproj`
- `Resources/`
- `../report/adaptation-report.md`
- `../../xcodebuild.log`

## Assinatura

Para instalar em um iPhone físico ou distribuir o aplicativo,
a configuração de assinatura da Apple ainda precisa ser realizada.
EOF


      # ============================================================
      # 17. COPIAR LOG PARA O PACOTE
      # ============================================================

      - name: Copiar log do Xcode
        if: always()
        shell: bash
        run: |
          if [ -f xcodebuild.log ]; then
            cp xcodebuild.log conversion/report/
          fi


      # ============================================================
      # 18. GERAR ZIP MESMO COM ERRO
      # ============================================================

      - name: Gerar ZIP
        if: always()
        shell: bash
        run: |
          set -e

          rm -f projeto-ios.zip

          cd conversion

          # Não incluir o diretório de build do Xcode.
          rm -rf ios/build

          zip -r ../projeto-ios.zip \
            ios \
            report

          echo ""
          echo "========================================"
          echo "ZIP GERADO"
          echo "========================================"

          ls -lh ../projeto-ios.zip


      # ============================================================
      # 19. PUBLICAR ZIP
      # ============================================================

      - name: Publicar projeto iOS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projeto-ios
          path: projeto-ios.zip
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 20. PUBLICAR RELATÓRIO
      # ============================================================

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptation-report
          path: conversion/report/
          if-no-files-found: warn
          retention-days: 30