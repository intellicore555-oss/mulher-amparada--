name: Converter Android para iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert:
    name: Converter projeto Android → iOS
    runs-on: macos-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar ambiente
        run: |
          set -e

          mkdir -p conversion/ios-project
          mkdir -p conversion/ios-project/MulherAmparada
          mkdir -p conversion/ios-project/MulherAmparada/Resources
          mkdir -p conversion/report

      - name: Analisar projeto Android
        shell: bash
        run: |
          set -e

          REPORT="conversion/report/adaptation-report.md"

          cat > "$REPORT" <<'EOF'
          # Relatório de conversão Android → iOS

          Gerado automaticamente pelo GitHub Actions.

          ## Status

          EOF

          echo "- Data: $(date)" >> "$REPORT"
          echo "- Runner: macOS" >> "$REPORT"
          echo "" >> "$REPORT"

          echo "## Arquivos encontrados" >> "$REPORT"
          echo "" >> "$REPORT"

          echo '```text' >> "$REPORT"
          find . \
            -not -path './.git/*' \
            -not -path './conversion/*' \
            -type f \
            | sort \
            | head -1000 >> "$REPORT"
          echo '```' >> "$REPORT"
          echo "" >> "$REPORT"

          echo "## APIs Android detectadas" >> "$REPORT"
          echo "" >> "$REPORT"

          FOUND=0

          check_api() {
            NAME="$1"
            PATTERN="$2"
            IOS="$3"

            if grep -RInE \
              --exclude-dir=.git \
              --exclude-dir=conversion \
              "$PATTERN" . >/tmp/android-api-result 2>/dev/null; then

              FOUND=$((FOUND + 1))

              echo "### $NAME" >> "$REPORT"
              echo "" >> "$REPORT"
              echo "**Possível equivalente iOS:** $IOS" >> "$REPORT"
              echo "" >> "$REPORT"

              echo '```text' >> "$REPORT"
              head -30 /tmp/android-api-result >> "$REPORT"
              echo '```' >> "$REPORT"
              echo "" >> "$REPORT"
            fi
          }

          check_api \
            "WebView" \
            'android\.webkit\.WebView|WebView\(' \
            "WKWebView"

          check_api \
            "Biometria" \
            'BiometricPrompt|androidx\.biometric' \
            "LocalAuthentication"

          check_api \
            "Localização" \
            'FusedLocationProvider|LocationManager|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION' \
            "Core Location"

          check_api \
            "Sensores / acelerômetro" \
            'SensorManager|TYPE_ACCELEROMETER|Sensor\.TYPE' \
            "Core Motion"

          check_api \
            "SharedPreferences" \
            'SharedPreferences|EncryptedSharedPreferences' \
            "UserDefaults / Keychain"

          check_api \
            "Serviço Android" \
            'extends Service|: Service\(' \
            "Background Tasks / APIs específicas do iOS"

          check_api \
            "BroadcastReceiver" \
            'BroadcastReceiver' \
            "NotificationCenter / APIs específicas"

          check_api \
            "Quick Settings" \
            'TileService|Quick Settings' \
            "Não existe equivalente direto"

          check_api \
            "Device Admin" \
            'DevicePolicyManager|BIND_DEVICE_ADMIN' \
            "Não existe equivalente geral para apps comuns"

          check_api \
            "Telefone" \
            'CALL_PHONE|TelephonyManager|ACTION_CALL' \
            "Phone / tel: URL"

          check_api \
            "SMS" \
            'SEND_SMS|SmsManager' \
            "MFMessageComposeViewController"

          check_api \
            "Câmera" \
            'android\.hardware\.camera|CameraManager|android\.permission\.CAMERA' \
            "AVFoundation"

          check_api \
            "Bluetooth" \
            'BluetoothAdapter|BluetoothManager|BLUETOOTH_' \
            "CoreBluetooth"

          check_api \
            "Notificações" \
            'NotificationManager|POST_NOTIFICATIONS|NotificationCompat' \
            "UserNotifications"

          check_api \
            "Foreground Service" \
            'FOREGROUND_SERVICE|startForeground|startForegroundService' \
            "Não há equivalente direto"

          check_api \
            "AlarmManager" \
            'AlarmManager|setExact|setRepeating' \
            "UNUserNotificationCenter / Background Tasks"

          check_api \
            "WorkManager" \
            'WorkManager|androidx\.work' \
            "BackgroundTasks"

          echo "## Resumo" >> "$REPORT"
          echo "" >> "$REPORT"
          echo "- APIs Android detectadas: **$FOUND**" >> "$REPORT"
          echo "" >> "$REPORT"

      - name: Copiar recursos HTML/CSS/JavaScript
        shell: bash
        run: |
          set -e

          DEST="conversion/ios-project/MulherAmparada/Resources"

          find . \
            -type d \
            \( \
              -path './.git' -o \
              -path './conversion' \
            \) -prune -false \
            -o -type f \
            \( \
              -name '*.html' -o \
              -name '*.css' -o \
              -name '*.js' -o \
              -name '*.json' -o \
              -name '*.png' -o \
              -name '*.jpg' -o \
              -name '*.jpeg' -o \
              -name '*.webp' -o \
              -name '*.svg' -o \
              -name '*.mp3' -o \
              -name '*.wav' \
            \) \
            -print0 |
          while IFS= read -r -d '' FILE; do
            REL="${FILE#./}"
            mkdir -p "$DEST/$(dirname "$REL")"
            cp "$FILE" "$DEST/$REL"
          done

      - name: Criar implementação WKWebView
        shell: bash
        run: |
          set -e

          APP="conversion/ios-project/MulherAmparada"

          cat > "$APP/WebView.swift" <<'EOF'
          import SwiftUI
          import WebKit

          struct WebView: UIViewRepresentable {

              func makeUIView(context: Context) -> WKWebView {
                  let configuration = WKWebViewConfiguration()

                  let webView = WKWebView(
                      frame: .zero,
                      configuration: configuration
                  )

                  webView.allowsBackForwardNavigationGestures = true

                  if let url = Bundle.main.url(
                      forResource: "index",
                      withExtension: "html",
                      subdirectory: "Resources"
                  ) {
                      webView.loadFileURL(
                          url,
                          allowingReadAccessTo:
                              url.deletingLastPathComponent()
                      )
                  }

                  return webView
              }

              func updateUIView(
                  _ webView: WKWebView,
                  context: Context
              ) {}
          }
          EOF

      - name: Criar ContentView
        shell: bash
        run: |
          cat > conversion/ios-project/MulherAmparada/ContentView.swift <<'EOF'
          import SwiftUI

          struct ContentView: View {

              var body: some View {
                  WebView()
                      .ignoresSafeArea()
              }
          }
          EOF

      - name: Criar App Swift
        shell: bash
        run: |
          cat > conversion/ios-project/MulherAmparada/MulherAmparadaApp.swift <<'EOF'
          import SwiftUI

          @main
          struct MulherAmparadaApp: App {

              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

      - name: Criar README
        shell: bash
        run: |
          cat > conversion/ios-project/README.md <<'EOF'
          # Projeto iOS convertido

          Este projeto foi gerado automaticamente a partir de um projeto Android.

          ## O que foi convertido

          - Recursos HTML
          - CSS
          - JavaScript
          - Imagens
          - Áudios
          - Estrutura básica SwiftUI
          - WKWebView

          ## Importante

          O projeto Android pode conter APIs que não possuem equivalente
          direto no iOS.

          Consulte:

          `report/adaptation-report.md`

          antes de utilizar o projeto em produção.

          ## Próximos passos

          1. Abra o projeto no Xcode.
          2. Configure o Bundle Identifier.
          3. Configure a Signing Team.
          4. Revise as APIs nativas.
          5. Teste em simulador.
          6. Teste em dispositivo físico.
          EOF

      - name: Procurar index.html
        shell: bash
        run: |
          set -e

          INDEX=$(find conversion/ios-project/MulherAmparada/Resources \
            -type f \
            -name 'index.html' \
            | head -1 || true)

          if [ -z "$INDEX" ]; then
            echo "Nenhum index.html encontrado."

            cat >> conversion/report/adaptation-report.md <<'EOF'

          ## ⚠️ WebView

          Nenhum `index.html` foi encontrado automaticamente.

          A página inicial precisa ser configurada manualmente no
          `WebView.swift`.
          EOF
          else
            echo "Página encontrada: $INDEX"
          fi

      - name: Criar estrutura Xcode
        shell: bash
        run: |
          set -e

          cd conversion/ios-project

          if command -v xcodegen >/dev/null 2>&1; then
            echo "XcodeGen encontrado."
          else
            brew install xcodegen
          fi

          cat > project.yml <<'EOF'
          name: MulherAmparada

          options:
            bundleIdPrefix: com.mulheramparada

          targets:
            MulherAmparada:
              type: application
              platform: iOS

              deploymentTarget: "17.0"

              sources:
                - MulherAmparada

              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.mulheramparada.app
                SWIFT_VERSION: "5.0"

              info:
                path: MulherAmparada/Info.plist
                properties:
                  CFBundleDisplayName: Mulher Amparada
                  UILaunchScreen: {}
                  NSLocationWhenInUseUsageDescription: "O aplicativo pode usar sua localização quando necessário."
                  NSFaceIDUsageDescription: "A autenticação biométrica pode ser usada para proteger recursos do aplicativo."
          EOF

          cat > MulherAmparada/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>MulherAmparada</string>

              <key>CFBundleDisplayName</key>
              <string>Mulher Amparada</string>

              <key>UILaunchScreen</key>
              <dict/>

              <key>NSLocationWhenInUseUsageDescription</key>
              <string>O aplicativo pode usar sua localização quando necessário.</string>

              <key>NSFaceIDUsageDescription</key>
              <string>A autenticação biométrica pode proteger recursos do aplicativo.</string>
          </dict>
          </plist>
          EOF

          xcodegen generate

      - name: Validar projeto Xcode
        shell: bash
        run: |
          set -e

          cd conversion/ios-project

          xcodebuild \
            -project MulherAmparada.xcodeproj \
            -scheme MulherAmparada \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Adicionar informações do build
        shell: bash
        run: |
          cat >> conversion/report/adaptation-report.md <<'EOF'

          ## Build

          O projeto iOS foi gerado e validado com `xcodebuild`
          utilizando o SDK do simulador.

          **Observação:** isso não significa que o aplicativo esteja
          pronto para distribuição em dispositivos físicos ou App Store.
          Assinatura Apple e configurações de distribuição ainda podem
          ser necessárias.

          ## Arquivos gerados

          - Projeto Xcode
          - Código Swift
          - Recursos HTML/CSS/JS
          - Recursos multimídia
          - README
          - Relatório de adaptação
          EOF

      - name: Criar ZIP
        shell: bash
        run: |
          set -e

          cd conversion

          zip -r ../projeto-ios.zip ios-project report \
            -x "*/build/*"

      - name: Publicar projeto iOS
        uses: actions/upload-artifact@v4
        with:
          name: projeto-ios
          path: projeto-ios.zip
          retention-days: 30

      - name: Publicar relatório
        uses: actions/upload-artifact@v4
        with:
          name: adaptation-report
          path: conversion/report/adaptation-report.md
          retention-days: 30