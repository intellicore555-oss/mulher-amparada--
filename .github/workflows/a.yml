name: Converter Android para iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  converter:
    runs-on: macos-latest

    steps:

      # ============================================================
      # 1. BAIXAR O REPOSITÓRIO
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. PREPARAR DIRETÓRIOS
      # ============================================================

      - name: Preparar diretórios
        shell: bash
        run: |
          set -e

          rm -rf conversion

          mkdir -p conversion/android
          mkdir -p conversion/ios
          mkdir -p conversion/report

          echo "Diretórios preparados."


      # ============================================================
      # 3. LOCALIZAR ANDROIDMANIFEST
      # ============================================================

      - name: Localizar AndroidManifest
        shell: bash
        run: |
          echo "# AndroidManifest encontrados" \
            > conversion/report/android-manifests.md

          echo "" >> conversion/report/android-manifests.md

          find . \
            -type f \
            -name "AndroidManifest.xml" \
            -not -path "./.git/*" \
            -not -path "./conversion/*" \
            -print \
            | sort \
            >> conversion/report/android-manifests.md

          echo "Manifests encontrados:"
          cat conversion/report/android-manifests.md


      # ============================================================
      # 4. ANALISAR APIs ANDROID
      # ============================================================

      - name: Analisar APIs Android
        shell: bash
        run: |
          REPORT="conversion/report/adaptation-report.md"

          cat > "$REPORT" <<'EOF'
# Relatório de adaptação Android → iOS

Este relatório foi gerado automaticamente.

## APIs Android encontradas

EOF

          SEARCH_ROOT="."

          check_api() {
            NAME="$1"
            PATTERN="$2"

            if grep -RIlE \
              --exclude-dir=.git \
              --exclude-dir=conversion \
              "$PATTERN" \
              "$SEARCH_ROOT" \
              2>/dev/null \
              | head -20 \
              | grep -q .; then

              echo "- ⚠️ **$NAME** encontrada no projeto." \
                >> "$REPORT"

            else

              echo "- ℹ️ **$NAME** não encontrada." \
                >> "$REPORT"

            fi
          }

          check_api "WebView" \
            'WebView|android\.webkit'

          check_api "BiometricPrompt" \
            'BiometricPrompt|androidx\.biometric'

          check_api "Localização" \
            'FusedLocationProvider|LocationManager|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION'

          check_api "Sensores" \
            'SensorManager|TYPE_ACCELEROMETER|SensorEvent'

          check_api "SharedPreferences" \
            'SharedPreferences|EncryptedSharedPreferences'

          check_api "Services" \
            'class .*Service|: Service|ForegroundService'

          check_api "BroadcastReceiver" \
            'BroadcastReceiver'

          check_api "Quick Settings Tile" \
            'TileService'

          check_api "Device Admin" \
            'DevicePolicyManager|DeviceAdminReceiver'

          check_api "Telefone" \
            'CALL_PHONE|ACTION_CALL|ACTION_DIAL|TelephonyManager'

          check_api "SMS" \
            'SEND_SMS|SmsManager'

          check_api "Câmera" \
            'android\.hardware\.camera|CameraManager|android\.camera|CAMERA'

          check_api "Bluetooth" \
            'BluetoothAdapter|BluetoothManager|BLUETOOTH_SCAN|BLUETOOTH_CONNECT'

          check_api "Notificações" \
            'NotificationManager|POST_NOTIFICATIONS'

          check_api "Foreground Service" \
            'FOREGROUND_SERVICE|startForeground'

          check_api "AlarmManager" \
            'AlarmManager'

          check_api "WorkManager" \
            'WorkManager'

          echo "" >> "$REPORT"
          echo "## Observação" >> "$REPORT"
          echo "" >> "$REPORT"
          echo "A presença de uma API Android não significa que ela foi convertida automaticamente." \
            >> "$REPORT"
          echo "Algumas funcionalidades precisam de implementação específica para iOS." \
            >> "$REPORT"


      # ============================================================
      # 5. COPIAR RECURSOS WEB
      #
      # IMPORTANTE:
      # Não copiamos src/main/res para evitar conflitos como
      # vários ic_launcher.png.
      # ============================================================

      - name: Copiar recursos Web
        shell: bash
        run: |
          set -e

          WEB_DIR="conversion/ios/Resources"

          mkdir -p "$WEB_DIR"

          echo "Procurando recursos Web..."

          find . \
            -type f \
            \( \
              -name "*.html" \
              -o -name "*.htm" \
              -o -name "*.css" \
              -o -name "*.js" \
              -o -name "*.json" \
              -o -name "*.svg" \
              -o -name "*.webp" \
              -o -name "*.jpg" \
              -o -name "*.jpeg" \
              -o -name "*.gif" \
              -o -name "*.mp3" \
              -o -name "*.wav" \
              -o -name "*.m4a" \
              \) \
            -not -path "./.git/*" \
            -not -path "./conversion/*" \
            -not -path "*/build/*" \
            -not -path "*/.gradle/*" \
            -not -path "*/src/main/res/*" \
            -print0 \
          | while IFS= read -r -d '' FILE; do

              BASENAME="$(basename "$FILE")"

              case "$BASENAME" in
                ic_launcher.png)
                  continue
                  ;;
              esac

              if [ ! -e "$WEB_DIR/$BASENAME" ]; then
                cp "$FILE" "$WEB_DIR/$BASENAME"
              fi

            done

          echo ""
          echo "Recursos copiados:"

          find "$WEB_DIR" -type f | sort


      # ============================================================
      # 6. PROCURAR INDEX.HTML
      # ============================================================

      - name: Procurar index.html
        shell: bash
        run: |
          WEB_DIR="conversion/ios/Resources"

          if [ -f "$WEB_DIR/index.html" ]; then
            echo "index.html encontrado."
            exit 0
          fi

          FOUND="$(find . \
            -type f \
            -name "index.html" \
            -not -path "./.git/*" \
            -not -path "./conversion/*" \
            -not -path "*/build/*" \
            -print \
            | head -1)"

          if [ -n "$FOUND" ]; then
            cp "$FOUND" "$WEB_DIR/index.html"
            echo "index.html copiado de:"
            echo "$FOUND"
          else
            echo "Nenhum index.html encontrado."
          fi


      # ============================================================
      # 7. GARANTIR INDEX.HTML
      #
      # Mesmo que não exista no Android, criamos uma página mínima
      # para que o projeto iOS possa ser gerado.
      # ============================================================

      - name: Garantir index.html
        shell: bash
        run: |
          if [ ! -f conversion/ios/Resources/index.html ]; then

            cat > conversion/ios/Resources/index.html <<'EOF'
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Mulher Amparada</title>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system,
                 BlinkMacSystemFont,
                 "SF Pro Display",
                 sans-serif;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    text-align: center;
    padding: 32px;
}

h1 {
    margin-bottom: 12px;
}

p {
    opacity: 0.8;
}
</style>
</head>

<body>

<div class="container">
    <h1>Mulher Amparada</h1>
    <p>Projeto iOS gerado automaticamente.</p>
</div>

</body>
</html>
EOF

          fi


      # ============================================================
      # 8. CRIAR WKWEBVIEW
      # ============================================================

      - name: Criar WKWebView
        shell: bash
        run: |
          mkdir -p conversion/ios/MulherAmparada

          cat > conversion/ios/MulherAmparada/WebView.swift <<'EOF'
import SwiftUI
import WebKit

struct WebView: UIViewRepresentable {

    func makeUIView(context: Context) -> WKWebView {

        let configuration = WKWebViewConfiguration()

        let webView = WKWebView(
            frame: .zero,
            configuration: configuration
        )

        webView.allowsBackForwardNavigationGestures = true

        if let url = Bundle.main.url(
            forResource: "index",
            withExtension: "html"
        ) {
            webView.loadFileURL(
                url,
                allowingReadAccessTo: url.deletingLastPathComponent()
            )
        }

        return webView
    }

    func updateUIView(
        _ webView: WKWebView,
        context: Context
    ) {
    }
}
EOF


      # ============================================================
      # 9. CRIAR CONTENTVIEW
      # ============================================================

      - name: Criar ContentView
        shell: bash
        run: |
          cat > conversion/ios/MulherAmparada/ContentView.swift <<'EOF'
import SwiftUI

struct ContentView: View {

    var body: some View {
        WebView()
            .ignoresSafeArea()
    }
}

#Preview {
    ContentView()
}
EOF


      # ============================================================
      # 10. CRIAR APP SWIFTUI
      # ============================================================

      - name: Criar aplicação SwiftUI
        shell: bash
        run: |
          cat > conversion/ios/MulherAmparada/MulherAmparadaApp.swift <<'EOF'
import SwiftUI

@main
struct MulherAmparadaApp: App {

    var body: some Scene {
        WindowGroup {
            ContentView()
        }
    }
}
EOF


      # ============================================================
      # 11. INSTALAR XCODEGEN
      # ============================================================

      - name: Instalar XcodeGen
        shell: bash
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          xcodegen --version


      # ============================================================
      # 12. CRIAR PROJECT.YML
      # ============================================================

      - name: Criar configuração XcodeGen
        shell: bash
        run: |
          cat > conversion/ios/project.yml <<'EOF'
name: MulherAmparada

options:
  bundleIdPrefix: com.mulheramparada
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:

  MulherAmparada:
    type: application
    platform: iOS

    sources:
      - path: MulherAmparada

    resources:
      - path: Resources

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mulheramparada.app
        INFOPLIST_FILE: Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Mulher Amparada
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
EOF


      # ============================================================
      # 13. GERAR PROJETO XCODE
      # ============================================================

      - name: Gerar projeto Xcode
        shell: bash
        run: |
          set -e

          cd conversion/ios

          xcodegen generate

          echo ""
          echo "Projeto Xcode criado."

          find . \
            -maxdepth 2 \
            -type f \
            | sort


      # ============================================================
      # 14. COMPILAR PROJETO IOS
      #
      # O BUILD PODE FALHAR.
      # ISSO NÃO IMPEDE O ZIP.
      # ============================================================

      - name: Compilar projeto iOS
        id: ios_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          if [ ! -d "conversion/ios" ]; then
            echo "ERRO: conversion/ios não existe."
            exit 1
          fi

          if [ ! -f "conversion/ios/MulherAmparada.xcodeproj/project.pbxproj" ]; then
            echo "ERRO: projeto Xcode não encontrado."
            exit 1
          fi

          cd conversion/ios

          echo "Iniciando build do projeto iOS..."

          xcodebuild \
            -project MulherAmparada.xcodeproj \
            -scheme MulherAmparada \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build \
            2>&1 | tee ../../xcodebuild.log

          STATUS=${PIPESTATUS[0]}

          echo "Build terminou com código: $STATUS"

          exit "$STATUS"


      # ============================================================
      # 15. REGISTRAR RESULTADO
      # ============================================================

      - name: Registrar resultado do build
        if: always()
        shell: bash
        run: |
          mkdir -p conversion/report

          REPORT="conversion/report/adaptation-report.md"

          touch "$REPORT"

          echo "" >> "$REPORT"
          echo "## Resultado do Build" >> "$REPORT"
          echo "" >> "$REPORT"

          if [ "${{ steps.ios_build.outcome }}" = "success" ]; then

            echo "✅ O projeto iOS foi compilado com sucesso." \
              >> "$REPORT"

          else

            echo "⚠️ O projeto iOS apresentou erros durante a compilação." \
              >> "$REPORT"

            echo "" >> "$REPORT"

            echo "O ZIP foi gerado mesmo assim para permitir correções manuais." \
              >> "$REPORT"

            echo "" >> "$REPORT"

            if [ -f xcodebuild.log ]; then

              echo "### Erros do Xcode" >> "$REPORT"
              echo "" >> "$REPORT"

              echo '```text' >> "$REPORT"

              grep -Ei \
                'error:|fatal error:|BUILD FAILED|warning:' \
                xcodebuild.log \
                | tail -100 \
                >> "$REPORT" || true

              echo '```' >> "$REPORT"

            fi

          fi


      # ============================================================
      # 16. CRIAR README
      # ============================================================

      - name: Criar README
        if: always()
        shell: bash
        run: |
          mkdir -p conversion/ios

          cat > conversion/ios/README.md <<'EOF'
# Mulher Amparada — versão iOS

Este projeto foi gerado automaticamente a partir do projeto Android.

## Conversão automática

O conversor analisou o projeto Android e tentou reaproveitar:

- HTML
- CSS
- JavaScript
- imagens
- áudio
- recursos Web
- WebView → WKWebView
- estrutura básica → SwiftUI
- APIs Android conhecidas

## Importante

Nem todas as APIs Android possuem conversão automática direta
para iOS.

Consulte:

`../report/adaptation-report.md`

## Build

O GitHub Actions tentou compilar o projeto utilizando o Xcode.

Se o build falhar, o projeto continuará sendo incluído no ZIP.

## Assinatura

Para instalar em um iPhone físico ou distribuir o aplicativo,
é necessária a configuração de assinatura da Apple.

EOF


      # ============================================================
      # 17. COPIAR LOG DO XCODE
      # ============================================================

      - name: Copiar log do Xcode
        if: always()
        shell: bash
        run: |
          mkdir -p conversion/report

          if [ -f xcodebuild.log ]; then
            cp xcodebuild.log \
              conversion/report/xcodebuild.log
          fi


      # ============================================================
      # 18. CRIAR RESUMO DA CONVERSÃO
      # ============================================================

      - name: Criar resumo
        if: always()
        shell: bash
        run: |
          REPORT="conversion/report/adaptation-report.md"

          {
            echo ""
            echo "## Estrutura gerada"
            echo ""
            echo '```text'
            find conversion/ios \
              -maxdepth 3 \
              -type f \
              -not -path "*/build/*" \
              | sort
            echo '```'
          } >> "$REPORT"


      # ============================================================
      # 19. GERAR ZIP MESMO COM ERRO
      # ============================================================

      - name: Gerar ZIP
        if: always()
        shell: bash
        run: |
          set -e

          mkdir -p conversion/ios
          mkdir -p conversion/report

          rm -f projeto-ios.zip

          # Não colocar os arquivos temporários do build
          # dentro do ZIP.
          rm -rf conversion/ios/build

          zip -r \
            projeto-ios.zip \
            conversion/ios \
            conversion/report

          echo ""
          echo "========================================"
          echo "ZIP GERADO"
          echo "========================================"

          ls -lh projeto-ios.zip


      # ============================================================
      # 20. PUBLICAR ZIP
      # ============================================================

      - name: Publicar projeto iOS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projeto-ios
          path: projeto-ios.zip
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 21. PUBLICAR RELATÓRIO
      # ============================================================

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptation-report
          path: conversion/report/
          if-no-files-found: warn
          retention-days: 30