name: Atualizar Android SDK

on:
  schedule:
    # Todos os dias à meia-noite de Brasília (03:00 UTC)
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/atualizar-android-sdk.yml"

  workflow_run:
    workflows:
      - "Compilar o assistente de voz"
      - "Compilar o gerenciador de arquivos"
      - "Deploy Jekyll with GitHub Pages dependencies preinstalled"
      - "Compilar o mulher amparada"
    types:
      - completed

permissions:
  contents: write

jobs:
  atualizar-sdk:
    name: Atualizar Android SDK
    runs-on: ubuntu-latest

    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'cancelled'

    

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Descobrir Android SDK mais recente
        id: sdk
        shell: bash
        run: |
          set -e

          SDK=$(sdkmanager --list 2>/dev/null \
            | grep -E '^  platforms;android-[0-9]+ ' \
            | sed -E 's/.*platforms;android-([0-9]+).*/\1/' \
            | sort -n \
            | tail -1)

          if [ -z "$SDK" ]; then
            echo "Não foi possível descobrir o Android SDK mais recente."
            exit 1
          fi

          echo "compile_sdk=$SDK" >> "$GITHUB_OUTPUT"

          echo "Android SDK mais recente: $SDK"

      - name: Encontrar todos os build.gradle dos módulos app
        id: files
        shell: bash
        run: |
          set -e

          echo "Procurando arquivos build.gradle dentro de pastas app..."

          find . \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -path "*/app/*" \
            -print

          FILES=$(find . \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -path "*/app/*")

          if [ -z "$FILES" ]; then
            echo "Nenhum build.gradle encontrado dentro de uma pasta app."
            exit 1
          fi

          echo "Arquivos encontrados:"
          echo "$FILES"

      - name: Atualizar compileSdk e targetSdk
        env:
          SDK: ${{ steps.sdk.outputs.compile_sdk }}
        shell: bash
        run: |
          set -e

          find . \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -path "*/app/*" \
            -print0 |
          while IFS= read -r -d '' FILE; do

            echo ""
            echo "======================================"
            echo "Atualizando: $FILE"
            echo "SDK: $SDK"
            echo "======================================"

            python3 - "$FILE" "$SDK" <<'PY'
          import re
          import sys

          file = sys.argv[1]
          sdk = sys.argv[2]

          with open(file, "r", encoding="utf-8") as f:
              content = f.read()

          original = content

          content = re.sub(
              r'(\bcompileSdk\s+)\d+',
              rf'\g<1>{sdk}',
              content
          )

          content = re.sub(
              r'(\bcompileSdk\s*=\s*)\d+',
              rf'\g<1>{sdk}',
              content
          )

          content = re.sub(
              r'(\btargetSdk\s+)\d+',
              rf'\g<1>{sdk}',
              content
          )

          content = re.sub(
              r'(\btargetSdk\s*=\s*)\d+',
              rf'\g<1>{sdk}',
              content
          )

          content = re.sub(
              r'(\btargetSdkVersion\s+)\d+',
              rf'\g<1>{sdk}',
              content
          )

          if content == original:
              print("Nenhuma alteração necessária.")
          else:
              with open(file, "w", encoding="utf-8") as f:
                  f.write(content)

              print(f"Atualizado para SDK {sdk}")
          PY

          done

      - name: Verificar alterações
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteração foi necessária."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo "Alterações:"
            git diff
          fi

      - name: Commit e push
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "chore: atualizar Android SDK"

          git push