name: Compilar o assistente de voz


on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Kotlin
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Dar permissão ao Gradle
        working-directory: "Código-fonte do app = Assistente De Voz Do Mulher Amparada"
        run: chmod +x gradlew

      - name: Compilar APK
        working-directory: "Código-fonte do app = Assistente De Voz Do Mulher Amparada"
        run: ./gradlew assembleDebug

      - name: Localizar APK
        id: apk
        working-directory: "Código-fonte do app = Assistente De Voz Do Mulher Amparada"
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK não encontrado."
            exit 1
          fi

          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "APK encontrado: $APK"

      - name: Calcular SHA-256
        id: sha256
        working-directory: "Código-fonte do app = Assistente De Voz Do Mulher Amparada"
        run: |
          SHA256=$(sha256sum "${{ steps.apk.outputs.apk }}" | awk '{print $1}')

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

          echo "SHA-256 real do APK:"
          echo "$SHA256"

      - name: Criar App3.zip
        working-directory: "Código-fonte do app = Assistente De Voz Do Mulher Amparada"
        run: |
          rm -f App3.zip
          zip -j App3.zip "${{ steps.apk.outputs.apk }}"

          echo "App3.zip criado:"
          unzip -l App3.zip

      - name: Enviar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-Kotlin-Debug
          path: "Código-fonte do app = Assistente De Voz Do Mulher Amparada/app/build/outputs/apk/debug/*.apk"

      - name: Enviar App3.zip como artifact
        uses: actions/upload-artifact@v4
        with:
          name: App3
          path: "Código-fonte do app = Assistente De Voz Do Mulher Amparada/App3.zip"

      - name: Fazer commit do App3.zip
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "Código-fonte do app = Assistente De Voz Do Mulher Amparada/App3.zip"

          if git diff --cached --quiet; then
            echo "App3.zip não sofreu alterações."
          else
            git commit -m "Atualizar App3.zip [skip ci]"
            git push origin main
          fi

      - name: Verificar Release existente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="appassistentedevozdomulheramparada"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "ERRO: A Release '$TAG' não existe."
            exit 1
          fi

          echo "Release existente encontrada: $TAG"

      - name: Atualizar Release com APK e App3.zip
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: "Código-fonte do app = Assistente De Voz Do Mulher Amparada"
        run: |
          TAG="appassistentedevozdomulheramparada"

          echo "Enviando APK..."
          gh release upload "$TAG" \
            "${{ steps.apk.outputs.apk }}" \
            --clobber

          echo "Enviando App3.zip..."
          gh release upload "$TAG" \
            "App3.zip" \
            --clobber

          echo "Release atualizada com sucesso."

      - name: Atualizar informações da Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="appassistentedevozdomulheramparada"

          gh release edit "$TAG" \
            --notes "Release atualizada automaticamente pelo GitHub Actions.

SHA-256 informado:
dea5b0715bab7cc7646779b1702e387bb928fc8c0ce93bf5ba8ae059a62eda78

SHA-256 gerado nesta compilação:
${{ steps.sha256.outputs.sha256 }}"

      - name: Mostrar resumo
        run: |
          echo "## Compilação concluída" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Release:** appassistentedevozdomulheramparada" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** main" >> "$GITHUB_STEP_SUMMARY"
          echo "**Arquivo:** App3.zip" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**SHA-256 gerado:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.sha256.outputs.sha256 }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"