name: Compilar o assistente de voz

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Kotlin
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Dar permissão ao Gradle
        working-directory: "Assistente De Voz Do Mulher Amparada"
        run: chmod +x gradlew

      - name: Compilar APK
        working-directory: "Assistente De Voz Do Mulher Amparada"
        run: ./gradlew assembleDebug

      - name: Localizar APK
        id: apk
        working-directory: "Assistente De Voz Do Mulher Amparada"
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK não encontrado."
            exit 1
          fi

          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "APK encontrado: $APK"

      - name: Calcular SHA-256
        working-directory: "Assistente De Voz Do Mulher Amparada"
        run: |
          sha256sum "${{ steps.apk.outputs.apk }}"

      - name: Criar App3.zip
        working-directory: "Assistente De Voz Do Mulher Amparada"
        run: |
          rm -f App3.zip
          zip -j App3.zip "${{ steps.apk.outputs.apk }}"

          echo "App3.zip criado:"
          ls -lh App3.zip

      - name: Enviar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-Kotlin-Debug
          path: "Assistente De Voz Do Mulher Amparada/app/build/outputs/apk/debug/*.apk"

      - name: Enviar App3.zip como artifact
        uses: actions/upload-artifact@v4
        with:
          name: App3
          path: "Assistente De Voz Do Mulher Amparada/App3.zip"

      - name: Fazer commit do App3.zip
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "Assistente De Voz Do Mulher Amparada/App3.zip"

          if git diff --cached --quiet; then
            echo "App3.zip não sofreu alterações."
          else
            git commit -m "Atualizar App3.zip [skip ci]"
            git push origin master
          fi

      - name: Atualizar Release existente
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: "Assistente De Voz Do Mulher Amparada"
        run: |
          TAG="appassistentedevozdomulheramparada"

          echo "Verificando Release existente..."

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "ERRO: A Release '$TAG' não existe."
            exit 1
          fi

          echo "Release encontrada."

          echo "Atualizando APK..."
          gh release upload "$TAG" \
            "${{ steps.apk.outputs.apk }}" \
            --clobber

          echo "Atualizando App3.zip..."
          gh release upload "$TAG" \
            "App3.zip" \
            --clobber

          echo "Release atualizada com sucesso."

      - name: Mostrar SHA-256 no resumo
        working-directory: "Assistente De Voz Do Mulher Amparada"
        run: |
          echo "## SHA-256 do APK" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sha256sum "${{ steps.apk.outputs.apk }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"