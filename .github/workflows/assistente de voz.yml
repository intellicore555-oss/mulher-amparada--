name: Compilar o assistente de voz

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Kotlin
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Dar permissão ao Gradle
        working-directory: "NOME-DA-PASTA"
        run: chmod +x gradlew

      - name: Compilar APK
        working-directory: "NOME-DA-PASTA"
        run: ./gradlew assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Kotlin-Debug
          path: "NOME-DA-PASTA/app/build/outputs/apk/debug/*.apk"