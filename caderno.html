<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#09090d"
>

<title>Diário</title>


<style>

/* =========================================================
   FONTE
========================================================= */

@font-face {

    font-family: "Quicksand";

    src:
        url("font.ttf")
        format("truetype");

    font-display: swap;
}


/* =========================================================
   VARIÁVEIS
========================================================= */

:root {

    --accent:
        #ff8eaf;

    --accent-light:
        #ffc1d2;

    --accent-dark:
        #e96d92;

    --background:
        #08090d;

    --surface:
        rgba(255,255,255,.065);

    --surface-strong:
        rgba(255,255,255,.095);

    --border:
        rgba(255,255,255,.11);

    --border-light:
        rgba(255,255,255,.17);

    --text:
        #ffffff;

    --muted:
        rgba(255,255,255,.48);

    --page:
        #fff8fa;

    --page-text:
        #292127;

    --shadow:
        0 30px 80px
        rgba(0,0,0,.55);
}


/* =========================================================
   RESET
========================================================= */

* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;

    font-family:
        "Quicksand",
        sans-serif;

    -webkit-tap-highlight-color:
        transparent;
}


html {

    width: 100%;

    min-height: 100%;

    scroll-behavior:
        smooth;
}


body {

    width: 100%;

    min-height: 100vh;

    color:
        var(--text);

    overflow-x:
        hidden;

    background:
        black;

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    padding:
        max(14px, env(safe-area-inset-top))
        0
        max(18px, env(safe-area-inset-bottom));

    position:
        relative;
}


/* =========================================================
   FUNDO
========================================================= */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    z-index: -3;

    background:

        radial-gradient(
            circle at 50% -10%,
            rgba(255,142,175,.17),
            transparent 38%
        ),

        radial-gradient(
            circle at 100% 100%,
            rgba(125,90,255,.08),
            transparent 35%
        ),

        linear-gradient(
            145deg,
            #07080b,
            #0b0c11
        );
}


body::after {

    content: "";

    position: fixed;

    inset: 0;

    z-index: -2;

    pointer-events:
        none;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.05),
            rgba(0,0,0,.3)
        );
}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar {

    width: 6px;

    height: 6px;
}


::-webkit-scrollbar-track {

    background:
        transparent;
}


::-webkit-scrollbar-thumb {

    background:
        linear-gradient(
            180deg,
            var(--accent),
            var(--accent-light)
        );

    border-radius:
        999px;

    border:
        1px solid
        rgba(255,255,255,.12);
}


::-webkit-scrollbar-corner {

    background:
        transparent;
}


/* =========================================================
   ANIMAÇÕES
========================================================= */

@keyframes pageIn {

    from {

        opacity: 0;

        transform:
            translateY(18px)
            scale(.985);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


@keyframes floatIn {

    from {

        opacity: 0;

        transform:
            translateY(12px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


@keyframes glow {

    0%,
    100% {

        box-shadow:
            0 0 0
            rgba(255,142,175,0);
    }

    50% {

        box-shadow:
            0 0 40px
            rgba(255,142,175,.10);
    }
}


@keyframes pageOpen {

    from {

        opacity: .4;

        transform:
            rotateY(-8deg)
            scale(.985);
    }

    to {

        opacity: 1;

        transform:
            rotateY(0)
            scale(1);
    }
}


/* =========================================================
   TOPO
========================================================= */

.topo {

    position:
        relative;

    width:
        min(92%, 900px);

    min-height:
        70px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        15px;

    padding:
        10px 12px 10px 20px;

    border:
        1px solid
        var(--border);

    border-radius:
        24px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.085),
            rgba(255,255,255,.035)
        );

    backdrop-filter:
        blur(24px);

    -webkit-backdrop-filter:
        blur(24px);

    box-shadow:
        0 15px 50px
        rgba(0,0,0,.28);

    animation:
        pageIn .55s ease both;

    z-index:
        10;
}


.topo::after {

    content: "";

    position:
        absolute;

    inset:
        0;

    border-radius:
        inherit;

    pointer-events:
        none;

    background:
        linear-gradient(
            120deg,
            rgba(255,255,255,.08),
            transparent 35%
        );
}


/* =========================================================
   IDENTIDADE
========================================================= */

.diario-brand {

    position:
        relative;

    display:
        flex;

    align-items:
        center;

    gap:
        12px;

    min-width:
        0;
}


.diario-icon {

    width:
        43px;

    height:
        43px;

    flex:
        0 0 43px;

    display:
        grid;

    place-items:
        center;

    border-radius:
        14px;

    color:
        #fff;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent-light)
        );

    box-shadow:
        0 8px 25px
        rgba(255,142,175,.22);

    font-size:
        20px;
}


.diario-info {

    min-width:
        0;
}


.diario-title {

    font-size:
        17px;

    font-weight:
        700;

    letter-spacing:
        -.3px;
}


.diario-subtitle {

    margin-top:
        2px;

    color:
        var(--muted);

    font-size:
        9px;

    white-space:
        nowrap;

    overflow:
        hidden;

    text-overflow:
        ellipsis;
}


/* =========================================================
   BOTÃO TOPO
========================================================= */

.voltar {

    position:
        relative;

    width:
        43px;

    height:
        43px;

    flex:
        0 0 43px;

    display:
        grid;

    place-items:
        center;

    border:
        1px solid
        var(--border);

    border-radius:
        14px;

    background:
        rgba(255,255,255,.055);

    cursor:
        pointer;

    transition:
        .2s ease;

    z-index:
        2;
}


.voltar:hover {

    background:
        rgba(255,255,255,.10);

    border-color:
        var(--border-light);
}


.voltar:active {

    transform:
        scale(.9);
}


.voltar img {

    width:
        21px;

    height:
        21px;

    object-fit:
        contain;

    opacity:
        .8;
}


/* =========================================================
   ÁREA DO LIVRO
========================================================= */

.book-wrapper {

    position:
        relative;

    width:
        min(92%, 900px);

    margin-top:
        18px;

    animation:
        floatIn .65s .08s ease both;
}


/* =========================================================
   INDICADOR
========================================================= */

.page-indicator {

    position:
        absolute;

    top:
        -13px;

    left:
        50%;

    transform:
        translateX(-50%);

    z-index:
        50;

    display:
        flex;

    align-items:
        center;

    gap:
        7px;

    padding:
        6px 11px;

    border:
        1px solid
        var(--border);

    border-radius:
        999px;

    color:
        rgba(255,255,255,.68);

    background:
        rgba(12,12,16,.8);

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.25);

    font-size:
        9px;

    pointer-events:
        none;
}


.page-dot {

    width:
        5px;

    height:
        5px;

    border-radius:
        50%;

    background:
        var(--accent);

    box-shadow:
        0 0 8px
        var(--accent);
}


/* =========================================================
   LIVRO
========================================================= */

.book {

    position:
        relative;

    width:
        100%;

    height:
        min(76vh, 700px);

    min-height:
        430px;

    perspective:
        1800px;

    transform-style:
        preserve-3d;

    border-radius:
        30px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.07),
            rgba(255,255,255,.025)
        );

    border:
        1px solid
        rgba(255,255,255,.10);

    box-shadow:
        var(--shadow);

    overflow:
        visible;

    animation:
        glow 5s ease-in-out infinite;
}


/* =========================================================
   EFEITO CAPA
========================================================= */

.book::before {

    content: "";

    position:
        absolute;

    left:
        -7px;

    top:
        7px;

    width:
        100%;

    height:
        100%;

    border-radius:
        30px;

    background:
        linear-gradient(
            145deg,
            #17151a,
            #0c0c10
        );

    border:
        1px solid
        rgba(255,255,255,.06);

    z-index:
        -2;

    box-shadow:
        -6px 8px 30px
        rgba(0,0,0,.35);
}


.book::after {

    content: "";

    position:
        absolute;

    left:
        6px;

    top:
        14px;

    width:
        100%;

    height:
        100%;

    border-radius:
        30px;

    background:
        #0d0d11;

    z-index:
        -3;
}


/* =========================================================
   PÁGINA
========================================================= */

.page {

    position:
        absolute;

    inset:
        0;

    transform-style:
        preserve-3d;

    transform-origin:
        left center;

    transition:
        transform .72s
        cubic-bezier(.2,.72,.2,1);

    border-radius:
        29px;

    animation:
        pageOpen .5s ease both;
}


/* =========================================================
   FACES
========================================================= */

.face {

    position:
        absolute;

    inset:
        0;

    width:
        100%;

    height:
        100%;

    padding:
        35px 32px;

    border-radius:
        inherit;

    overflow:
        hidden;

    backface-visibility:
        hidden;

    -webkit-backface-visibility:
        hidden;
}


/* =========================================================
   FRENTE DA FOLHA
========================================================= */

.front {

    color:
        var(--page-text);

    background:

        linear-gradient(
            90deg,
            rgba(255,255,255,.75),
            transparent 4%,
            transparent 96%,
            rgba(0,0,0,.035)
        ),

        repeating-linear-gradient(
            0deg,
            rgba(80,50,60,.035) 0px,
            rgba(80,50,60,.035) 1px,
            transparent 1px,
            transparent 31px
        ),

        var(--page);

    box-shadow:
        inset
        0 0 60px
        rgba(130,70,90,.06),

        15px 20px 60px
        rgba(0,0,0,.22);
}


/* =========================================================
   VERSO
========================================================= */

.back {

    color:
        #fff;

    background:

        linear-gradient(
            135deg,
            #e86f95,
            #b94870
        );

    transform:
        rotateY(180deg);

    box-shadow:
        inset
        0 0 80px
        rgba(0,0,0,.14);
}


/* =========================================================
   TEXTAREA
========================================================= */

textarea {

    position:
        relative;

    z-index:
        2;

    width:
        100%;

    height:
        100%;

    padding:
        4px;

    border:
        none;

    outline:
        none;

    resize:
        none;

    background:
        transparent;

    color:
        var(--page-text);

    font-size:
        16px;

    font-weight:
        500;

    line-height:
        1.95;

    letter-spacing:
        .15px;

    caret-color:
        var(--accent-dark);
}


textarea::placeholder {

    color:
        rgba(60,35,45,.35);
}


/* =========================================================
   LINHAS DO PAPEL
========================================================= */

.front::before {

    content: "";

    position:
        absolute;

    top:
        0;

    bottom:
        0;

    left:
        52px;

    width:
        1px;

    background:
        rgba(220,100,125,.13);

    pointer-events:
        none;
}


.front::after {

    content: "";

    position:
        absolute;

    inset:
        0;

    background:
        linear-gradient(
            90deg,
            rgba(255,150,180,.08),
            transparent 18%
        );

    pointer-events:
        none;
}


/* =========================================================
   PÁGINA VIRADA
========================================================= */

.page.virada {

    transform:
        rotateY(-180deg);
}


/* =========================================================
   CONTROLES
========================================================= */

.controls {

    width:
        min(92%, 900px);

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    gap:
        8px;

    margin-top:
        14px;

    padding:
        8px;

    border:
        1px solid
        var(--border);

    border-radius:
        20px;

    background:
        rgba(255,255,255,.045);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    animation:
        floatIn .65s .15s ease both;
}


/* =========================================================
   BOTÕES DE CONTROLE
========================================================= */

.control-button {

    width:
        46px;

    height:
        40px;

    display:
        grid;

    place-items:
        center;

    border:
        1px solid
        var(--border);

    border-radius:
        13px;

    color:
        rgba(255,255,255,.75);

    background:
        rgba(255,255,255,.045);

    cursor:
        pointer;

    transition:
        .2s ease;

    font-size:
        17px;
}


.control-button:hover {

    color:
        #fff;

    background:
        rgba(255,255,255,.09);

    border-color:
        var(--border-light);
}


.control-button:active {

    transform:
        scale(.92);
}


.control-button.danger:hover {

    color:
        #ff7182;

    border-color:
        rgba(255,113,130,.25);

    background:
        rgba(255,113,130,.08);
}


.control-spacer {

    flex:
        1;
}


.hint {

    color:
        rgba(255,255,255,.3);

    font-size:
        9px;

    text-align:
        center;

    white-space:
        nowrap;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    body {

        padding-top:
            max(9px, env(safe-area-inset-top));
    }


    .topo {

        width:
            calc(100% - 22px);

        min-height:
            63px;

        padding:
            8px 9px 8px 14px;

        border-radius:
            21px;
    }


    .diario-icon {

        width:
            38px;

        height:
            38px;

        flex-basis:
            38px;

        border-radius:
            12px;

        font-size:
            17px;
    }


    .diario-title {

        font-size:
            15px;
    }


    .diario-subtitle {

        font-size:
            8px;
    }


    .voltar {

        width:
            38px;

        height:
            38px;

        flex-basis:
            38px;

        border-radius:
            12px;
    }


    .book-wrapper {

        width:
            calc(100% - 22px);

        margin-top:
            16px;
    }


    .book {

        height:
            calc(100vh - 185px);

        min-height:
            470px;

        max-height:
            720px;

        border-radius:
            24px;
    }


    .book::before,
    .book::after {

        border-radius:
            24px;
    }


    .page,
    .face {

        border-radius:
            23px;
    }


    .face {

        padding:
            30px 22px;
    }


    .front::before {

        left:
            36px;
    }


    textarea {

        padding:
            2px;

        font-size:
            15px;

        line-height:
            1.9;
    }


    .controls {

        width:
            calc(100% - 22px);

        border-radius:
            18px;
    }


    .hint {

        display:
            none;
    }


    .control-button {

        width:
            44px;

        height:
            38px;
    }
}


/* =========================================================
   TELAS MUITO PEQUENAS
========================================================= */

@media (max-width: 360px) {

    .book {

        min-height:
            420px;
    }


    .face {

        padding:
            27px 18px;
    }


    textarea {

        font-size:
            14px;
    }
}


/* =========================================================
   LANDSCAPE
========================================================= */

@media (
    orientation: landscape
) and (
    max-height: 600px
) {

    .topo {

        min-height:
            58px;
    }


    .book {

        height:
            calc(100vh - 135px);

        min-height:
            300px;
    }


    .controls {

        margin-top:
            9px;
    }
}


/* =========================================================
   ACESSIBILIDADE
========================================================= */

@media (
    prefers-reduced-motion: reduce
) {

    *,
    *::before,
    *::after {

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            .01ms !important;
    }
}

</style>

</head>


<body>


<!-- =======================================================
     TOPO
======================================================= -->

<header class="topo">


    <div class="diario-brand">

        <div class="diario-icon">
            ✦
        </div>


        <div class="diario-info">

            <div class="diario-title">
                Meu Diário
            </div>

            <div class="diario-subtitle">
                Escreva seus pensamentos
            </div>

        </div>

    </div>


    <button
        class="voltar"
        onclick="limparTudo()"
        aria-label="Apagar diário"
    >

        <img
            src="14.svg"
            alt=""
        >

    </button>

</header>


<!-- =======================================================
     LIVRO
======================================================= -->

<div class="book-wrapper">


    <div class="page-indicator">

        <span class="page-dot"></span>

        Página
        <span id="pageNumber">1</span>

    </div>


    <div
        class="book"
        id="book"
    ></div>

</div>


<!-- =======================================================
     CONTROLES
======================================================= -->

<div class="controls">


    <button
        class="control-button"
        onclick="voltarPagina()"
        aria-label="Página anterior"
    >
        ←
    </button>


    <div class="hint">
        Deslize para virar
    </div>


    <div class="control-spacer"></div>


    <button
        class="control-button"
        onclick="virarProxima()"
        aria-label="Próxima página"
    >
        →
    </button>


</div>


<script>

/* =========================================================
   ESTADO
========================================================= */

let dados = [];

let paginas = [];

let atual = 0;

let startX = 0;

let movendo = false;

let arrastandoPagina = false;


/* =========================================================
   ELEMENTOS
========================================================= */

const book =
    document.getElementById(
        "book"
    );


const pageNumber =
    document.getElementById(
        "pageNumber"
    );


/* =========================================================
   CARREGAR DIÁRIO
========================================================= */

try {

    if (
        typeof Cripto !== "undefined" &&
        typeof Cripto.carregar === "function"
    ) {

        const salvo =
            Cripto.carregar(
                "diario"
            );


        if (salvo) {

            if (
                typeof salvo === "string"
            ) {

                try {

                    const parsed =
                        JSON.parse(salvo);


                    if (
                        Array.isArray(parsed)
                    ) {

                        dados =
                            parsed;

                    }

                } catch (error) {

                    dados = [];

                }

            } else if (
                Array.isArray(salvo)
            ) {

                dados =
                    salvo;

            }

        }

    }

} catch (error) {

    console.error(
        "Erro ao carregar diário:",
        error
    );

    dados = [];

}


/* =========================================================
   SALVAR
========================================================= */

function salvar() {

    try {

        if (
            typeof Cripto !== "undefined" &&
            typeof Cripto.salvar === "function"
        ) {

            Cripto.salvar(
                "diario",
                JSON.stringify(
                    dados
                )
            );

        }

    } catch (error) {

        console.error(
            "Erro ao salvar diário:",
            error
        );

    }

}


/* =========================================================
   ATUALIZAR INDICADOR
========================================================= */

function atualizarIndicador() {

    pageNumber.textContent =
        atual + 1;

}


/* =========================================================
   CRIAR PÁGINA
========================================================= */

function criarPagina(
    index
) {

    const page =
        document.createElement(
            "div"
        );


    page.className =
        "page";


    page.style.zIndex =
        100 - index;


    const front =
        document.createElement(
            "div"
        );


    front.className =
        "face front";


    const back =
        document.createElement(
            "div"
        );


    back.className =
        "face back";


    const textarea =
        document.createElement(
            "textarea"
        );


    textarea.value =
        typeof dados[index] === "string"
            ? dados[index]
            : "";


    textarea.placeholder =
        "Comece a escrever aqui...";


    textarea.setAttribute(
        "spellcheck",
        "true"
    );


    textarea.addEventListener(
        "input",
        () => {

            dados[index] =
                textarea.value;

            salvar();


            /*
             * Cria automaticamente
             * a próxima página.
             */

            if (
                textarea.value.length > 220 &&
                index === atual
            ) {

                virarProxima();

            }

        }
    );


    front.appendChild(
        textarea
    );


    page.appendChild(
        front
    );

    page.appendChild(
        back
    );


    book.appendChild(
        page
    );


    paginas[index] =
        page;


    /*
     * Só focar automaticamente
     * na página atual.
     */

    if (
        index === atual
    ) {

        setTimeout(
            () => {

                textarea.focus();

            },
            150
        );

    }


    atualizarIndicador();

}


/* =========================================================
   INICIAR
========================================================= */

criarPagina(0);


/* =========================================================
   PRÓXIMA PÁGINA
========================================================= */

function virarProxima() {

    const pagina =
        paginas[atual];


    if (!pagina) {

        return;

    }


    pagina.classList.add(
        "virada"
    );


    atual++;


    if (
        !paginas[atual]
    ) {

        criarPagina(
            atual
        );

    }


    atualizarIndicador();


    focarPaginaAtual();

}


/* =========================================================
   VOLTAR
========================================================= */

function voltarPagina() {

    if (
        atual <= 0
    ) {

        return;

    }


    atual--;


    const pagina =
        paginas[atual];


    if (pagina) {

        pagina.classList.remove(
            "virada"
        );

    }


    atualizarIndicador();


    focarPaginaAtual();

}


/* =========================================================
   FOCO
========================================================= */

function focarPaginaAtual() {

    setTimeout(
        () => {

            const pagina =
                paginas[atual];


            if (!pagina) {

                return;

            }


            const textarea =
                pagina.querySelector(
                    "textarea"
                );


            if (textarea) {

                textarea.focus();

            }

        },
        350
    );

}


/* =========================================================
   LIMPAR
========================================================= */

function limparTudo() {

    const confirmar =
        confirm(
            "Apagar todas as páginas do diário?"
        );


    if (!confirmar) {

        return;

    }


    try {

        if (
            typeof Cripto !== "undefined" &&
            typeof Cripto.remover === "function"
        ) {

            Cripto.remover(
                "diario"
            );

        }

    } catch (error) {

        console.error(
            "Erro ao limpar:",
            error
        );

    }


    location.reload();

}


/* =========================================================
   TOUCH
========================================================= */

book.addEventListener(
    "touchstart",
    event => {

        if (
            event.touches.length !== 1
        ) {

            return;

        }


        startX =
            event.touches[0].clientX;

        movendo =
            true;

        arrastandoPagina =
            false;

    },
    {
        passive: true
    }
);


book.addEventListener(
    "touchmove",
    event => {

        if (
            !movendo ||
            event.touches.length !== 1
        ) {

            return;

        }


        const atualX =
            event.touches[0].clientX;


        const diff =
            atualX - startX;


        /*
         * Só considera arraste
         * horizontal.
         */

        if (
            Math.abs(diff) < 8
        ) {

            return;

        }


        arrastandoPagina =
            true;


        const pagina =
            paginas[atual];


        if (!pagina) {

            return;

        }


        /*
         * Não permite arrastar
         * para a direita na primeira
         * página.
         */

        if (
            atual === 0 &&
            diff > 0
        ) {

            return;

        }


        /*
         * Arraste suave.
         */

        let rot =
            diff / 1.8;


        rot =
            Math.max(
                Math.min(
                    rot,
                    0
                ),
                -180
            );


        pagina.style.transform =
            `rotateY(${rot}deg)`;

    },
    {
        passive: true
    }
);


book.addEventListener(
    "touchend",
    event => {

        if (!movendo) {

            return;

        }


        movendo =
            false;


        const endX =
            event.changedTouches[0].clientX;


        const diff =
            endX - startX;


        const pagina =
            paginas[atual];


        if (pagina) {

            pagina.style.transform =
                "";

        }


        if (
            !arrastandoPagina
        ) {

            return;

        }


        if (
            diff < -55
        ) {

            virarProxima();

        } else if (
            diff > 55
        ) {

            voltarPagina();

        }

    },
    {
        passive: true
    }
);


/* =========================================================
   TECLADO
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        /*
         * Não interferir enquanto
         * o usuário estiver usando
         * atalhos do sistema.
         */

        if (
            event.key === "ArrowRight"
        ) {

            virarProxima();

        }


        if (
            event.key === "ArrowLeft"
        ) {

            voltarPagina();

        }

    }
);

</script>


<script>

/* =========================================================
   WALLPAPER ANDROID
========================================================= */

window.addEventListener(
    "load",
    () => {

        let wall = "";


        try {

            if (
                typeof Android !== "undefined" &&
                typeof Android.getWallpaperUrl ===
                    "function"
            ) {

                wall =
                    Android.getWallpaperUrl();

            }

        } catch (error) {

            wall = "";

        }


        if (
            wall &&
            typeof wall === "string"
        ) {

            document.body.style.backgroundImage =
                `url("${wall.replace(
                    /"/g,
                    '\\"'
                )}")`;

            document.body.style.backgroundSize =
                "cover";

            document.body.style.backgroundPosition =
                "center";

            document.body.style.backgroundRepeat =
                "no-repeat";

            document.body.style.backgroundAttachment =
                "fixed";

        }

    }
);

</script>
