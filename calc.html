<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Calculadora</title>

<style>

@font-face {
    font-family: "Quicksand";
    src: url("font.ttf") format("truetype");
}


/* =========================
   BASE
========================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {

    margin: 0;

    font-family: "Quicksand", sans-serif;

    color: #fff;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;

    background: #000;

    animation: aparecer .45s ease;

}


@keyframes aparecer {

    from {
        opacity: 0;
        transform: scale(.97);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}


/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar {
    width: 7px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.14);
    border-radius: 999px;
}


/* =========================
   CALCULADORA
========================= */

.calculadora {

    width: min(96vw, 470px);

    padding: 12px;

}


/* =========================
   TELA
========================= */

.tela {

    width: 92%;

    min-height: 180px;

    margin-left: auto;
    margin-right: auto;

    padding: 25px 24px;

    display: flex;

    flex-direction: column;

    justify-content: flex-end;

    align-items: flex-end;

    border-radius: 28px;

    background: #000;

    /* SEM BORDA */
    border: none;

    overflow: hidden;

}


/* =========================
   HISTÓRICO
========================= */

.historico {

    width: 100%;

    min-height: 24px;

    margin-bottom: 10px;

    color: rgba(255,255,255,.38);

    font-size: 16px;

    text-align: right;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


/* =========================
   DISPLAY
========================= */

#display {

    width: 100%;

    color: #fff;

    font-size: clamp(42px, 11vw, 64px);

    font-weight: 600;

    line-height: 1.05;

    text-align: right;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


/* =========================
   BOTÕES
========================= */

.botoes {

    width: 92%;

    margin-left: auto;
    margin-right: auto;

    margin-top: 24px;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 13px;

}


/* =========================
   BOTÃO
========================= */

.botao {

    width: 100%;

    height: 78px;

    border: none;

    border-radius: 200px;

    background: #202020;

    color: #fff;

    font-family: inherit;

    font-size: 23px;

    font-weight: 600;

    cursor: pointer;

    outline: none;

    transition:
        transform .1s ease,
        background .15s ease;
        display: flex;
        justify-content: center;
        align-items: center;
}


.botao:hover {

    background: #292929;

}


.botao:active {

    transform: scale(.91);

}


/* =========================
   FUNÇÕES
========================= */

.funcao {

    background: #2b2b2b;

    color: #eee;

}


.funcao:hover {

    background: #333;

}


/* =========================
   OPERADORES
========================= */

.operador {

    background: #252525;

    color: #fff;

}


.operador:hover {

    background: #2e2e2e;

}


/* =========================
   IGUAL
========================= */

.igual {

    background: #fff;

    color: #111;

}


.igual:hover {

    background: #e9e9e9;

}


/* =========================
   ZERO
========================= */

.zero {

    grid-column: span 1;

}


/* =========================
   ERRO
========================= */

.erro {

    animation: erro .2s ease;

}


@keyframes erro {

    0% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(-5px);
    }

    50% {
        transform: translateX(5px);
    }

    75% {
        transform: translateX(-3px);
    }

    100% {
        transform: translateX(0);
    }

}


/* =========================
   CELULARES ALTOS
========================= */

@media (min-height: 750px) {

    .calculadora {
        width: min(97vw, 490px);
    }

    .tela {

        width: 94%;

        min-height: 210px;

        padding: 30px;

    }

    #display {

        font-size: clamp(
            46px,
            12vw,
            72px
        );

    }

    .botoes {

        width: 94%;

        gap: 15px;

        margin-top: 28px;

    }

    .botao {

        height: 84px;

        font-size: 25px;

    }

}


/* =========================
   TELAS BAIXAS
========================= */

@media (max-height: 650px) {

    .calculadora {

        width: min(96vw, 430px);

        padding: 8px;

    }

    .tela {

        min-height: 120px;

        padding: 18px;

    }

    #display {

        font-size: 40px;

    }

    .historico {

        font-size: 13px;

    }

    .botoes {

        gap: 9px;

        margin-top: 14px;

    }

    .botao {

        height: 58px;

        font-size: 19px;

    }

}


/* =========================
   TELAS MUITO PEQUENAS
========================= */

@media (max-width: 330px) {

    .calculadora {

        width: 100%;

        padding: 7px;

    }

    .tela {

        width: 94%;

        min-height: 115px;

        padding: 16px;

    }

    .botoes {

        width: 94%;

        gap: 8px;

    }

    .botao {

        height: 57px;

        font-size: 18px;

    }

}


/* =========================
   TELAS GRANDES
========================= */

@media (min-width: 600px) {

    .calculadora {

        width: 500px;

    }

    .tela {

        width: 94%;

        min-height: 210px;

    }

    .botoes {

        width: 94%;

        gap: 16px;

    }

    .botao {

        height: 88px;

        font-size: 26px;

    }

}

svg {
width: 30px;
height: 30px;
}

</style>

</head>


<body>


<div class="calculadora">


    <!-- DISPLAY -->

    <div class="tela">

        <div
            class="historico"
            id="historico"
        ></div>

        <div
            id="display"
        >0</div>

    </div>


    <!-- BOTÕES -->

    <div class="botoes">


        <!-- LINHA 1 -->

        <button
            class="botao funcao"
            data-v="C"
        >
            C
        </button>


        <button
            class="botao funcao"
            data-v="back"
        >
            <svg
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
            >
                <path
                    d="M11.142 20C8.91458 20 7.80085 20 6.87114 19.4986C5.94144 18.9971 5.35117 18.0781 4.17061 16.24L3.48981 15.18C2.4966 13.6336 2 12.8604 2 12C2 11.1396 2.4966 10.3664 3.48981 8.82001L4.17061 7.76001C5.35117 5.92191 5.94144 5.00286 6.87114 4.50143C7.80085 4 8.91458 4 11.142 4L13.779 4C17.6544 4 19.5921 4 20.7961 5.17157C22 6.34315 22 8.22876 22 12C22 15.7712 22 17.6569 20.7961 18.8284C19.5921 20 17.6544 20 13.779 20H11.142Z"
                    stroke="white"
                    stroke-width="1.5"
                />
                <path
                    d="M15.5 9.50002L10.5 14.5M10.5 9.5L15.5 14.5"
                    stroke="white"
                    stroke-width="1.5"
                    stroke-linecap="round"
                />
            </svg>
        </button>


        <button
            class="botao funcao"
            data-v="%"
        >
            %
        </button>


        <button
            class="botao operador"
            data-v="/"
        >
            ÷
        </button>


        <!-- LINHA 2 -->

        <button
            class="botao"
            data-v="7"
        >
            7
        </button>


        <button
            class="botao"
            data-v="8"
        >
            8
        </button>


        <button
            class="botao"
            data-v="9"
        >
            9
        </button>


        <button
            class="botao operador"
            data-v="*"
        >
            ×
        </button>


        <!-- LINHA 3 -->

        <button
            class="botao"
            data-v="4"
        >
            4
        </button>


        <button
            class="botao"
            data-v="5"
        >
            5
        </button>


        <button
            class="botao"
            data-v="6"
        >
            6
        </button>


        <button
            class="botao operador"
            data-v="-"
        >
            −
        </button>


        <!-- LINHA 4 -->

        <button
            class="botao"
            data-v="1"
        >
            1
        </button>


        <button
            class="botao"
            data-v="2"
        >
            2
        </button>


        <button
            class="botao"
            data-v="3"
        >
            3
        </button>


        <button
            class="botao operador"
            data-v="+"
        >
            +
        </button>


        <!-- LINHA 5 -->

        <button
            class="botao igual"
            data-v="="
        >
            =
        </button>


        <button
            class="botao"
            data-v="()"
        >
            ()
        </button>


        <button
            class="botao"
            data-v="."
        >
            ,
        </button>


        <button
            class="botao zero"
            data-v="0"
        >
            0
        </button>


    </div>

</div>


<script>

const display =
    document.getElementById("display");

const historico =
    document.getElementById("historico");

let expr = "";

let acabouDeCalcular = false;


/* =========================
   ATUALIZAR
========================= */

function atualizar() {

    display.textContent =
        expr || "0";

}


/* =========================
   ERRO
========================= */

function animarErro() {

    display.classList.remove("erro");

    void display.offsetWidth;

    display.classList.add("erro");

}


/* =========================
   PARENTÊSES
========================= */

function adicionarParenteses() {

    if (acabouDeCalcular) {

        expr = "";

        historico.textContent = "";

        acabouDeCalcular = false;

    }

    const ultimo =
        expr.slice(-1);

    const abertos =
        (expr.match(/\(/g) || []).length;

    const fechados =
        (expr.match(/\)/g) || []).length;


    if (
        !expr ||
        "+-*/(".includes(ultimo)
    ) {

        expr += "(";

        return;

    }


    if (abertos > fechados) {

        if (
            !"+-*/(".includes(ultimo)
        ) {

            expr += ")";

        }

        return;

    }


    expr += "*(";

}


/* =========================
   PORCENTAGEM
========================= */

function prepararPorcentagem(expressao) {

    return expressao.replace(
        /(\d+(?:\.\d+)?)%/g,
        "($1/100)"
    );

}


/* =========================
   CALCULAR
========================= */

function calcular() {

    if (!expr) return;


    try {

        let expressao =
            expr.replace(/,/g, ".");


        const ultimo =
            expressao.slice(-1);


        if (
            "+-*/(".includes(ultimo)
        ) {

            throw new Error();

        }


        const abertos =
            (expressao.match(/\(/g) || []).length;

        const fechados =
            (expressao.match(/\)/g) || []).length;


        if (
            abertos !== fechados
        ) {

            throw new Error();

        }


        if (
            !/^[0-9+\-*/().%\s]+$/.test(
                expressao
            )
        ) {

            throw new Error();

        }


        expressao =
            prepararPorcentagem(
                expressao
            );


        const resultado =
            Function(
                '"use strict"; return (' +
                expressao +
                ')'
            )();


        if (
            !Number.isFinite(resultado)
        ) {

            throw new Error();

        }


        historico.textContent =
            expr + " =";


        expr =
            String(
                Number(
                    resultado.toFixed(10)
                )
            );


        acabouDeCalcular = true;

        atualizar();

    }

    catch {

        display.textContent =
            "Erro";

        animarErro();


        setTimeout(() => {

            expr = "";

            historico.textContent = "";

            acabouDeCalcular = false;

            atualizar();

        }, 700);

    }

}


/* =========================
   BOTÕES
========================= */

document
.querySelectorAll(".botao")
.forEach(btn => {

    btn.addEventListener(
        "click",
        () => {

            const valor =
                btn.dataset.v;


            if (valor === "C") {

                expr = "";

                historico.textContent = "";

                acabouDeCalcular = false;

                atualizar();

                return;

            }


            if (valor === "back") {

                expr =
                    expr.slice(0, -1);

                acabouDeCalcular = false;

                atualizar();

                return;

            }


            if (valor === "=") {

                calcular();

                return;

            }


            if (valor === "()") {

                adicionarParenteses();

                atualizar();

                return;

            }


            if (valor === ".") {

                if (acabouDeCalcular) {

                    expr = "";

                    historico.textContent = "";

                    acabouDeCalcular = false;

                }


                const partes =
                    expr.split(/[+\-*/()]/);

                const atual =
                    partes[partes.length - 1];


                if (!atual.includes(".")) {

                    if (
                        !expr ||
                        "+-*/(".includes(
                            expr.slice(-1)
                        )
                    ) {

                        expr += "0";

                    }

                    expr += ".";

                }


                atualizar();

                return;

            }


            if (
                /^[0-9]$/.test(valor)
            ) {

                if (acabouDeCalcular) {

                    expr = "";

                    historico.textContent = "";

                    acabouDeCalcular = false;

                }


                expr += valor;

                atualizar();

                return;

            }


            if (
                "+-*/".includes(valor)
            ) {

                acabouDeCalcular = false;


                if (!expr) {

                    if (valor === "-") {

                        expr = "-";

                    }

                    atualizar();

                    return;

                }


                const ultimo =
                    expr.slice(-1);


                if (
                    "+-*/".includes(ultimo)
                ) {

                    expr =
                        expr.slice(0, -1);

                }


                expr += valor;

                atualizar();

                return;

            }


            if (valor === "%") {

                if (
                    expr &&
                    /[0-9)]$/.test(expr)
                ) {

                    expr += "%";

                }

                atualizar();

            }

        }
    );

});


/* =========================
   TECLADO
========================= */

document.addEventListener(
    "keydown",
    e => {

        const tecla = e.key;


        if (/^[0-9]$/.test(tecla)) {

            if (acabouDeCalcular) {

                expr = "";

                historico.textContent = "";

                acabouDeCalcular = false;

            }

            expr += tecla;

            atualizar();

            return;

        }


        if (
            "+-*/".includes(tecla)
        ) {

            acabouDeCalcular = false;


            if (!expr) {

                if (tecla === "-") {

                    expr = "-";

                }

                atualizar();

                return;

            }


            const ultimo =
                expr.slice(-1);


            if (
                "+-*/".includes(ultimo)
            ) {

                expr =
                    expr.slice(0, -1);

            }


            expr += tecla;

            atualizar();

            return;

        }


        if (
            tecla === "." ||
            tecla === ","
        ) {

            const partes =
                expr.split(/[+\-*/()]/);

            const atual =
                partes[partes.length - 1];


            if (!atual.includes(".")) {

                if (
                    !expr ||
                    "+-*/(".includes(
                        expr.slice(-1)
                    )
                ) {

                    expr += "0";

                }

                expr += ".";

            }

            atualizar();

            return;

        }


        if (
            tecla === "(" ||
            tecla === ")"
        ) {

            if (tecla === "(") {

                adicionarParenteses();

            }

            else {

                const abertos =
                    (expr.match(/\(/g) || []).length;

                const fechados =
                    (expr.match(/\)/g) || []).length;

                const ultimo =
                    expr.slice(-1);


                if (
                    abertos > fechados &&
                    expr &&
                    !"+-*/(".includes(ultimo)
                ) {

                    expr += ")";

                }

            }

            atualizar();

            return;

        }


        if (tecla === "%") {

            if (
                expr &&
                /[0-9)]$/.test(expr)
            ) {

                expr += "%";

            }

            atualizar();

            return;

        }


        if (
            tecla === "Backspace"
        ) {

            expr =
                expr.slice(0, -1);

            acabouDeCalcular = false;

            atualizar();

            return;

        }


        if (
            tecla === "Enter" ||
            tecla === "="
        ) {

            calcular();

            return;

        }


        if (
            tecla === "Escape"
        ) {

            expr = "";

            historico.textContent = "";

            acabouDeCalcular = false;

            atualizar();

        }

    }
);


/* =========================
   INICIAR
========================= */

atualizar();


/* =========================
   PAPEL DE PAREDE
========================= */

window.addEventListener(
    "load",
    () => {

        let wall = "";

        try {

            wall =
                Android.getWallpaperUrl();

        }

        catch (e) {}


        if (
            wall &&
            wall.length > 0
        ) {

            document.body.style.backgroundImage =
                `url('${wall}')`;

            document.body.style.backgroundSize =
                "cover";

            document.body.style.backgroundPosition =
                "center";

            document.body.style.backgroundRepeat =
                "no-repeat";

            document.body.style.backgroundAttachment =
                "fixed";

        }

    }
);

</script>

</body>

</html>
