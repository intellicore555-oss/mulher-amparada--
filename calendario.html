<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ciclo</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*,
*::before,
*::after{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Quicksand",sans-serif;
}

@font-face{
    font-family:"Quicksand";
    src:url("font.ttf") format("truetype");
}

:root{
    --rosa:#ff7f9f;
    --rosa2:#ff4f78;
    --rosa3:#ffb1c4;

    --fundo:#080808;
    --card:rgba(255,255,255,.075);
    --card2:rgba(255,255,255,.11);

    --texto:#fff;
    --texto2:rgba(255,255,255,.68);
    --texto3:rgba(255,255,255,.42);

    --borda:rgba(255,255,255,.10);

    --verde:#67e8a5;
    --amarelo:#ffd166;
    --vermelho:#ff657d;

    --raio:26px;
}

/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar{
    width:6px;
}

::-webkit-scrollbar-track{
    background:transparent;
}

::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.18);
    border-radius:999px;
}

::-webkit-scrollbar-thumb:hover{
    background:rgba(255,255,255,.30);
}

::-webkit-scrollbar-corner{
    background:transparent;
}

/* =========================================================
   BODY
========================================================= */

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;

    color:var(--texto);

    background: black;

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

body::before{
    content:"";
    position:fixed;
    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.20),
            rgba(0,0,0,.55)
        );

    z-index:-1;
}

/* =========================================================
   APP
========================================================= */

#app{
    width:min(720px,100%);
    margin:auto;

    padding:0 16px 50px;

    opacity:0;
    transform:translateY(18px);

    animation:entrada .7s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes entrada{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================================================
   TOPO
========================================================= */

.topo{
    position:sticky;
    top:0;
    z-index:100;

    display:flex;
    align-items:center;
    justify-content:space-between;

    height:82px;

    margin-bottom:8px;

    background:
        linear-gradient(
            180deg,
            rgba(8,8,8,.92),
            rgba(8,8,8,.70),
            transparent
        );

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
}

.topo-esquerda{
    display:flex;
    flex-direction:column;
    gap:3px;
}

.titulo{
    font-size:25px;
    font-weight:800;
    letter-spacing:-.8px;

    background:
        linear-gradient(
            135deg,
            #fff,
            var(--rosa3)
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.subtitulo{
    font-size:12px;
    color:var(--texto3);
}

/* =========================================================
   AÇÕES
========================================================= */

.acoes{
    display:flex;
    align-items:center;
    gap:9px;
}

.botao,
.apagar{
    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    width:48px;
    height:48px;

    border:0;
    border-radius:999px;

    cursor:pointer;

    color:white;

    transition:
        transform .22s ease,
        box-shadow .22s ease,
        background .22s ease;

    overflow:hidden;
}

.botao::before,
.apagar::before{
    content:"";

    position:absolute;
    inset:0;

    border-radius:inherit;

    background:linear-gradient(
        135deg,
        rgba(255,255,255,.22),
        transparent 55%
    );

    opacity:.8;
}

.botao::after,
.apagar::after{
    content:"";

    position:absolute;
    width:70%;
    height:70%;

    border-radius:50%;

    background:rgba(255,255,255,.08);

    filter:blur(12px);

    transform:translateY(35px);

    transition:transform .3s ease;
}

.botao{
    background:
        linear-gradient(
            135deg,
            var(--rosa),
            var(--rosa2)
        );

    box-shadow:
        0 8px 24px rgba(255,79,120,.28);
}

.botao:hover{
    transform:translateY(-2px) scale(1.04);
}

.botao:hover::after{
    transform:translateY(0);
}

.botao:active,
.apagar:active{
    transform:scale(.94);
}

.mais{
    position:relative;
    z-index:2;

    font-size:30px;
    font-weight:300;
    line-height:1;
}

.apagar{
    background:rgba(255,255,255,.08);
    border:1px solid var(--borda);
}

.apagar:hover{
    background:rgba(255,75,95,.18);
    transform:translateY(-2px);
}

.apagar img{
    position:relative;
    z-index:2;

    width:20px;
    height:20px;

    object-fit:contain;
}

/* =========================================================
   RESUMO
========================================================= */

.resumo{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;

    margin-bottom:18px;
}

.resumo-card{
    position:relative;

    min-height:88px;

    padding:14px;

    border:1px solid var(--borda);
    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.10),
            rgba(255,255,255,.035)
        );

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    overflow:hidden;
}

.resumo-card::before{
    content:"";

    position:absolute;

    width:70px;
    height:70px;

    right:-28px;
    bottom:-30px;

    border-radius:50%;

    background:rgba(255,127,159,.18);

    filter:blur(4px);
}

.resumo-label{
    position:relative;

    color:var(--texto3);
    font-size:11px;
    font-weight:600;
}

.resumo-valor{
    position:relative;

    margin-top:5px;

    font-size:23px;
    font-weight:800;
}

.resumo-detalhe{
    position:relative;

    margin-top:1px;

    color:var(--texto3);
    font-size:9px;
}

/* =========================================================
   BARRA DE CONTROLE
========================================================= */

.controles{
    display:flex;
    gap:9px;

    margin-bottom:15px;
}

.busca{
    flex:1;

    min-width:0;

    height:46px;

    padding:0 16px;

    border:1px solid var(--borda);
    border-radius:999px;

    outline:none;

    color:white;
    background:rgba(255,255,255,.07);

    font-size:13px;

    transition:
        border .2s,
        background .2s;
}

.busca::placeholder{
    color:var(--texto3);
}

.busca:focus{
    border-color:rgba(255,127,159,.5);
    background:rgba(255,255,255,.10);
}

.ordenar{
    height:46px;

    padding:0 15px;

    border:1px solid var(--borda);
    border-radius:999px;

    color:white;
    background:rgba(255,255,255,.07);

    outline:none;

    cursor:pointer;
}

/* =========================================================
   LISTA
========================================================= */

#lista{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.vazio{
    position:relative;

    padding:45px 20px;

    text-align:center;

    border:1px dashed rgba(255,255,255,.13);
    border-radius:28px;

    background:rgba(255,255,255,.035);
}

.vazio-icone{
    font-size:38px;
    margin-bottom:10px;
}

.vazio-titulo{
    font-size:16px;
    font-weight:700;
}

.vazio-texto{
    margin-top:5px;

    color:var(--texto3);
    font-size:12px;
}

/* =========================================================
   CARD
========================================================= */

.card{
    position:relative;

    display:flex;
    align-items:center;
    gap:14px;

    min-height:88px;

    padding:14px 15px;

    border:1px solid var(--borda);
    border-radius:26px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.105),
            rgba(255,255,255,.045)
        );

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    cursor:pointer;

    overflow:hidden;

    animation:cardEntrada .45s ease both;

    transition:
        transform .25s ease,
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s ease;
}

@keyframes cardEntrada{
    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.card::before{
    content:"";

    position:absolute;
    left:0;
    top:12px;
    bottom:12px;

    width:3px;

    border-radius:0 5px 5px 0;

    background:
        linear-gradient(
            180deg,
            var(--rosa),
            var(--rosa2)
        );
}

.card::after{
    content:"";

    position:absolute;

    width:120px;
    height:120px;

    right:-70px;
    top:-70px;

    border-radius:50%;

    background:rgba(255,127,159,.10);

    filter:blur(8px);

    transition:transform .35s ease;
}

.card:hover{
    transform:translateY(-3px);

    border-color:rgba(255,127,159,.28);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.14),
            rgba(255,255,255,.06)
        );

    box-shadow:
        0 14px 35px rgba(0,0,0,.22);
}

.card:hover::after{
    transform:scale(1.6);
}

.humor{
    position:relative;
    z-index:2;

    display:flex;
    align-items:center;
    justify-content:center;

    width:52px;
    height:52px;

    flex-shrink:0;

    border-radius:19px;

    background:
        linear-gradient(
            145deg,
            rgba(255,127,159,.22),
            rgba(255,255,255,.06)
        );

    border:1px solid rgba(255,255,255,.10);

    font-size:26px;
}

.card-info{
    position:relative;
    z-index:2;

    flex:1;

    min-width:0;
}

.card-data{
    font-size:15px;
    font-weight:800;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.card-humor{
    margin-top:3px;

    color:var(--texto3);
    font-size:11px;
}

.card-direita{
    position:relative;
    z-index:2;

    display:flex;
    flex-direction:column;
    align-items:flex-end;

    gap:4px;
}

.dor{
    padding:5px 9px;

    border-radius:999px;

    font-size:10px;
    font-weight:800;

    background:rgba(255,255,255,.08);
}

.seta{
    color:var(--texto3);
    font-size:17px;
}

/* =========================================================
   TELA GRÁFICOS
========================================================= */

#telaGraficos{
    display:none;

    animation:entrada .4s ease both;
}

.graficos-topo{
    display:flex;
    align-items:center;
    gap:12px;

    margin-bottom:15px;
}

#volta{
    width:44px;
    height:44px;

    border:1px solid var(--borda);
    border-radius:999px;

    background:rgba(255,255,255,.08);

    color:white;

    cursor:pointer;

    font-size:20px;

    transition:
        transform .2s,
        background .2s;
}

#volta:hover{
    transform:translateX(-3px);
    background:rgba(255,255,255,.13);
}

.detalhe-titulo{
    font-size:20px;
    font-weight:800;
}

.detalhe-sub{
    margin-top:2px;

    color:var(--texto3);
    font-size:11px;
}

/* =========================================================
   DESTAQUE DA DOR
========================================================= */

.dor-destaque{
    position:relative;

    display:flex;
    align-items:center;
    justify-content:space-between;

    min-height:105px;

    padding:20px;

    margin-bottom:12px;

    border-radius:28px;

    background:
        linear-gradient(
            135deg,
            rgba(255,127,159,.22),
            rgba(255,255,255,.055)
        );

    border:1px solid rgba(255,127,159,.20);

    overflow:hidden;
}

.dor-destaque::before{
    content:"";

    position:absolute;

    width:170px;
    height:170px;

    right:-70px;
    top:-70px;

    border-radius:50%;

    background:rgba(255,127,159,.15);

    filter:blur(8px);
}

.dor-label{
    position:relative;

    color:var(--texto2);
    font-size:12px;
}

.dor-numero{
    position:relative;

    margin-top:3px;

    font-size:40px;
    line-height:1;

    font-weight:900;
}

.dor-max{
    position:relative;

    color:var(--texto3);
    font-size:11px;
}

.dor-barra{
    position:relative;

    width:45%;

    height:9px;

    border-radius:999px;

    background:rgba(255,255,255,.10);

    overflow:hidden;
}

.dor-progresso{
    height:100%;
    width:0;

    border-radius:inherit;

    background:
        linear-gradient(
            90deg,
            var(--verde),
            var(--amarelo),
            var(--vermelho)
        );

    transition:width .8s ease;
}

/* =========================================================
   GRID DE GRÁFICOS
========================================================= */

.graficos-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.grafico-card{
    position:relative;

    min-width:0;

    padding:14px;

    border:1px solid var(--borda);
    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.09),
            rgba(255,255,255,.035)
        );

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    overflow:hidden;
}

.grafico-card::before{
    content:"";

    position:absolute;

    top:-45px;
    right:-45px;

    width:100px;
    height:100px;

    border-radius:50%;

    background:rgba(255,127,159,.08);
}

.grafico-titulo{
    position:relative;

    margin-bottom:8px;

    font-size:12px;
    font-weight:800;
}

.grafico-card canvas{
    position:relative;

    width:100% !important;
    height:220px !important;
}

/* =========================================================
   MODAL
========================================================= */

#modal{
    position:fixed;
    inset:0;

    z-index:1000;

    display:none;
    align-items:flex-end;
    justify-content:center;

    padding:15px;

    background:rgba(0,0,0,.65);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
}

#modal.aberto{
    display:flex;
    animation:modalFundo .25s ease;
}

@keyframes modalFundo{
    from{opacity:0}
    to{opacity:1}
}

.modal-conteudo{
    position:relative;

    width:min(650px,100%);
    max-height:90vh;

    overflow:auto;

    padding:22px;

    border:1px solid rgba(255,255,255,.13);
    border-radius:32px 32px 20px 20px;

    background:
        linear-gradient(
            145deg,
            rgba(35,35,35,.97),
            rgba(12,12,12,.97)
        );

    box-shadow:
        0 -20px 80px rgba(0,0,0,.45);

    animation:modalSubir .35s cubic-bezier(.2,.8,.2,1);
}

@keyframes modalSubir{
    from{
        transform:translateY(60px);
        opacity:0;
    }

    to{
        transform:translateY(0);
        opacity:1;
    }
}

.modal-conteudo::before{
    content:"";

    position:absolute;

    top:9px;
    left:50%;

    width:45px;
    height:4px;

    transform:translateX(-50%);

    border-radius:999px;

    background:rgba(255,255,255,.20);
}

.modal-topo{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:18px;
    padding-top:8px;
}

.modal-titulo{
    font-size:21px;
    font-weight:800;
}

.fechar{
    width:38px;
    height:38px;

    border:0;
    border-radius:50%;

    background:rgba(255,255,255,.08);

    color:white;

    cursor:pointer;

    font-size:19px;
}

/* =========================================================
   FORM
========================================================= */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:11px;
}

.campo{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.campo.full{
    grid-column:1/-1;
}

.campo label{
    color:var(--texto2);
    font-size:11px;
    font-weight:600;
}

.campo input,
.campo select{
    width:100%;
    height:45px;

    padding:0 13px;

    border:1px solid var(--borda);
    border-radius:15px;

    outline:none;

    color:white;
    background:rgba(255,255,255,.07);
}

.campo input:focus,
.campo select:focus{
    border-color:rgba(255,127,159,.5);
}

.checks{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;

    margin-top:5px;
}

.check{
    position:relative;

    display:flex;
    align-items:center;
    gap:9px;

    min-height:43px;

    padding:9px 11px;

    border:1px solid var(--borda);
    border-radius:15px;

    color:var(--texto2);
    background:rgba(255,255,255,.045);

    cursor:pointer;

    font-size:11px;

    transition:.2s;
}

.check:hover{
    background:rgba(255,255,255,.08);
}

.check input{
    accent-color:var(--rosa);
}

.salvar{
    width:100%;
    height:50px;

    margin-top:17px;

    border:0;
    border-radius:999px;

    color:white;

    font-size:14px;
    font-weight:800;

    background:
        linear-gradient(
            135deg,
            var(--rosa),
            var(--rosa2)
        );

    box-shadow:
        0 10px 30px rgba(255,79,120,.25);

    cursor:pointer;

    transition:
        transform .2s,
        box-shadow .2s;
}

.salvar:hover{
    transform:translateY(-2px);
    box-shadow:
        0 14px 35px rgba(255,79,120,.35);
}

/* =========================================================
   RESPONSIVO
========================================================= */

@media(max-width:560px){

    #app{
        padding-left:12px;
        padding-right:12px;
    }

    .topo{
        height:76px;
    }

    .titulo{
        font-size:22px;
    }

    .resumo{
        gap:7px;
    }

    .resumo-card{
        padding:12px;
        min-height:82px;
    }

    .resumo-valor{
        font-size:20px;
    }

    .graficos-grid{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .campo.full{
        grid-column:auto;
    }

    .modal-conteudo{
        padding:18px;
        border-radius:29px 29px 18px 18px;
    }
}

@media(max-width:370px){

    .resumo-detalhe{
        display:none;
    }

    .card{
        padding:12px;
    }

    .humor{
        width:46px;
        height:46px;
    }

    .checks{
        grid-template-columns:1fr;
    }

}

/* =========================================================
   ACESSIBILIDADE
========================================================= */

button,
input,
select{
    -webkit-tap-highlight-color:transparent;
}

button:focus-visible,
input:focus-visible,
select:focus-visible{
    outline:2px solid var(--rosa);
    outline-offset:2px;
}

</style>
</head>

<body>

<div id="app">

    <!-- =====================================================
         TOPO
    ====================================================== -->

    <header class="topo">

        <div class="topo-esquerda">
            <div class="titulo">Ciclo</div>
            <div class="subtitulo">Acompanhe seus registros</div>
        </div>

        <div class="acoes">

            <button
                class="apagar"
                onclick="apagarTudo()"
                aria-label="Apagar todos os registros"
            >
                <img src="14.svg" alt="">
            </button>

            <button
                class="botao"
                onclick="abrirRegistro()"
                aria-label="Novo registro"
            >
                <span class="mais">+</span>
            </button>

        </div>

    </header>


    <!-- =====================================================
         RESUMO
    ====================================================== -->

    <section class="resumo">

        <div class="resumo-card">

            <div class="resumo-label">
                Registros
            </div>

            <div
                class="resumo-valor"
                id="totalRegistros"
            >
                0
            </div>

            <div class="resumo-detalhe">
                registrados
            </div>

        </div>


        <div class="resumo-card">

            <div class="resumo-label">
                Dor média
            </div>

            <div
                class="resumo-valor"
                id="dorMedia"
            >
                0
            </div>

            <div class="resumo-detalhe">
                de 10
            </div>

        </div>


        <div class="resumo-card">

            <div class="resumo-label">
                Último
            </div>

            <div
                class="resumo-valor"
                id="ultimoRegistro"
                style="font-size:15px"
            >
                —
            </div>

            <div class="resumo-detalhe">
                registro
            </div>

        </div>

    </section>


    <!-- =====================================================
         CONTROLES
    ====================================================== -->

    <div class="controles">

        <input
            id="busca"
            class="busca"
            type="search"
            placeholder="Pesquisar registros..."
            oninput="renderizar()"
        >

        <select
            id="ordenar"
            class="ordenar"
            onchange="renderizar()"
        >
            <option value="novo">Mais recentes</option>
            <option value="antigo">Mais antigos</option>
            <option value="dor">Maior dor</option>
        </select>

    </div>


    <!-- =====================================================
         LISTA
    ====================================================== -->

    <main id="lista"></main>


    <!-- =====================================================
         GRÁFICOS
    ====================================================== -->

    <section id="telaGraficos">

        <div class="graficos-topo">

            <button
                id="volta"
                onclick="voltarLista()"
                aria-label="Voltar"
            >
                ‹
            </button>

            <div>
                <div
                    class="detalhe-titulo"
                    id="detalheData"
                >
                    Registro
                </div>

                <div
                    class="detalhe-sub"
                    id="detalheHumor"
                >
                    Detalhes
                </div>
            </div>

        </div>


        <div class="dor-destaque">

            <div>

                <div class="dor-label">
                    Intensidade da dor
                </div>

                <div
                    class="dor-numero"
                    id="dorNumero"
                >
                    0
                </div>

                <div class="dor-max">
                    de 10
                </div>

            </div>

            <div class="dor-barra">
                <div
                    class="dor-progresso"
                    id="dorProgresso"
                ></div>
            </div>

        </div>


        <div class="graficos-grid">

            <div class="grafico-card">

                <div class="grafico-titulo">
                    Consumo
                </div>

                <canvas id="g1"></canvas>

            </div>


            <div class="grafico-card">

                <div class="grafico-titulo">
                    Sintomas
                </div>

                <canvas id="g2"></canvas>

            </div>


            <div class="grafico-card">

                <div class="grafico-titulo">
                    Estado emocional
                </div>

                <canvas id="g3"></canvas>

            </div>


            <div class="grafico-card">

                <div class="grafico-titulo">
                    Corpo
                </div>

                <canvas id="g4"></canvas>

            </div>


            <div
                class="grafico-card"
                style="grid-column:1/-1"
            >

                <div class="grafico-titulo">
                    Rotina
                </div>

                <canvas id="g5"></canvas>

            </div>

        </div>

    </section>

</div>


<!-- =========================================================
     MODAL
========================================================= -->

<div id="modal">

    <div class="modal-conteudo">

        <div class="modal-topo">

            <div class="modal-titulo">
                Novo registro
            </div>

            <button
                class="fechar"
                onclick="fecharModal()"
                aria-label="Fechar"
            >
                ×
            </button>

        </div>


        <form
            id="formRegistro"
            onsubmit="salvarRegistro(event)"
        >

            <div class="form-grid">

                <div class="campo">

                    <label for="data">
                        Data
                    </label>

                    <input
                        id="data"
                        type="date"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="dor">
                        Dor — 0 a 10
                    </label>

                    <input
                        id="dor"
                        type="number"
                        min="0"
                        max="10"
                        value="0"
                        required
                    >

                </div>


                <div class="campo full">

                    <label for="humor">
                        Como você se sentiu?
                    </label>

                    <select id="humor">

                        <option value="feliz">
                            😊 Feliz
                        </option>

                        <option value="neutro">
                            😐 Neutro
                        </option>

                        <option value="desconfortavel">
                            😣 Desconfortável
                        </option>

                        <option value="triste">
                            😢 Triste
                        </option>

                    </select>

                </div>


                <div class="campo full">

                    <label>
                        Hábitos
                    </label>

                    <div class="checks">

                        <label class="check">
                            <input type="checkbox" id="agua">
                            💧 Bebeu água
                        </label>

                        <label class="check">
                            <input type="checkbox" id="cafe">
                            ☕ Tomou café
                        </label>

                        <label class="check">
                            <input type="checkbox" id="chocolate">
                            🍫 Comeu chocolate
                        </label>

                        <label class="check">
                            <input type="checkbox" id="exercicio">
                            🏃 Fez exercício
                        </label>

                        <label class="check">
                            <input type="checkbox" id="sonoRuim">
                            😴 Sono ruim
                        </label>

                        <label class="check">
                            <input type="checkbox" id="apetite">
                            🍽️ Apetite alterado
                        </label>

                    </div>

                </div>


                <div class="campo full">

                    <label>
                        Sintomas
                    </label>

                    <div class="checks">

                        <label class="check">
                            <input type="checkbox" id="cansaco">
                            😮‍💨 Cansaço
                        </label>

                        <label class="check">
                            <input type="checkbox" id="irritacao">
                            😤 Irritação
                        </label>

                        <label class="check">
                            <input type="checkbox" id="ansiedade">
                            🌫️ Ansiedade
                        </label>

                        <label class="check">
                            <input type="checkbox" id="colica">
                            🌀 Cólica
                        </label>

                        <label class="check">
                            <input type="checkbox" id="dorCabeca">
                            🤕 Dor de cabeça
                        </label>

                        <label class="check">
                            <input type="checkbox" id="inchaco">
                            🫧 Inchaço
                        </label>

                        <label class="check">
                            <input type="checkbox" id="acne">
                            ✨ Acne
                        </label>

                        <label class="check">
                            <input type="checkbox" id="nausea">
                            🤢 Náusea
                        </label>

                        <label class="check">
                            <input type="checkbox" id="tontura">
                            🌀 Tontura
                        </label>

                        <label class="check">
                            <input type="checkbox" id="energiaBaixa">
                            🔋 Energia baixa
                        </label>

                    </div>

                </div>


                <div class="campo full">

                    <label>
                        Emocional e concentração
                    </label>

                    <div class="checks">

                        <label class="check">
                            <input type="checkbox" id="estresse">
                            ⚡ Estresse
                        </label>

                        <label class="check">
                            <input type="checkbox" id="tristeza">
                            🌧️ Tristeza
                        </label>

                        <label class="check">
                            <input type="checkbox" id="felicidade">
                            ☀️ Felicidade
                        </label>

                        <label class="check">
                            <input type="checkbox" id="sensibilidade">
                            💗 Sensibilidade
                        </label>

                        <label class="check">
                            <input type="checkbox" id="concentracao">
                            🧠 Concentração ruim
                        </label>

                        <label class="check">
                            <input type="checkbox" id="libido">
                            💫 Libido alterada
                        </label>

                    </div>

                </div>

            </div>


            <button
                class="salvar"
                type="submit"
            >
                Salvar registro
            </button>

        </form>

    </div>

</div>


<script>

/* =========================================================
   DADOS
========================================================= */

let charts = [];


function getDados(){

    try{

        const dados = Cripto.carregar("ciclo");

        if(!dados){
            return [];
        }

        const parsed = JSON.parse(dados);

        return Array.isArray(parsed)
            ? parsed
            : [];

    }catch(e){

        console.error(e);

        return [];

    }

}


function salvarDados(dados){

    Cripto.salvar(
        "ciclo",
        JSON.stringify(dados)
    );

}


/* =========================================================
   UTILITÁRIOS
========================================================= */

function valor(id){

    return document.getElementById(id).checked;

}


function formatarData(data){

    if(!data){
        return "—";
    }

    const partes = data.split("-");

    if(partes.length !== 3){
        return data;
    }

    return `${partes[2]}/${partes[1]}/${partes[0]}`;

}


function emojiHumor(humor){

    const emojis = {

        feliz:"😊",
        neutro:"😐",
        triste:"😢",
        desconfortavel:"😣"

    };

    return emojis[humor] || "😐";

}


function nomeHumor(humor){

    const nomes = {

        feliz:"Feliz",
        neutro:"Neutro",
        triste:"Triste",
        desconfortavel:"Desconfortável"

    };

    return nomes[humor] || "Neutro";

}


/* =========================================================
   MODAL
========================================================= */

function abrirRegistro(){

    const hoje = new Date();

    const ano = hoje.getFullYear();
    const mes = String(hoje.getMonth()+1).padStart(2,"0");
    const dia = String(hoje.getDate()).padStart(2,"0");

    document.getElementById("data").value =
        `${ano}-${mes}-${dia}`;

    document.getElementById("modal")
        .classList.add("aberto");

}


function fecharModal(){

    document.getElementById("modal")
        .classList.remove("aberto");

}


document.getElementById("modal")
    .addEventListener("click",function(e){

        if(e.target === this){
            fecharModal();
        }

    });


/* =========================================================
   SALVAR
========================================================= */

function salvarRegistro(event){

    event.preventDefault();

    const registro = {

        data:document.getElementById("data").value,

        dor:Number(
            document.getElementById("dor").value
        ),

        humorTexto:
            document.getElementById("humor").value,

        agua:valor("agua"),
        cafe:valor("cafe"),
        chocolate:valor("chocolate"),

        cansaco:valor("cansaco"),
        irritacao:valor("irritacao"),
        ansiedade:valor("ansiedade"),
        colica:valor("colica"),
        dorCabeca:valor("dorCabeca"),
        inchaco:valor("inchaco"),
        acne:valor("acne"),
        sonoRuim:valor("sonoRuim"),
        apetite:valor("apetite"),
        exercicio:valor("exercicio"),
        libido:valor("libido"),
        concentracao:valor("concentracao"),
        estresse:valor("estresse"),
        tristeza:valor("tristeza"),
        felicidade:valor("felicidade"),
        sensibilidade:valor("sensibilidade"),
        nausea:valor("nausea"),
        tontura:valor("tontura"),
        energiaBaixa:valor("energiaBaixa")

    };


    const dados = getDados();

    dados.push(registro);

    salvarDados(dados);

    document.getElementById("formRegistro").reset();

    fecharModal();

    renderizar();

}


/* =========================================================
   APAGAR
========================================================= */

function apagarTudo(){

    const dados = getDados();

    if(dados.length === 0){
        return;
    }

    if(!confirm(
        "Apagar todos os registros?\n\nEssa ação não pode ser desfeita."
    )){
        return;
    }

    Cripto.remover("ciclo");

    renderizar();

}


/* =========================================================
   RESUMO
========================================================= */

function atualizarResumo(dados){

    document.getElementById("totalRegistros")
        .textContent = dados.length;


    if(dados.length === 0){

        document.getElementById("dorMedia")
            .textContent = "0";

        document.getElementById("ultimoRegistro")
            .textContent = "—";

        return;

    }


    const media =
        dados.reduce(
            (total,d) =>
                total + (Number(d.dor) || 0),
            0
        ) / dados.length;


    document.getElementById("dorMedia")
        .textContent = media.toFixed(1);


    const ordenados = [...dados]
        .sort((a,b) =>
            String(b.data)
            .localeCompare(String(a.data))
        );


    document.getElementById("ultimoRegistro")
        .textContent =
            formatarData(ordenados[0].data);

}


/* =========================================================
   LISTA
========================================================= */

function renderizar(){

    const container =
        document.getElementById("lista");

    let dados = getDados();

    atualizarResumo(dados);


    const busca =
        document.getElementById("busca")
            ?.value
            ?.toLowerCase()
            .trim() || "";


    const ordem =
        document.getElementById("ordenar")
            ?.value || "novo";


    if(busca){

        dados = dados.filter(d => {

            const texto = [
                d.data,
                d.humorTexto,
                d.dor
            ]
            .join(" ")
            .toLowerCase();

            return texto.includes(busca);

        });

    }


    dados.sort((a,b) => {

        if(ordem === "dor"){
            return Number(b.dor) - Number(a.dor);
        }

        const comparacao =
            String(b.data)
            .localeCompare(String(a.data));

        return ordem === "novo"
            ? comparacao
            : -comparacao;

    });


    container.innerHTML = "";


    if(dados.length === 0){

        container.innerHTML = `

            <div class="vazio">

                <div class="vazio-icone">
                    ${busca ? "🔎" : "🌸"}
                </div>

                <div class="vazio-titulo">
                    ${busca
                        ? "Nenhum resultado"
                        : "Nenhum registro ainda"}
                </div>

                <div class="vazio-texto">
                    ${busca
                        ? "Tente pesquisar por outra data ou informação."
                        : "Toque no botão + para criar seu primeiro registro."}
                </div>

            </div>

        `;

        return;

    }


    dados.forEach((d,index) => {

        const card =
            document.createElement("article");

        card.className = "card";

        card.style.animationDelay =
            `${index * .035}s`;


        const dor = Number(d.dor) || 0;


        card.innerHTML = `

            <div class="humor">
                ${emojiHumor(d.humorTexto)}
            </div>

            <div class="card-info">

                <div class="card-data">
                    ${formatarData(d.data)}
                </div>

                <div class="card-humor">
                    ${nomeHumor(d.humorTexto)}
                </div>

            </div>

            <div class="card-direita">

                <div class="dor">
                    Dor ${dor}/10
                </div>

                <div class="seta">
                    ›
                </div>

            </div>

        `;


        card.onclick = () =>
            abrirGraficos(d);


        container.appendChild(card);

    });

}


/* =========================================================
   CHART CONFIG
========================================================= */

function destruir(){

    charts.forEach(chart => {

        try{
            chart.destroy();
        }catch(e){}

    });

    charts = [];

}


const chartBase = {

    responsive:true,

    maintainAspectRatio:false,

    plugins:{

        legend:{
            labels:{
                color:"rgba(255,255,255,.65)",
                font:{
                    family:"Quicksand",
                    size:10
                },

                boxWidth:10,
                boxHeight:10
            }
        }

    }

};


function bool(v){
    return v ? 1 : 0;
}


/* =========================================================
   GRÁFICOS
========================================================= */

function abrirGraficos(d){

    document.getElementById("lista")
        .style.display = "none";

    document.querySelector(".controles")
        .style.display = "none";

    document.querySelector(".resumo")
        .style.display = "none";

    document.querySelector(".topo")
        .style.display = "none";


    document.getElementById("telaGraficos")
        .style.display = "block";


    document.getElementById("detalheData")
        .textContent = formatarData(d.data);


    document.getElementById("detalheHumor")
        .textContent =
            `${emojiHumor(d.humorTexto)} ${nomeHumor(d.humorTexto)}`;


    const dor = Number(d.dor) || 0;


    document.getElementById("dorNumero")
        .textContent = dor;


    document.getElementById("dorProgresso")
        .style.width =
            `${Math.max(0,Math.min(10,dor))*10}%`;


    destruir();


    /* =====================================================
       CONSUMO
    ====================================================== */

    charts.push(

        new Chart(
            document.getElementById("g1"),
            {
                type:"doughnut",

                data:{
                    labels:[
                        "Água",
                        "Café",
                        "Chocolate"
                    ],

                    datasets:[{
                        data:[
                            bool(d.agua),
                            bool(d.cafe),
                            bool(d.chocolate)
                        ]
                    }]
                },

                options:{
                    ...chartBase,

                    cutout:"65%",

                    plugins:{
                        legend:{
                            position:"bottom",
                            labels:{
                                color:"rgba(255,255,255,.65)",
                                font:{
                                    family:"Quicksand",
                                    size:9
                                }
                            }
                        }
                    }
                }
            }
        )

    );


    /* =====================================================
       SINTOMAS
    ====================================================== */

    charts.push(

        new Chart(
            document.getElementById("g2"),
            {
                type:"bar",

                data:{
                    labels:[
                        "Cólica",
                        "Cabeça",
                        "Inchaço",
                        "Náusea",
                        "Tontura"
                    ],

                    datasets:[{
                        data:[
                            bool(d.colica),
                            bool(d.dorCabeca),
                            bool(d.inchaco),
                            bool(d.nausea),
                            bool(d.tontura)
                        ],

                        borderRadius:8,
                        borderSkipped:false
                    }]
                },

                options:{
                    ...chartBase,

                    scales:{

                        y:{
                            beginAtZero:true,
                            max:1,
                            ticks:{
                                display:false
                            },
                            grid:{
                                display:false
                            }
                        },

                        x:{
                            ticks:{
                                color:"rgba(255,255,255,.5)",
                                font:{
                                    family:"Quicksand",
                                    size:8
                                }
                            },

                            grid:{
                                display:false
                            }
                        }

                    },

                    plugins:{
                        legend:{
                            display:false
                        }
                    }
                }
            }
        )

    );


    /* =====================================================
       EMOCIONAL
    ====================================================== */

    charts.push(

        new Chart(
            document.getElementById("g3"),
            {
                type:"radar",

                data:{
                    labels:[
                        "Ansiedade",
                        "Estresse",
                        "Tristeza",
                        "Felicidade",
                        "Sensibilidade"
                    ],

                    datasets:[{
                        data:[
                            bool(d.ansiedade),
                            bool(d.estresse),
                            bool(d.tristeza),
                            bool(d.felicidade),
                            bool(d.sensibilidade)
                        ],

                        borderWidth:2,
                        pointRadius:3
                    }]
                },

                options:{
                    ...chartBase,

                    scales:{
                        r:{
                            min:0,
                            max:1,

                            ticks:{
                                display:false
                            },

                            grid:{
                                color:"rgba(255,255,255,.08)"
                            },

                            angleLines:{
                                color:"rgba(255,255,255,.08)"
                            },

                            pointLabels:{
                                color:"rgba(255,255,255,.55)",
                                font:{
                                    family:"Quicksand",
                                    size:8
                                }
                            }
                        }
                    },

                    plugins:{
                        legend:{
                            display:false
                        }
                    }
                }
            }
        )

    );


    /* =====================================================
       CORPO
    ====================================================== */

    charts.push(

        new Chart(
            document.getElementById("g4"),
            {
                type:"polarArea",

                data:{
                    labels:[
                        "Acne",
                        "Cansaço",
                        "Energia baixa",
                        "Apetite",
                        "Sono ruim"
                    ],

                    datasets:[{
                        data:[
                            bool(d.acne),
                            bool(d.cansaco),
                            bool(d.energiaBaixa),
                            bool(d.apetite),
                            bool(d.sonoRuim)
                        ]
                    }]
                },

                options:{
                    ...chartBase,

                    scales:{
                        r:{
                            ticks:{
                                display:false
                            },

                            grid:{
                                color:"rgba(255,255,255,.08)"
                            }
                        }
                    },

                    plugins:{
                        legend:{
                            position:"bottom"
                        }
                    }
                }
            }
        )

    );


    /* =====================================================
       ROTINA
    ====================================================== */

    charts.push(

        new Chart(
            document.getElementById("g5"),
            {
                type:"line",

                data:{
                    labels:[
                        "Exercício",
                        "Concentração",
                        "Libido",
                        "Irritação",
                        "Dor"
                    ],

                    datasets:[{
                        data:[
                            bool(d.exercicio),
                            bool(d.concentracao),
                            bool(d.libido),
                            bool(d.irritacao),
                            dor / 10
                        ],

                        tension:.4,

                        borderWidth:3,

                        pointRadius:4,

                        fill:true
                    }]
                },

                options:{
                    ...chartBase,

                    scales:{

                        y:{
                            min:0,
                            max:1,

                            ticks:{
                                display:false
                            },

                            grid:{
                                color:"rgba(255,255,255,.06)"
                            }
                        },

                        x:{
                            ticks:{
                                color:"rgba(255,255,255,.5)",
                                font:{
                                    family:"Quicksand",
                                    size:9
                                }
                            },

                            grid:{
                                display:false
                            }
                        }

                    },

                    plugins:{
                        legend:{
                            display:false
                        }
                    }
                }
            }
        )

    );

}


/* =========================================================
   VOLTAR
========================================================= */

function voltarLista(){

    destruir();

    document.getElementById("lista")
        .style.display = "flex";

    document.querySelector(".controles")
        .style.display = "flex";

    document.querySelector(".resumo")
        .style.display = "grid";

    document.querySelector(".topo")
        .style.display = "flex";

    document.getElementById("telaGraficos")
        .style.display = "none";

}


/* =========================================================
   ANDROID / WALLPAPER
========================================================= */

window.addEventListener("load",()=>{

    let wall = "";

    try{

        wall = Android.getWallpaperUrl();

    }catch(e){

        console.log(
            "Wallpaper Android indisponível."
        );

    }


    if(wall && wall.length > 0){

        document.body.style.backgroundImage =
            `
            linear-gradient(
                180deg,
                rgba(0,0,0,.35),
                rgba(0,0,0,.75)
            ),
            url('${wall}')
            `;

    }

});


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

renderizar();

</script>

</body>
</html>
