<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#070709"
>

<title>Planner</title>


<style>

/* =========================================================
   FONTE
========================================================= */

@font-face {

    font-family: "Quicksand";

    src:
        url("font.ttf")
        format("truetype");

    font-display: swap;
}


/* =========================================================
   VARIÁVEIS
========================================================= */

:root {

    --accent: #ff9db7;

    --accent-soft:
        rgba(255,157,183,.14);

    --accent-border:
        rgba(255,157,183,.24);

    --bg: #060608;

    --card:
        rgba(255,255,255,.055);

    --card-hover:
        rgba(255,255,255,.085);

    --border:
        rgba(255,255,255,.085);

    --text:
        rgba(255,255,255,.95);

    --muted:
        rgba(255,255,255,.45);

    --danger:
        #ff6878;

    --success:
        #6dffad;

    --warning:
        #ffd76a;
}


/* =========================================================
   RESET
========================================================= */

* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

    font-family:
        Quicksand,
        sans-serif;

    -webkit-tap-highlight-color:
        transparent;
}

html,
body {

    width: 100%;

    min-height: 100%;

    background: var(--bg);

    color: var(--text);
}

body {

    overflow-x: hidden;

    user-select: none;

    -webkit-user-select: none;

    padding-bottom:
        env(safe-area-inset-bottom);
}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar {

    width: 5px;

    height: 5px;
}

::-webkit-scrollbar-track {

    background: transparent;
}

::-webkit-scrollbar-thumb {

    background:
        rgba(255,255,255,.13);

    border-radius: 999px;
}


/* =========================================================
   FUNDO
========================================================= */

.fundo {

    position: fixed;

    inset: 0;

    z-index: -10;

    background:

        radial-gradient(
            circle at 50% -15%,
            var(--accent-soft),
            transparent 38%
        ),

        radial-gradient(
            circle at 100% 100%,
            rgba(255,255,255,.025),
            transparent 40%
        ),

        #050507;

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    transform: scale(1.03);
}


.fundo::after {

    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.18),
            rgba(0,0,0,.5)
        );
}


/* =========================================================
   ANIMAÇÕES
========================================================= */

@keyframes pageIn {

    from {

        opacity: 0;

        transform:
            translateY(12px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


@keyframes slideIn {

    from {

        opacity: 0;

        transform:
            translateY(10px)
            scale(.98);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


@keyframes menuIn {

    from {

        opacity: 0;

        transform:
            translateX(-18px);
    }

    to {

        opacity: 1;

        transform:
            translateX(0);
    }
}


@keyframes spin {

    to {

        transform:
            rotate(360deg);
    }
}


@keyframes pulse {

    0%,
    100% {

        transform:
            scale(1);

        opacity: 1;
    }

    50% {

        transform:
            scale(.8);

        opacity: .5;
    }
}


/* =========================================================
   TOPO
========================================================= */

.header {

    position: sticky;

    top: 0;

    z-index: 1000;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 14px;

    width: 100%;

    max-width: 900px;

    margin: 0 auto;

    padding:
        max(14px, env(safe-area-inset-top))
        18px
        14px;

    background:
        linear-gradient(
            to bottom,
            rgba(5,5,7,.9),
            rgba(5,5,7,.55),
            transparent
        );

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);
}


.brand {

    display: flex;

    align-items: center;

    gap: 11px;

    min-width: 0;
}


.brand-icon {

    width: 43px;

    height: 43px;

    flex: 0 0 43px;

    display: grid;

    place-items: center;

    border-radius: 15px;

    color: var(--accent);

    background:
        var(--accent-soft);

    border:
        1px solid var(--accent-border);

    box-shadow:
        0 0 25px
        rgba(255,157,183,.08);

    font-size: 20px;
}


.brand-text {

    min-width: 0;
}


.brand-title {

    font-size: 20px;

    font-weight: 700;

    line-height: 1;
}


.brand-subtitle {

    margin-top: 4px;

    font-size: 10px;

    color: var(--muted);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.header-actions {

    display: flex;

    gap: 7px;
}


.icon-button {

    width: 42px;

    height: 42px;

    display: grid;

    place-items: center;

    border: 1px solid var(--border);

    border-radius: 14px;

    color: white;

    background:
        rgba(255,255,255,.055);

    font-size: 18px;

    cursor: pointer;

    transition:
        transform .18s ease,
        background .18s ease;
}


.icon-button:active {

    transform:
        scale(.9);
}


.icon-button:hover {

    background:
        rgba(255,255,255,.10);
}


/* =========================================================
   CONTEÚDO
========================================================= */

.container {

    width: 100%;

    max-width: 900px;

    margin: 0 auto;

    padding:
        8px
        18px
        120px;

    animation:
        pageIn .55s ease both;
}


/* =========================================================
   RESUMO
========================================================= */

.stats {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 9px;

    margin-bottom: 15px;
}


.stat {

    min-width: 0;

    padding: 14px;

    border-radius: 18px;

    background:
        var(--card);

    border:
        1px solid var(--border);

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.16);
}


.stat-number {

    font-size: 20px;

    font-weight: 700;

    color: var(--accent);
}


.stat-label {

    margin-top: 2px;

    font-size: 10px;

    color: var(--muted);
}


/* =========================================================
   BARRA DE PESQUISA
========================================================= */

.search {

    display: flex;

    align-items: center;

    gap: 10px;

    height: 52px;

    margin-bottom: 10px;

    padding:
        0 15px;

    border-radius: 17px;

    background:
        rgba(255,255,255,.055);

    border:
        1px solid var(--border);

    transition:
        border .2s ease,
        background .2s ease;
}


.search:focus-within {

    background:
        rgba(255,255,255,.075);

    border-color:
        var(--accent-border);
}


.search svg {

    width: 20px;

    height: 20px;

    color: var(--muted);

    flex: 0 0 auto;
}


.search input {

    width: 100%;

    min-width: 0;

    border: 0;

    outline: 0;

    background: transparent;

    color: white;

    font-size: 14px;
}


.search input::placeholder {

    color:
        rgba(255,255,255,.35);
}


/* =========================================================
   FILTROS
========================================================= */

.filters {

    display: flex;

    gap: 7px;

    overflow-x: auto;

    padding:
        2px
        0
        8px;

    scrollbar-width: none;
}


.filters::-webkit-scrollbar {

    display: none;
}


.filter {

    flex: 0 0 auto;

    padding:
        8px
        13px;

    border:
        1px solid var(--border);

    border-radius: 999px;

    color:
        rgba(255,255,255,.55);

    background:
        rgba(255,255,255,.04);

    font-size: 11px;

    cursor: pointer;

    transition:
        .18s ease;
}


.filter.active {

    color: #000;

    background:
        var(--accent);

    border-color:
        var(--accent);
}


/* =========================================================
   ORDENAR
========================================================= */

.toolbar {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    margin:
        5px
        0
        10px;
}


.result-count {

    color: var(--muted);

    font-size: 10px;
}


.sort {

    width: auto;

    margin: 0;

    padding:
        7px
        10px;

    border:
        1px solid var(--border);

    border-radius: 10px;

    color: white;

    background:
        rgba(255,255,255,.05);

    outline: none;

    font-size: 10px;
}


/* =========================================================
   LISTA
========================================================= */

#list {

    display: flex;

    flex-direction: column;

    gap: 8px;
}


/* =========================================================
   TAREFA
========================================================= */

.task {

    position: relative;

    display: flex;

    align-items: center;

    gap: 12px;

    width: 100%;

    min-height: 70px;

    padding:
        11px
        12px;

    border:
        1px solid var(--border);

    border-radius: 18px;

    background:
        var(--card);

    transition:
        transform .18s ease,
        background .18s ease,
        opacity .18s ease;

    animation:
        slideIn .25s ease both;
}


.task:hover {

    background:
        var(--card-hover);

    transform:
        translateY(-1px);
}


.task.high {

    border-left:
        3px solid #ff5d68;
}


.task.medium {

    border-left:
        3px solid #ffd75c;
}


.task.low {

    border-left:
        3px solid #6cff9f;
}


.task.done {

    opacity: .46;
}


.task.done .task-text {

    text-decoration:
        line-through;
}


/* =========================================================
   CHECK
========================================================= */

.check {

    width: 34px;

    height: 34px;

    flex: 0 0 34px;

    display: grid;

    place-items: center;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius: 12px;

    color: transparent;

    background:
        rgba(255,255,255,.04);

    cursor: pointer;

    transition:
        .2s ease;
}


.task.done .check {

    color: #000;

    background:
        var(--success);

    border-color:
        var(--success);
}


/* =========================================================
   TEXTO
========================================================= */

.task-content {

    min-width: 0;

    flex: 1;
}


.task-text {

    overflow: hidden;

    text-overflow: ellipsis;

    line-height: 1.3;

    font-size: 13px;

    font-weight: 600;

    word-break: break-word;
}


.task-meta {

    display: flex;

    align-items: center;

    gap: 6px;

    margin-top: 5px;

    color: var(--muted);

    font-size: 9px;
}


.priority-dot {

    width: 6px;

    height: 6px;

    border-radius: 50%;

    background: currentColor;
}


.task.high .priority-dot {

    color: #ff5d68;
}


.task.medium .priority-dot {

    color: #ffd75c;
}


.task.low .priority-dot {

    color: #6cff9f;
}


/* =========================================================
   AÇÕES DA TAREFA
========================================================= */

.task-actions {

    display: flex;

    gap: 5px;

    flex: 0 0 auto;
}


.task-button {

    width: 32px;

    height: 32px;

    display: grid;

    place-items: center;

    border:
        1px solid var(--border);

    border-radius: 10px;

    color:
        rgba(255,255,255,.55);

    background:
        rgba(255,255,255,.035);

    cursor: pointer;

    transition:
        .18s ease;
}


.task-button:hover {

    color: white;

    background:
        rgba(255,255,255,.09);
}


.task-button.delete:hover {

    color: var(--danger);

    border-color:
        rgba(255,104,120,.25);
}


/* =========================================================
   ESTADO VAZIO
========================================================= */

.empty {

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    min-height: 260px;

    text-align: center;

    color: var(--muted);

    animation:
        slideIn .3s ease both;
}


.empty-icon {

    width: 58px;

    height: 58px;

    display: grid;

    place-items: center;

    margin-bottom: 12px;

    border-radius: 20px;

    color: var(--accent);

    background:
        var(--accent-soft);

    font-size: 25px;
}


.empty-title {

    color:
        rgba(255,255,255,.75);

    font-size: 14px;

    font-weight: 700;
}


.empty-text {

    max-width: 260px;

    margin-top: 5px;

    font-size: 10px;

    line-height: 1.5;
}


/* =========================================================
   BOTÃO FLUTUANTE
========================================================= */

.add-button {

    position: fixed;

    right:
        max(20px, env(safe-area-inset-right));

    bottom:
        max(20px, env(safe-area-inset-bottom));

    z-index: 1500;

    width: 58px;

    height: 58px;

    display: grid;

    place-items: center;

    border:
        1px solid
        rgba(255,255,255,.18);

    border-radius: 20px;

    color: #000;

    background:
        var(--accent);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.4);

    font-size: 25px;

    cursor: pointer;

    transition:
        transform .18s ease;
}


.add-button:active {

    transform:
        scale(.9);
}


/* =========================================================
   MENU LATERAL
========================================================= */

.menu-overlay {

    position: fixed;

    inset: 0;

    z-index: 2500;

    background:
        rgba(0,0,0,.5);

    backdrop-filter:
        blur(5px);

    -webkit-backdrop-filter:
        blur(5px);

    opacity: 0;

    pointer-events: none;

    transition:
        .3s ease;
}


.menu-overlay.open {

    opacity: 1;

    pointer-events: auto;
}


.side-menu {

    position: fixed;

    top: 0;

    left: 0;

    z-index: 3000;

    width: min(310px, 86vw);

    height: 100vh;

    padding:
        max(20px, env(safe-area-inset-top))
        18px
        20px;

    background:
        rgba(12,12,15,.94);

    border-right:
        1px solid var(--border);

    backdrop-filter:
        blur(30px);

    -webkit-backdrop-filter:
        blur(30px);

    transform:
        translateX(-105%);

    transition:
        transform .32s
        cubic-bezier(.2,.8,.2,1);
}


.side-menu.open {

    transform:
        translateX(0);
}


.menu-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 20px;
}


.menu-title {

    font-size: 20px;

    font-weight: 700;
}


.close-menu {

    width: 38px;

    height: 38px;

    border:
        1px solid var(--border);

    border-radius: 12px;

    color: white;

    background:
        rgba(255,255,255,.05);

    cursor: pointer;
}


.menu-section {

    margin-top: 20px;

    color: var(--muted);

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: 1px;
}


.menu-item {

    display: flex;

    align-items: center;

    gap: 11px;

    width: 100%;

    margin-top: 7px;

    padding: 12px;

    border:
        1px solid transparent;

    border-radius: 14px;

    color:
        rgba(255,255,255,.75);

    background:
        rgba(255,255,255,.035);

    cursor: pointer;

    transition:
        .18s ease;
}


.menu-item:hover {

    background:
        var(--accent-soft);

    border-color:
        var(--accent-border);

    color: white;

    transform:
        translateX(3px);
}


/* =========================================================
   MODAL
========================================================= */

.modal {

    position: fixed;

    inset: 0;

    z-index: 5000;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.62);

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .25s ease;
}


.modal.open {

    opacity: 1;

    pointer-events: auto;
}


.modal-card {

    width: min(100%, 480px);

    padding: 20px;

    border:
        1px solid var(--border);

    border-radius: 24px;

    background:
        rgba(15,15,18,.94);

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.65);

    transform:
        translateY(12px)
        scale(.97);

    transition:
        transform .25s ease;
}


.modal.open .modal-card {

    transform:
        translateY(0)
        scale(1);
}


.modal-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 15px;
}


.modal-title {

    font-size: 18px;

    font-weight: 700;
}


.modal-close {

    width: 35px;

    height: 35px;

    border:
        1px solid var(--border);

    border-radius: 11px;

    color: white;

    background:
        rgba(255,255,255,.05);

    cursor: pointer;
}


/* =========================================================
   FORM
========================================================= */

.field {

    margin-top: 11px;
}


.field label {

    display: block;

    margin-bottom: 5px;

    color: var(--muted);

    font-size: 10px;
}


.field input,
.field select {

    width: 100%;

    height: 48px;

    padding:
        0 13px;

    border:
        1px solid var(--border);

    border-radius: 14px;

    outline: none;

    color: white;

    background:
        rgba(0,0,0,.45);

    font-size: 13px;
}


.field input:focus,
.field select:focus {

    border-color:
        var(--accent-border);
}


.field select option {

    background: #111;
}


.form-buttons {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

    margin-top: 15px;
}


.primary-button,
.secondary-button {

    height: 47px;

    border: 0;

    border-radius: 14px;

    font-weight: 700;

    cursor: pointer;
}


.primary-button {

    color: #000;

    background:
        var(--accent);
}


.secondary-button {

    color: white;

    background:
        rgba(255,255,255,.07);

    border:
        1px solid var(--border);
}


/* =========================================================
   POMODORO
========================================================= */

.pomodoro {

    margin-top: 25px;

    padding:
        18px;

    border:
        1px solid var(--border);

    border-radius: 22px;

    background:
        var(--card);
}


.pomodoro-title {

    text-align: center;

    font-size: 12px;

    color: var(--muted);
}


.timer {

    position: relative;

    margin: 12px auto;

    width: 170px;
    height: 170px;

    display: grid;
    place-items: center;

    border-radius: 200px;

    background:
        conic-gradient(
            var(--accent) var(--progress, 0%),
            rgba(255,255,255,.07) 0
        );

    overflow: hidden;

    isolation: isolate;
}


.timer::before {

    content: "";

    position: absolute;

    inset: 8px;

    border-radius: 200px;

    background:
        #0a0a0d;
}


.timer span {

    position: relative;

    z-index: 1;

    font-size: 36px;

    font-weight: 700;

    color: var(--accent);

    text-shadow:
        0 0 18px
        var(--accent-soft);
}


.pomo-buttons {

    display: grid;

    grid-template-columns:
        1fr 1fr 1fr;

    gap: 7px;
}


.pomo-button {

    height: 40px;

    border:
        1px solid var(--border);

    border-radius: 12px;

    color: white;

    background:
        rgba(255,255,255,.055);

    cursor: pointer;

    font-size: 11px;

    font-weight: 600;
}


/* =========================================================
   TEMA
========================================================= */

.theme {

    margin-top: 8px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    padding: 11px;

    border:
        1px solid var(--border);

    border-radius: 14px;

    background:
        rgba(255,255,255,.035);
}


.theme span {

    color:
        rgba(255,255,255,.65);

    font-size: 11px;
}


#colorPicker {

    width: 42px;

    height: 30px;

    padding: 0;

    border: 0;

    border-radius: 9px;

    overflow: hidden;

    background: transparent;

    cursor: pointer;
}


/* =========================================================
   TOAST
========================================================= */

.toast {

    position: fixed;

    left: 50%;

    bottom:
        max(90px, calc(80px + env(safe-area-inset-bottom)));

    z-index: 6000;

    max-width:
        calc(100% - 40px);

    padding:
        10px
        15px;

    border:
        1px solid var(--border);

    border-radius: 999px;

    color: white;

    background:
        rgba(15,15,18,.92);

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);

    font-size: 11px;

    opacity: 0;

    pointer-events: none;

    transform:
        translate(-50%, 12px);

    transition:
        .25s ease;
}


.toast.show {

    opacity: 1;

    transform:
        translate(-50%, 0);
}


/* =========================================================
   RESPONSIVO
========================================================= */

@media (max-width: 430px) {

    .container {

        padding-left: 13px;

        padding-right: 13px;
    }


    .header {

        padding-left: 13px;

        padding-right: 13px;
    }


    .stats {

        gap: 6px;
    }


    .stat {

        padding: 11px;
    }


    .stat-number {

        font-size: 18px;
    }


    .task-actions {

        gap: 3px;
    }


    .task-button {

        width: 29px;

        height: 29px;
    }

}


@media (orientation: landscape) {

    .container,
    .header {

        max-width: 1050px;
    }


    .stats {

        grid-template-columns:
            repeat(3, 180px);
    }


    .task {

        min-height: 62px;
    }


    .grid {

        grid-template-columns:
            repeat(2, 1fr);
    }

}

</style>

</head>


<body>


<div class="fundo"></div>


<!-- =======================================================
     MENU
======================================================== -->

<div
    class="menu-overlay"
    id="menuOverlay"
    onclick="closeMenu()"
></div>


<aside
    class="side-menu"
    id="sideMenu"
>

    <div class="menu-header">

        <div class="menu-title">
            Planner
        </div>

        <button
            class="close-menu"
            onclick="closeMenu()"
        >
            ×
        </button>

    </div>


    <div class="menu-section">
        Categorias
    </div>


    <div
        class="menu-item"
        onclick="setFilter('Todos')"
    >
        ◉ &nbsp; Todas
    </div>


    <div
        class="menu-item"
        onclick="setFilter('Estudos')"
    >
        ◌ &nbsp; Estudos
    </div>


    <div
        class="menu-item"
        onclick="setFilter('Trabalho')"
    >
        ◌ &nbsp; Trabalho
    </div>


    <div
        class="menu-item"
        onclick="setFilter('Pessoal')"
    >
        ◌ &nbsp; Pessoal
    </div>


    <div
        class="menu-item"
        onclick="setFilter('Saúde')"
    >
        ◌ &nbsp; Saúde
    </div>


    <div class="menu-section">
        Aparência
    </div>


    <div class="theme">

        <span>
            Cor do sistema
        </span>

        <input
            type="color"
            id="colorPicker"
            value="#ff9db7"
        >

    </div>

</aside>


<!-- =======================================================
     CABEÇALHO
======================================================== -->

<header class="header">


    <div class="brand">

        <div class="brand-icon">
            ✓
        </div>

        <div class="brand-text">

            <div class="brand-title">
                Planner
            </div>

            <div
                class="brand-subtitle"
                id="subtitle"
            >
                Organize seu dia
            </div>

        </div>

    </div>


    <div class="header-actions">

        <button
            class="icon-button"
            onclick="openMenu()"
            aria-label="Menu"
        >
            ☰
        </button>

    </div>

</header>


<!-- =======================================================
     CONTEÚDO
======================================================== -->

<main class="container">


    <!-- ESTATÍSTICAS -->

    <section class="stats">

        <div class="stat">

            <div
                class="stat-number"
                id="totalCount"
            >
                0
            </div>

            <div class="stat-label">
                Total
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="pendingCount"
            >
                0
            </div>

            <div class="stat-label">
                Pendentes
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="doneCount"
            >
                0
            </div>

            <div class="stat-label">
                Concluídas
            </div>

        </div>

    </section>


    <!-- PESQUISA -->

    <div class="search">

        <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
        >

            <circle
                cx="11"
                cy="11"
                r="7"
            />

            <path
                d="M20 20l-4-4"
            />

        </svg>


        <input
            id="searchInput"
            type="text"
            placeholder="Pesquisar tarefas..."
            autocomplete="off"
            spellcheck="false"
        >

    </div>


    <!-- FILTROS -->

    <div
        class="filters"
        id="filters"
    >

        <button
            class="filter active"
            data-filter="Todos"
        >
            Todas
        </button>

        <button
            class="filter"
            data-filter="Estudos"
        >
            Estudos
        </button>

        <button
            class="filter"
            data-filter="Trabalho"
        >
            Trabalho
        </button>

        <button
            class="filter"
            data-filter="Pessoal"
        >
            Pessoal
        </button>

        <button
            class="filter"
            data-filter="Saúde"
        >
            Saúde
        </button>

    </div>


    <!-- TOOLBAR -->

    <div class="toolbar">

        <div
            class="result-count"
            id="resultCount"
        >
            0 tarefas
        </div>


        <select
            class="sort"
            id="sortSelect"
        >

            <option value="default">
                Ordem padrão
            </option>

            <option value="priority">
                Prioridade
            </option>

            <option value="name">
                Nome
            </option>

            <option value="status">
                Pendentes primeiro
            </option>

        </select>

    </div>


    <!-- LISTA -->

    <section id="list"></section>


    <!-- POMODORO -->

    <section class="pomodoro">

        <div class="pomodoro-title">
            Pomodoro
        </div>


        <div
            class="timer"
            id="timerCircle"
        >

            <span id="timer">
                25:00
            </span>

        </div>


        <div class="pomo-buttons">

            <button
                class="pomo-button"
                onclick="togglePomodoro()"
                id="pomoStart"
            >
                Iniciar
            </button>

            <button
                class="pomo-button"
                onclick="resetPomodoro()"
            >
                Resetar
            </button>

            <button
                class="pomo-button"
                onclick="addMinute()"
            >
                +1 min
            </button>

        </div>

    </section>


</main>


<!-- =======================================================
     ADICIONAR TAREFA
======================================================== -->

<button
    class="add-button"
    onclick="openTaskModal()"
    aria-label="Adicionar tarefa"
>
    +
</button>


<!-- =======================================================
     MODAL
======================================================== -->

<div
    class="modal"
    id="taskModal"
>

    <div class="modal-card">


        <div class="modal-header">

            <div
                class="modal-title"
                id="modalTitle"
            >
                Nova tarefa
            </div>


            <button
                class="modal-close"
                onclick="closeTaskModal()"
            >
                ×
            </button>

        </div>


        <div class="field">

            <label>
                Tarefa
            </label>

            <input
                id="taskInput"
                placeholder="O que você precisa fazer?"
                autocomplete="off"
            >

        </div>


        <div class="field">

            <label>
                Categoria
            </label>

            <select id="category">

                <option>
                    Estudos
                </option>

                <option>
                    Trabalho
                </option>

                <option>
                    Pessoal
                </option>

                <option>
                    Saúde
                </option>

            </select>

        </div>


        <div class="field">

            <label>
                Prioridade
            </label>

            <select id="priority">

                <option value="low">
                    Baixa
                </option>

                <option value="medium">
                    Média
                </option>

                <option value="high">
                    Alta
                </option>

            </select>

        </div>


        <div class="form-buttons">

            <button
                class="secondary-button"
                onclick="closeTaskModal()"
            >
                Cancelar
            </button>


            <button
                class="primary-button"
                onclick="saveTaskFromModal()"
            >
                Salvar
            </button>

        </div>


    </div>

</div>


<!-- =======================================================
     TOAST
======================================================== -->

<div
    class="toast"
    id="toast"
></div>


<script>

/* =========================================================
   ESTADO
========================================================= */

let tasks = [];

let currentFilter = "Todos";

let editingIndex = -1;

let currentSort = "default";


/* =========================================================
   CRIPTO
========================================================= */

function cryptoLoad(
    key
) {

    try {

        if (
            typeof Cripto === "undefined" ||
            typeof Cripto.carregar !== "function"
        ) {

            return null;

        }


        return Cripto.carregar(
            key
        );

    } catch (error) {

        console.error(
            "Cripto.carregar:",
            error
        );

        return null;

    }

}


function cryptoSave(
    key,
    value
) {

    try {

        if (
            typeof Cripto === "undefined" ||
            typeof Cripto.salvar !== "function"
        ) {

            return false;

        }


        Cripto.salvar(
            key,
            value
        );

        return true;

    } catch (error) {

        console.error(
            "Cripto.salvar:",
            error
        );

        return false;

    }

}


/* =========================================================
   CARREGAR TAREFAS
========================================================= */

function loadTasks() {

    try {

        const data =
            cryptoLoad(
                "tasks"
            );


        if (!data) {

            tasks = [];

            return;

        }


        const parsed =
            typeof data === "string"
                ? JSON.parse(data)
                : data;


        if (
            !Array.isArray(parsed)
        ) {

            tasks = [];

            return;

        }


        tasks =
            parsed
                .filter(task =>
                    task &&
                    typeof task.text === "string"
                )
                .map(task => ({

                    text:
                        task.text.trim(),

                    cat:
                        task.cat || "Pessoal",

                    priority:
                        task.priority || "low",

                    done:
                        Boolean(task.done),

                    created:
                        Number(
                            task.created
                        ) ||
                        Date.now(),

                    updated:
                        Number(
                            task.updated
                        ) ||
                        Date.now()

                }));


    } catch (error) {

        console.error(
            "Erro ao carregar tarefas:",
            error
        );

        tasks = [];

    }

}


/* =========================================================
   SALVAR
========================================================= */

function saveTasks() {

    cryptoSave(
        "tasks",
        JSON.stringify(
            tasks
        )
    );

}


/* =========================================================
   TEMA
========================================================= */

function loadTheme() {

    const saved =
        cryptoLoad(
            "accent"
        );


    if (
        !saved ||
        typeof saved !== "string"
    ) {

        return;

    }


    applyTheme(
        saved
    );


    const picker =
        document.getElementById(
            "colorPicker"
        );


    if (picker) {

        picker.value =
            saved;

    }

}


function applyTheme(
    color
) {

    document.documentElement
        .style
        .setProperty(
            "--accent",
            color
        );


    document.documentElement
        .style
        .setProperty(
            "--accent-soft",
            hexToRGBA(
                color,
                .14
            )
        );


    document.documentElement
        .style
        .setProperty(
            "--accent-border",
            hexToRGBA(
                color,
                .25
            )
        );

}


function hexToRGBA(
    hex,
    alpha
) {

    if (
        !/^#[0-9A-F]{6}$/i.test(
            hex
        )
    ) {

        return `rgba(255,157,183,${alpha})`;

    }


    const r =
        parseInt(
            hex.slice(1,3),
            16
        );


    const g =
        parseInt(
            hex.slice(3,5),
            16
        );


    const b =
        parseInt(
            hex.slice(5,7),
            16
        );


    return `rgba(${r},${g},${b},${alpha})`;

}


document
    .getElementById(
        "colorPicker"
    )
    .addEventListener(
        "input",
        event => {

            const color =
                event.target.value;


            applyTheme(
                color
            );


            cryptoSave(
                "accent",
                color
            );

        }
    );


/* =========================================================
   MODAL
========================================================= */

function openTaskModal(
    index = -1
) {

    editingIndex =
        index;


    const modal =
        document.getElementById(
            "taskModal"
        );


    const title =
        document.getElementById(
            "modalTitle"
        );


    if (
        index >= 0 &&
        tasks[index]
    ) {

        title.textContent =
            "Editar tarefa";


        document.getElementById(
            "taskInput"
        ).value =
            tasks[index].text;


        document.getElementById(
            "category"
        ).value =
            tasks[index].cat;


        document.getElementById(
            "priority"
        ).value =
            tasks[index].priority;

    } else {

        title.textContent =
            "Nova tarefa";


        document.getElementById(
            "taskInput"
        ).value =
            "";


        document.getElementById(
            "category"
        ).value =
            "Estudos";


        document.getElementById(
            "priority"
        ).value =
            "low";

    }


    modal.classList.add(
        "open"
    );


    setTimeout(
        () => {

            document
                .getElementById(
                    "taskInput"
                )
                .focus();

        },
        100
    );

}


function closeTaskModal() {

    document
        .getElementById(
            "taskModal"
        )
        .classList.remove(
            "open"
        );


    editingIndex =
        -1;

}


/* =========================================================
   SALVAR TAREFA DO MODAL
========================================================= */

function saveTaskFromModal() {

    const input =
        document.getElementById(
            "taskInput"
        );


    const text =
        input.value.trim();


    if (!text) {

        input.focus();

        showToast(
            "Digite uma tarefa."
        );

        return;

    }


    const cat =
        document.getElementById(
            "category"
        ).value;


    const priority =
        document.getElementById(
            "priority"
        ).value;


    if (
        editingIndex >= 0 &&
        tasks[editingIndex]
    ) {

        tasks[editingIndex].text =
            text;

        tasks[editingIndex].cat =
            cat;

        tasks[editingIndex].priority =
            priority;

        tasks[editingIndex].updated =
            Date.now();


        showToast(
            "Tarefa atualizada."
        );

    } else {

        tasks.unshift({

            text,

            cat,

            priority,

            done: false,

            created:
                Date.now(),

            updated:
                Date.now()

        });


        showToast(
            "Tarefa adicionada."
        );

    }


    saveTasks();

    closeTaskModal();

    render();

}


/* =========================================================
   CONCLUIR
========================================================= */

function toggleTask(
    index
) {

    if (
        !tasks[index]
    ) {

        return;

    }


    tasks[index].done =
        !tasks[index].done;


    tasks[index].updated =
        Date.now();


    saveTasks();

    render();


    showToast(
        tasks[index].done
            ? "Tarefa concluída."
            : "Tarefa reaberta."
    );

}


/* =========================================================
   EXCLUIR
========================================================= */

function deleteTask(
    index
) {

    if (
        !tasks[index]
    ) {

        return;

    }


    const task =
        tasks[index];


    tasks.splice(
        index,
        1
    );


    saveTasks();

    render();


    showToast(
        `"${task.text}" removida.`
    );

}


/* =========================================================
   FILTRO
========================================================= */

function setFilter(
    filter
) {

    currentFilter =
        filter;


    document
        .querySelectorAll(
            ".filter"
        )
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.filter ===
                    filter
            );

        });


    closeMenu();

    render();

}


document
    .querySelectorAll(
        ".filter"
    )
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                setFilter(
                    button.dataset.filter
                );

            }
        );

    });


/* =========================================================
   ORDENAÇÃO
========================================================= */

document
    .getElementById(
        "sortSelect"
    )
    .addEventListener(
        "change",
        event => {

            currentSort =
                event.target.value;

            render();

        }
    );


/* =========================================================
   PESQUISA
========================================================= */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        render
    );


/* =========================================================
   FILTRAR + ORDENAR
========================================================= */

function getVisibleTasks() {

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLocaleLowerCase(
                "pt-BR"
            )
            .trim();


    let result =
        tasks.filter(task => {

            const matchesFilter =
                currentFilter === "Todos" ||
                task.cat === currentFilter;


            const matchesSearch =
                !search ||
                task.text
                    .toLocaleLowerCase(
                        "pt-BR"
                    )
                    .includes(
                        search
                    );


            return (
                matchesFilter &&
                matchesSearch
            );

        });


    if (
        currentSort === "name"
    ) {

        result.sort(
            (a,b) =>
                a.text.localeCompare(
                    b.text,
                    "pt-BR",
                    {
                        sensitivity:
                            "base"
                    }
                )
        );

    }


    if (
        currentSort === "priority"
    ) {

        const weight = {

            high: 3,

            medium: 2,

            low: 1

        };


        result.sort(
            (a,b) =>
                weight[b.priority] -
                weight[a.priority]
        );

    }


    if (
        currentSort === "status"
    ) {

        result.sort(
            (a,b) =>
                Number(a.done) -
                Number(b.done)
        );

    }


    return result;

}


/* =========================================================
   TEXTO DE PRIORIDADE
========================================================= */

function priorityName(
    priority
) {

    if (
        priority === "high"
    ) {

        return "Alta";

    }


    if (
        priority === "medium"
    ) {

        return "Média";

    }


    return "Baixa";

}


/* =========================================================
   RENDER
========================================================= */

function render() {

    const list =
        document.getElementById(
            "list"
        );


    const visible =
        getVisibleTasks();


    updateStats();


    document
        .getElementById(
            "resultCount"
        )
        .textContent =
            `${visible.length} ${
                visible.length === 1
                    ? "tarefa"
                    : "tarefas"
            }`;


    list.innerHTML =
        "";


    if (!visible.length) {

        list.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ✓
                </div>

                <div class="empty-title">
                    ${
                        tasks.length
                            ? "Nada encontrado"
                            : "Tudo tranquilo por aqui"
                    }
                </div>

                <div class="empty-text">
                    ${
                        tasks.length
                            ? "Tente mudar o filtro ou a pesquisa."
                            : "Adicione sua primeira tarefa usando o botão +."
                    }
                </div>

            </div>

        `;

        return;

    }


    const fragment =
        document.createDocumentFragment();


    visible.forEach(
        task => {

            const realIndex =
                tasks.indexOf(
                    task
                );


            const article =
                document.createElement(
                    "article"
                );


            article.className =
                `task ${task.priority} ${
                    task.done
                        ? "done"
                        : ""
                }`;


            /* CHECK */

            const check =
                document.createElement(
                    "button"
                );


            check.className =
                "check";


            check.textContent =
                "✓";


            check.title =
                "Concluir";


            check.addEventListener(
                "click",
                () =>
                    toggleTask(
                        realIndex
                    )
            );


            /* CONTEÚDO */

            const content =
                document.createElement(
                    "div"
                );


            content.className =
                "task-content";


            const text =
                document.createElement(
                    "div"
                );


            text.className =
                "task-text";


            text.textContent =
                task.text;


            const meta =
                document.createElement(
                    "div"
                );


            meta.className =
                "task-meta";


            meta.innerHTML =
                `<span class="priority-dot"></span>
                 ${task.cat}
                 •
                 ${priorityName(task.priority)}`;


            content.appendChild(
                text
            );


            content.appendChild(
                meta
            );


            /* AÇÕES */

            const actions =
                document.createElement(
                    "div"
                );


            actions.className =
                "task-actions";


            const edit =
                document.createElement(
                    "button"
                );


            edit.className =
                "task-button";


            edit.textContent =
                "✎";


            edit.title =
                "Editar";


            edit.addEventListener(
                "click",
                () =>
                    openTaskModal(
                        realIndex
                    )
            );


            const del =
                document.createElement(
                    "button"
                );


            del.className =
                "task-button delete";


            del.textContent =
                "×";


            del.title =
                "Excluir";


            del.addEventListener(
                "click",
                () =>
                    deleteTask(
                        realIndex
                    )
            );


            actions.appendChild(
                edit
            );


            actions.appendChild(
                del
            );


            article.appendChild(
                check
            );


            article.appendChild(
                content
            );


            article.appendChild(
                actions
            );


            fragment.appendChild(
                article
            );

        }
    );


    list.appendChild(
        fragment
    );

}


/* =========================================================
   ESTATÍSTICAS
========================================================= */

function updateStats() {

    const total =
        tasks.length;


    const done =
        tasks.filter(
            task => task.done
        ).length;


    const pending =
        total - done;


    document
        .getElementById(
            "totalCount"
        )
        .textContent =
            total;


    document
        .getElementById(
            "pendingCount"
        )
        .textContent =
            pending;


    document
        .getElementById(
            "doneCount"
        )
        .textContent =
            done;


    document
        .getElementById(
            "subtitle"
        )
        .textContent =
            pending
                ? `${pending} tarefa${
                    pending === 1
                        ? ""
                        : "s"
                  } pendente${
                    pending === 1
                        ? ""
                        : "s"
                  }`
                : "Tudo em dia";
}


/* =========================================================
   MENU
========================================================= */

function openMenu() {

    document
        .getElementById(
            "sideMenu"
        )
        .classList.add(
            "open"
        );


    document
        .getElementById(
            "menuOverlay"
        )
        .classList.add(
            "open"
        );

}


function closeMenu() {

    document
        .getElementById(
            "sideMenu"
        )
        .classList.remove(
            "open"
        );


    document
        .getElementById(
            "menuOverlay"
        )
        .classList.remove(
            "open"
        );

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;


function showToast(
    message
) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =========================================================
   POMODORO
========================================================= */

const POMO_TOTAL =
    25 * 60;


let pomodoroTime =
    POMO_TOTAL;


let pomodoroInterval =
    null;


function updatePomodoro() {

    const minutes =
        Math.floor(
            pomodoroTime / 60
        );


    const seconds =
        pomodoroTime % 60;


    document
        .getElementById(
            "timer"
        )
        .textContent =
            `${minutes}:${
                seconds < 10
                    ? "0"
                    : ""
            }${seconds}`;


    const progress =
        (
            (POMO_TOTAL -
                pomodoroTime) /
            POMO_TOTAL
        ) * 100;


    document
        .getElementById(
            "timerCircle"
        )
        .style
        .setProperty(
            "--progress",
            `${progress}%`
        );

}


function togglePomodoro() {

    if (
        pomodoroInterval
    ) {

        clearInterval(
            pomodoroInterval
        );


        pomodoroInterval =
            null;


        document
            .getElementById(
                "pomoStart"
            )
            .textContent =
                "Continuar";


        return;

    }


    if (
        pomodoroTime <= 0
    ) {

        pomodoroTime =
            POMO_TOTAL;

    }


    document
        .getElementById(
            "pomoStart"
        )
        .textContent =
            "Pausar";


    pomodoroInterval =
        setInterval(
            () => {

                pomodoroTime--;

                updatePomodoro();


                if (
                    pomodoroTime <= 0
                ) {

                    clearInterval(
                        pomodoroInterval
                    );


                    pomodoroInterval =
                        null;


                    pomodoroTime =
                        POMO_TOTAL;


                    document
                        .getElementById(
                            "pomoStart"
                        )
                        .textContent =
                            "Iniciar";


                    updatePomodoro();


                    showToast(
                        "Pomodoro finalizado!"
                    );

                }

            },
            1000
        );

}


function resetPomodoro() {

    clearInterval(
        pomodoroInterval
    );


    pomodoroInterval =
        null;


    pomodoroTime =
        POMO_TOTAL;


    document
        .getElementById(
            "pomoStart"
        )
        .textContent =
            "Iniciar";


    updatePomodoro();

}


function addMinute() {

    pomodoroTime +=
        60;


    if (
        pomodoroTime >
        POMO_TOTAL
    ) {

        pomodoroTime =
            POMO_TOTAL;

    }


    updatePomodoro();

}


/* =========================================================
   TECLADO
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeMenu();

            closeTaskModal();

        }


        if (
            event.key === "Enter" &&
            document.activeElement?.id ===
                "taskInput"
        ) {

            saveTaskFromModal();

        }

    }
);


/* =========================================================
   FECHAR MODAL AO CLICAR FORA
========================================================= */

document
    .getElementById(
        "taskModal"
    )
    .addEventListener(
        "click",
        event => {

            if (
                event.target.id ===
                "taskModal"
            ) {

                closeTaskModal();

            }

        }
    );


/* =========================================================
   WALLPAPER ANDROID
========================================================= */

window.addEventListener(
    "load",
    () => {

        let wall = "";


        try {

            if (
                typeof Android !== "undefined" &&
                typeof Android.getWallpaperUrl ===
                    "function"
            ) {

                wall =
                    Android.getWallpaperUrl();

            }

        } catch (error) {

            wall = "";

        }


        if (
            wall &&
            typeof wall === "string"
        ) {

            document
                .querySelector(
                    ".fundo"
                )
                .style
                .backgroundImage =
                    `url("${wall.replace(
                        /"/g,
                        '\\"'
                    )}")`;

        }

    }
);


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

loadTheme();

loadTasks();

updatePomodoro();

render();

</script>
