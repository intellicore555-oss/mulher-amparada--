<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Mulher Amparada</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:white;

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow-x:hidden;

    font-family:'Quicksand',sans-serif;

    padding:25px;
}

/* Container */
.container{
    width:min(92%, 850px);
    text-align:center;
}

/* Avatar */
.avatar{
    width:220px;
    height:220px;

    margin:auto;
    margin-bottom:42px;

    border-radius:50%;

    overflow:hidden;

    position:relative;

    animation:float 5s ease-in-out infinite;
}

/* Glow */
.avatar::before{
    content:"";

    position:absolute;
    inset:-4px;

    border-radius:50%;

    background:
    linear-gradient(
        135deg,
        #ffffff,
        #7d5cff,
        #87ceeb
    );

    z-index:-1;

    filter:blur(12px);
    opacity:.7;
}

/* Imagem */
.avatar img{
    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:50%;

    border:3px solid rgba(255,255,255,.12);
}

/* Texto pequeno */
.text-top{
    font-size:1.15rem;
    color:rgba(255,255,255,.58);

    line-height:1.8;

    margin-bottom:28px;

    letter-spacing:.4px;
}

/* Texto principal */
.text-main{
    font-size:clamp(2rem, 5vw, 3.5rem);
    font-weight:700;

    line-height:1.35;
}

/* Destaque */
.highlight{
    color:pink;
}

/* Linha */
.line{
    width:70px;
    height:4px;

    margin:28px auto;

    border-radius:999px;

    background:
    linear-gradient(
        90deg,
        #7d5cff,
        #87ceeb
    );

    box-shadow:
    0 0 18px rgba(125,92,255,.35);
}

/* Footer */
.footer{
    margin-top:45px;

    color:rgba(255,255,255,.22);

    font-size:12px;

    letter-spacing:1px;
}

/* Anim */
@keyframes shine{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-8px);
    }

    100%{
        transform:translateY(0px);
    }

}

/* Mobile */
@media(max-width:600px){

    .avatar{
        width:180px;
        height:180px;
    }

    .text-top{
        font-size:1rem;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="avatar">
        <img src="user1.png" alt="Usuário">
    </div>


    <div class="text-main">

        <span class="highlight">
            Mulher Amparada 
        </span>
        
        <br><br>

        <span class="highlight">
            ✅️Mulher Amparada 
        </span>
        
            <br><br>

<span class="highlight">
            Mulher Amparada pela liberdade feminina
        </span>
    <br><br>

    </div>
</div>

</body>
</html>
